[project]
name = "langgraph-rag"
version = "0.1.0"
description = "Параллельный RAG-эксперимент: LangChain + LangGraph по Confluence (PGVector + BM25 hybrid)."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "langchain-postgres>=0.0.12",
    "langchain-huggingface>=0.1",
    "langchain-litellm>=0.2",
    "litellm>=1.50",
    "sentence-transformers>=3",
    "pydantic-settings>=2",
    "atlassian-python-api>=3.41",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
langgraph-rag = "langgraph_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

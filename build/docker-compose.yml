services:
  chainlit:
    image: boba:${BOBA_TAG}
    hostname: chainlit
    container_name: chainlit
    entrypoint: ["boba-chainlit"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/chainlit-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
      - CHAINLIT_URL_PREFIX=/boba
    volumes:
      - ./local:/app/local
    expose:
      - "8501"
    ports:
      - 127.0.0.1:8501:8501
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501${CHAINLIT_URL_PREFIX}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - chainlit
    restart: unless-stopped

  chainlit2:
    image: boba:${BOBA_TAG}
    hostname: chainlit2
    container_name: chainlit2
    entrypoint: ["python3", "-m", "boba.chainlit2.main"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/chainlit2-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
      - CHAINLIT_URL_PREFIX=/boba2
      - KRB5_KTNAME=/etc/krb5.keytab
    volumes:
      - ./local:/app/local
      # keytab делает samba-ad: local/krb5.keytab
      - ./local/krb5.keytab:/etc/krb5.keytab:ro
      - ./local/krb5.conf:/etc/krb5.conf:ro
    expose:
      - "8502"
    ports:
      - 127.0.0.1:8502:8502
    networks:
      default:
        aliases:
          - chainlit2
          # FQDN под SPN keytab (HTTP/chainlit2.loshara.com)
          - chainlit2.loshara.com
    restart: unless-stopped

  # cli agent
  cli-agent:
    image: boba:${BOBA_TAG}
    hostname: cli-agent
    container_name: cli-agent
    entrypoint: ["boba-cli"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ./local:/app/local

  # [cli.kb.bootstrap] — накатывает миграции (схема таблиц)
  kb-bootstrap:
    image: boba:${BOBA_TAG}
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.kb_bootstrap"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ./local:/app/local

  # Active Directory
  samba-ad:
    image: boba-ad:latest
    hostname: dc1
    container_name: samba-ad
    env_file:
      - .env
    environment:
      - REALM=LOSHARA.COM
      - DOMAIN=LOSHARA
      - DC_HOSTNAME=dc1
      - DNS_FORWARDER=8.8.8.8
      - SVC_HOST=chainlit2
      - KEYTAB_OUT=/out/krb5.keytab
    # xattr_tdb снимает нужду в CAP_SYS_ADMIN; SYS_NICE — для приоритетов samba
    cap_add:
      - SYS_NICE
    volumes:
      - samba-ad-data:/var/lib/samba
      - samba-ad-etc:/etc/samba
      # сюда пишется keytab
      - ./local:/out
    ports:
      - "127.0.0.1:88:88"
      - "127.0.0.1:88:88/udp"
      - "127.0.0.1:464:464"
      - "127.0.0.1:464:464/udp"
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
      - "127.0.0.1:3268:3268"
      - "127.0.0.1:3269:3269"
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':88 ' && ss -tlnp | grep -q ':389 ' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      default:
        aliases:
          - dc1
          - dc1.loshara.com
    restart: unless-stopped

volumes:
  samba-ad-data:
  samba-ad-etc:

networks:
  default:
    name: docker
    external: true

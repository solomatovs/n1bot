services:
  chainlit:
    image: boba:${BOBA_TAG}
    hostname: chainlit
    container_name: chainlit
    entrypoint: ["/bin/sh", "-c", "set -a && . \"$$BOBA_DIR/conf/boba.env\" && set +a && export BOBA_CONFIG_PATH=/app/local/config.toml && export CHAINLIT_APP_ROOT=/app/local && exec boba-chainlit \"$$@\"", "--"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - KRB5_CLIENT_KTNAME=/etc/boba-svc.keytab
      - KRB5CCNAME=FILE:/tmp/krb5cc
      - PGGSSENCMODE=prefer
    volumes:
      - ${HOST_DIR}/data/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/data/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/data/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/data/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/data/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/data/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/data/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/data/keytab/boba-svc.keytab:/etc/boba-svc.keytab:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8501:8501
    restart: unless-stopped

  chainlit-lite:
    image: boba:${BOBA_TAG}
    hostname: chainlit-lite
    container_name: chainlit-lite
    entrypoint: ["/bin/sh", "-c", "set -a && . \"$$BOBA_DIR/conf/boba.env\" && set +a && export BOBA_CONFIG_PATH=/app/local/config.toml && export CHAINLIT_APP_ROOT=/app/local && exec boba-chainlit \"$$@\"", "--"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - KRB5_CLIENT_KTNAME=/etc/boba-svc.keytab
      - KRB5CCNAME=FILE:/tmp/krb5cc
      - PGGSSENCMODE=prefer
    volumes:
      - ${HOST_DIR}/data/chainlit-lite/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/data/chainlit-lite/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/data/chainlit-lite/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/data/chainlit-lite/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/data/chainlit-lite/public:/app/local/public:ro
      - ${HOST_DIR}/data/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/data/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/data/keytab/boba-svc.keytab:/etc/boba-svc.keytab:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8502:8501
    restart: unless-stopped

  chainlit2:
    image: boba:${BOBA_TAG}
    hostname: chainlit2
    container_name: chainlit2
    entrypoint: ["/bin/sh", "-c", "set -a && . \"$$BOBA_DIR/conf/boba.env\" && set +a && export BOBA_CONFIG_PATH=/app/local/config.toml && export CHAINLIT_APP_ROOT=/app/local && exec boba-chainlit2 \"$$@\"", "--"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - KRB5_CLIENT_KTNAME=/etc/boba-svc.keytab
      - KRB5CCNAME=FILE:/tmp/krb5cc
      - PGGSSENCMODE=prefer
    volumes:
      - ${HOST_DIR}/data/chainlit2/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/data/chainlit2/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/data/chainlit2/public:/app/local/public:ro
      - ${HOST_DIR}/data/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/data/keytab/boba-svc.keytab:/etc/boba-svc.keytab:ro
      - ${HOST_DIR}/data/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
      - ${HOST_DIR}/artifacts/sandbox-rootfs:/app/boba/${BOBA_TAG}/third/sandbox-rootfs:ro
      - ${HOST_DIR}/data/chainlit2/workspace:/app/local/workspace:rw
    devices:
      - /dev/fuse
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    ports:
      - 127.0.0.1:8503:8501
    restart: unless-stopped

  cli-agent:
    image: boba:${BOBA_TAG}
    hostname: cli-agent
    container_name: cli-agent
    entrypoint: ["/bin/sh", "-c", "set -a && . \"$$BOBA_DIR/conf/boba.env\" && set +a && export BOBA_CONFIG_PATH=/app/local/config.toml && export CHAINLIT_APP_ROOT=/app/local && exec boba-cli \"$$@\"", "--"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - KRB5_CLIENT_KTNAME=/etc/boba-svc.keytab
      - KRB5CCNAME=FILE:/tmp/krb5cc
      - PGGSSENCMODE=prefer
    volumes:
      - ${HOST_DIR}/data/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/data/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/data/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/data/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/data/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro

  kb-bootstrap:
    image: boba:${BOBA_TAG}
    hostname: kb-bootstrap
    container_name: kb-bootstrap
    entrypoint: ["/bin/sh", "-c", "set -a && . \"$$BOBA_DIR/conf/boba.env\" && set +a && export BOBA_CONFIG_PATH=/app/local/config.toml && export CHAINLIT_APP_ROOT=/app/local && exec python3 -m boba.tool.kb.cli.kb_bootstrap \"$$@\"", "--"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - KRB5_CLIENT_KTNAME=/etc/boba-svc.keytab
      - KRB5CCNAME=FILE:/tmp/krb5cc
      - PGGSSENCMODE=prefer
    volumes:
      - ${HOST_DIR}/data/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/data/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/data/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/data/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/data/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/data/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/data/keytab/boba-svc.keytab:/etc/boba-svc.keytab:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro

networks:
  default:
    name: docker
    external: true

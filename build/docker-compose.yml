services:
  chainlit:
    image: boba:${BOBA_TAG}
    hostname: chainlit
    container_name: chainlit
    entrypoint: ["boba-chainlit"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/chainlit-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
      - CHAINLIT_URL_PREFIX=/boba
    volumes:
      - ./local:/app/local
    expose:
      - "8501"
    ports:
      - 127.0.0.1:8501:8501
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501${CHAINLIT_URL_PREFIX}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - chainlit
    restart: unless-stopped

  chainlit2:
    image: boba:${BOBA_TAG}
    hostname: chainlit2
    container_name: chainlit2
    profiles: ["chainlit2"]
    entrypoint: ["python3", "-m", "boba.chainlit2.main"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/chainlit2-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
      - CHAINLIT_URL_PREFIX=/boba2
      - KRB5_KTNAME=/etc/krb5.keytab
    volumes:
      - ./local:/app/local
      - ./local/krb5.keytab:/etc/krb5.keytab:ro
      - ./local/krb5.conf:/etc/krb5.conf:ro
    expose:
      - "8502"
    ports:
      - 127.0.0.1:8502:8502
    networks:
      default:
        aliases:
          - chainlit2
    restart: unless-stopped

  # cli agent
  cli-agent:
    image: boba:${BOBA_TAG}
    hostname: cli-agent
    container_name: cli-agent
    profiles: ["cli-agent"]
    entrypoint: ["boba-cli"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ./local:/app/local

  # [cli.kb.bootstrap] — накатывает миграции (схема таблиц)
  kb-bootstrap:
    image: boba:${BOBA_TAG}
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.kb_bootstrap"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config-${BOBA_TAG}.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ./local:/app/local

networks:
  default:
    name: docker
    external: true

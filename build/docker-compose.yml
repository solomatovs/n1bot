services:
  chainlit:
    image: boba:${BOBA_TAG}
    hostname: chainlit
    container_name: chainlit
    entrypoint: ["boba-chainlit"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8501:8501
    restart: unless-stopped

  chainlit-lite:
    image: boba:${BOBA_TAG}
    hostname: chainlit-lite
    container_name: chainlit-lite
    entrypoint: ["boba-chainlit"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit-lite/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit-lite/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit-lite/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit-lite/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit-lite/public:/app/local/public:ro
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8502:8501
    restart: unless-stopped

  chainlit2:
    image: boba:${BOBA_TAG}
    hostname: chainlit2
    container_name: chainlit2
    entrypoint: ["python3", "-m", "boba.chainlit2.main"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit2/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit2/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit2/public:/app/local/public:ro
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8503:8501
    restart: unless-stopped

  # бэкенд для hermes-ui: gateway с платформой api_server.
  # s6-сервис main-hermes в образе — no-op, поэтому команду задаём явно
  hermes:
    image: dmp/hermes:${HERMES_TAG:-2026.7.20}
    hostname: hermes
    container_name: hermes
    command: ["gateway", "run"]
    environment:
      # под этим uid/gid пишется /opt/data, чтобы файлы оставались
      # доступными на хосте
      - HERMES_UID=1000
      - HERMES_GID=984
      # профиль на пользователя: обращения идут на /p/<профиль>/v1/...,
      # у каждого профиля свой HERMES_HOME и свой state.db
      - GATEWAY_MULTIPLEX_PROFILES=1
      # API_SERVER_KEY/HOST/PORT сюда не выносим: при multiplex_profiles
      # gateway перечитывает конфиг под скоупом профиля, где секреты берутся
      # только из его .env. Ключ лежит в local/hermes-agent/data/.env
      # админка (модели, MCP, skills, профили) как s6-сервис в этом же контейнере.
      # держим на loopback: на внешнем адресе дашборд требует auth-провайдера
      # и иначе уходит в рестарт-цикл. доступ — через docker exec или ssh-туннель
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=127.0.0.1
      - HERMES_DASHBOARD_PORT=9119
    volumes:
      - ${HOST_DIR}/local/hermes-agent/data:/opt/data:rw
    ports:
      - 127.0.0.1:8642:8642
    restart: unless-stopped

  hermes-ui:
    image: boba:${BOBA_TAG}
    hostname: hermes-ui
    container_name: hermes-ui
    depends_on:
      - hermes
    entrypoint: ["python3", "-m", "boba.hermes.main"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ${HOST_DIR}/local/hermes/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/hermes/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/hermes/public:/app/local/public:ro
      # HERMES_HOME агента: профиль пользователя заводится созданием каталога
      # profiles/<профиль> — см. [hermes].data_dir в config.toml
      - ${HOST_DIR}/local/hermes-agent/data:/opt/hermes-data:rw
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
    ports:
      - 127.0.0.1:8504:8501
    restart: unless-stopped

  cli-agent:
    image: boba:${BOBA_TAG}
    hostname: cli-agent
    container_name: cli-agent
    entrypoint: ["boba-cli"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro

  kb-bootstrap:
    image: boba:${BOBA_TAG}
    hostname: kb-bootstrap
    container_name: kb-bootstrap
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.kb_bootstrap"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro

networks:
  default:
    name: docker
    external: true

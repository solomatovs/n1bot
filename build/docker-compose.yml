services:
  chainlit:
    image: boba:${BOBA_TAG}
    hostname: chainlit
    user: "${BOBA_UID:-1000}:${BOBA_GID:-984}"
    container_name: chainlit
    entrypoint: ["/bin/sh", "-c", "set -a && . \"$$BOBA_DIR/conf/boba.env\" && set +a && export BOBA_CONFIG_PATH=/app/local/config.toml && exec python3 -m boba.chainlit.main \"$$@\"", "--"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - KRB5_CLIENT_KTNAME=/etc/boba/krb5.keytab
      - KRB5CCNAME=FILE:/tmp/krb5cc
      - PGGSSENCMODE=prefer
      - CHAINLIT_COOKIE_SAMESITE=none
    volumes:
      - ${HOST_DIR}/data/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/data/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/data/keytab/boba-svc.keytab:/etc/boba/krb5.keytab:ro
      - ${HOST_DIR}/data/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/sandbox:/app/boba/sandbox:ro
      - ${HOST_DIR}/artifacts/sandbox/site:/app/boba/app/${BOBA_TAG}/boba-tool:ro
      - ${HOST_DIR}/data/chainlit/boba-data:/app/boba/data:rw
    devices:
      - /dev/fuse
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    ports:
      - 127.0.0.1:8503:8501
    restart: unless-stopped

networks:
  default:
    name: docker
    external: true

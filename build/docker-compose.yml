services:
  chainlit:
    image: boba:${BOBA_TAG}
    hostname: chainlit
    container_name: chainlit
    entrypoint: ["boba-chainlit"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8501:8501
    restart: unless-stopped

  chainlit-lite:
    image: boba:${BOBA_TAG}
    hostname: chainlit-lite
    container_name: chainlit-lite
    entrypoint: ["boba-chainlit"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit-lite/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit-lite/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit-lite/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit-lite/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit-lite/public:/app/local/public:ro
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8502:8501
    restart: unless-stopped

  chainlit2:
    image: boba:${BOBA_TAG}
    hostname: chainlit2
    container_name: chainlit2
    entrypoint: ["python3", "-m", "boba.chainlit2.main"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit2/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit2/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit2/public:/app/local/public:ro
      - ${HOST_DIR}/local/keytab/krb5.keytab:/etc/krb5.keytab:ro
      - ${HOST_DIR}/local/keytab/krb5.conf:/etc/krb5.conf:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro
    ports:
      - 127.0.0.1:8503:8501
    restart: unless-stopped

  cli-agent:
    image: boba:${BOBA_TAG}
    hostname: cli-agent
    container_name: cli-agent
    entrypoint: ["boba-cli"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro

  kb-bootstrap:
    image: boba:${BOBA_TAG}
    hostname: kb-bootstrap
    container_name: kb-bootstrap
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.kb_bootstrap"]
    environment:
      - BOBA_CONFIG_PATH=/app/local/config.toml
      - CHAINLIT_APP_ROOT=/app/local
      - FASTEMBED_CACHE_DIR=/app/local
    volumes:
      - ${HOST_DIR}/local/chainlit/config.toml:/app/local/config.toml:ro
      - ${HOST_DIR}/local/chainlit/workspaces:/app/local/workspaces:rw
      - ${HOST_DIR}/local/chainlit/prompts:/app/local/prompts:ro
      - ${HOST_DIR}/local/chainlit/.chainlit:/app/local/.chainlit:ro
      - ${HOST_DIR}/local/chainlit/public:/app/local/public:ro
      - ${HOST_DIR}/artifacts/fastembed:/app/local/fastembed:ro

networks:
  default:
    name: docker
    external: true

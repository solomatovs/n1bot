# Только запуск. Сборка образа — через `make build` (docker build), см. ./Dockerfile.
# Тег по умолчанию latest, чтобы compose поднимался без заданного BOBA_TAG.
# local/ живёт в offline-репо artifacts → пути ./artifacts/local.
x-boba-base: &boba-base
  image: boba:${BOBA_TAG:-latest}
  env_file:
    - ./artifacts/local/.env
  volumes:
    - ./artifacts/local:/app/local

services:
  chainlit:
    <<: *boba-base
    hostname: boba-chainlit
    entrypoint: ["boba-chainlit"]
    expose:
      - "8501"
    ports:
      - 127.0.0.1:8501:8501
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501${CHAINLIT_URL_PREFIX}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - boba-chainlit
    restart: unless-stopped

  # chainlit2 (langgraph + kerberos SSO/делегирование); запускается модулем
  # (console-script нет), читает /app/local/chainlit2.toml. profile=chainlit2,
  # чтобы не поднимался вместе с chainlit v1 по умолчанию.
  # Для kerberos смонтируйте keytab и krb5.conf (см. ниже) и задайте SPN в конфиге.
  chainlit2:
    <<: *boba-base
    profiles: ["chainlit2"]
    hostname: boba-chainlit2
    entrypoint: ["python3", "-m", "boba.chainlit2.main"]
    # keytab + krb5.conf нужны для SPNEGO-accept и делегирования (положить в artifacts/local/)
    volumes:
      - ./artifacts/local:/app/local
      - ./artifacts/local/krb5.keytab:/etc/krb5.keytab:ro
      - ./artifacts/local/krb5.conf:/etc/krb5.conf:ro
    environment:
      - KRB5_KTNAME=/etc/krb5.keytab
    expose:
      - "8502"
    ports:
      - 127.0.0.1:8502:8502
    networks:
      default:
        aliases:
          - boba-chainlit2
    restart: unless-stopped

  # cli agent
  cli-agent:
    <<: *boba-base
    profiles: ["cli"]
    entrypoint: ["boba-cli"]

  # [cli.kb.bootstrap] — накатывает миграции (схема таблиц)
  kb-bootstrap:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.kb_bootstrap"]


  # [cli.kb.confluence.ingest] — индексация страниц Confluence по HTTP в KB
  kb-confluence-ingest:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.confluence.ingest"]


  # [cli.kb.confluence_doc.ingest] — индексация заранее подготовленных md-файлов
  kb-confluence-doc-ingest:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.confluence_doc"]


  # [cli.kb.confluence.download] — скачивание страниц Confluence на ФС
  kb-confluence-download:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.confluence.download"]


  # [cli.kb.search.render] — рендер SQL поискового запроса к KB (без LLM)
  kb-search-render:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.search"]

networks:
  default:
    name: docker
    external: true

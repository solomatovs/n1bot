# ─── Кросс-слойные настройки приложения ────────────────────────────
[app]
ssl_verify = false                   # env: SSL_VERIFY
log_level  = "DEBUG"                 # env: LOG_LEVEL
log_file   = "./logs/boba.log"       # env: LOG_FILE (если не задан — stdout)

# ─── LLM: транспорт + дефолты запроса ──────────────────────────────
# Имени модели здесь нет — она задаётся явно caller'ом (UI/CLI).
# Chainlit: [chainlit] models (см. ниже); CLI/tests: --model / LLM_MODEL env.
[app.llm]
base_url = "http://172.18.0.12:4000" # env: LLM_BASE_URL
api_key  = "ollama"                  # env: LITELLM_API_KEY (+ *_FILE)

# Sampling + tool-controls — всё опционально.
temperature         = 0.7            # env: LLM_TEMPERATURE
top_p               = 0.95           # env: LLM_TOP_P
# max_tokens          = 32             # env: LLM_MAX_TOKENS
# seed              = 42             # env: LLM_SEED
stop                = ["</s>", "<|im_end|>"]  # env: LLM_STOP (CSV)
frequency_penalty   = 0.0            # env: LLM_FREQUENCY_PENALTY
presence_penalty    = 0.1            # env: LLM_PRESENCE_PENALTY
parallel_tool_calls = false          # env: LLM_PARALLEL_TOOL_CALLS

# ─── Agent loop ────────────────────────────────────────────────────
[app.agent]
max_iterations                  = 200  # env: AGENT_MAX_ITERATIONS
max_consecutive_tool_calls      = 30   # env: AGENT_MAX_CONSECUTIVE_TOOL_CALLS
max_consecutive_format_failures = 30   # env: AGENT_MAX_CONSECUTIVE_FORMAT_FAILURES

# ─── Workspace layout ──────────────────────────────────────────────
[app.workspaces]
base_dir = "./workspaces"            # env: WORKSPACE_BASE_DIR
user     = "user"                    # env: WORKSPACE_USER_SUBDIR
system   = "system"                  # env: WORKSPACE_SYSTEM_SUBDIR
tmp      = "tmp"                     # env: WORKSPACE_TMP_SUBDIR

# ─── Chainlit web UI ───────────────────────────────────────────────
# Список моделей для Select-виджета в шестерёнке композера. Первая
# запись, совпавшая с [app.llm] model, становится default-выбором; иначе
# берётся первый элемент списка. Пустой список/отсутствие секции →
# виджет не показывается, используется [app.llm] model.
[chainlit]
models = [
    "qwen3",
    "qwen3-0.6b",
    "qwen3-235b",
    "qwen3.5-35b",
    "qwen3.5-122b",
    "deepseek-coder-v2-16b",
    "qwen2.5-coder-1.5b",
    "llama3.1-8b",
    "gemini",
    "numarkdown-q4",
    "numarkdown-q8",
]

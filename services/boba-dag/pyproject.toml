[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-dag"
version = "0.0.26.dev4"
description = "Boba dag: сервис исполнения инструментов — MCP-сервер на fastmcp над исполнителем DAG, песочницей и журналами."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "boba-runtime==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "boba-connection-broker==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "boba-tool-canvas==0.0.26.dev4",
    "boba-tool-chart==0.0.26.dev4",
    "boba-tool-clickhouse==0.0.26.dev4",
    "boba-tool-confluence==0.0.26.dev4",
    "boba-tool-describer==0.0.26.dev4",
    "boba-tool-doc==0.0.26.dev4",
    "boba-tool-knowledge==0.0.26.dev4",
    "boba-tool-mail==0.0.26.dev4",
    "boba-tool-oracle==0.0.26.dev4",
    "boba-tool-postgres==0.0.26.dev4",
    "boba-tool-shell==0.0.26.dev4",
    "boba-tool-web==0.0.26.dev4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "boba-pump-stand==0.0.26.dev4",
    "pytest>=9.1.0",
    "pytest-xdist>=3.6",
    "anyio>=4",
    "xlwt>=1.3",
    "packaging>=24",
    "boba-doc[readers,ocr]==0.0.26.dev4",
    "markdownify>=0.11,<1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "clickhouse-connect[async]>=1.6,<2",
    "fastembed>=0.4,<1",
    "onnxruntime-genai>=0.15,<1",
    "pyright>=1.1.400",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.uv.sources]
oracledb                = { index = "boba-wheels" }
boba-runtime            = { path = "../../packages/services/boba-runtime", editable = true }
boba-toolrun            = { path = "../../packages/services/boba-toolrun", editable = true }
boba-toolkit            = { path = "../../packages/core/boba-toolkit", editable = true }
boba-connection-broker  = { path = "../../packages/services/boba-connection-broker", editable = true }
boba-connections        = { path = "../../packages/core/boba-connections", editable = true }
boba-tool-canvas        = { path = "../../packages/tools/boba-tool-canvas", editable = true }
boba-tool-chart         = { path = "../../packages/tools/boba-tool-chart", editable = true }
boba-tool-clickhouse    = { path = "../../packages/tools/boba-tool-clickhouse", editable = true }
boba-tool-confluence    = { path = "../../packages/tools/boba-tool-confluence", editable = true }
boba-tool-describer     = { path = "../../packages/tools/boba-tool-describer", editable = true }
boba-tool-doc           = { path = "../../packages/tools/boba-tool-doc", editable = true }
boba-tool-knowledge     = { path = "../../packages/tools/boba-tool-knowledge", editable = true }
boba-tool-mail          = { path = "../../packages/tools/boba-tool-mail", editable = true }
boba-tool-oracle        = { path = "../../packages/tools/boba-tool-oracle", editable = true }
boba-tool-postgres      = { path = "../../packages/tools/boba-tool-postgres", editable = true }
boba-tool-shell         = { path = "../../packages/tools/boba-tool-shell", editable = true }
boba-tool-web           = { path = "../../packages/tools/boba-tool-web", editable = true }
boba-stand              = { path = "../../packages/testing/boba-stand", editable = true }
boba-stand-core         = { path = "../../packages/core/boba-stand-core", editable = true }
boba-pump-stand         = { path = "../../packages/testing/boba-pump-stand", editable = true }
boba-doc                = { path = "../../packages/infra/format/boba-doc", editable = true }

[[tool.uv.index]]
name = "boba-wheels"
url = "../../build/chainlit/src/oracledb"
format = "flat"
explicit = true

[tool.uv]
python-downloads = "never"
python-preference = "only-system"
environments = ["python_full_version >= '3.11' and python_full_version < '3.12' and sys_platform == 'linux'"]

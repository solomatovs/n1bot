x-runtime: &runtime
  init: true
  # без переменных берётся USER образа (1000:1000): песочница монтирует
  # образы в user namespace, и от root файлы владельца данных недоступны
  user: "${BOBA_UID:-1000}:${BOBA_GID:-1000}"
  devices:
    - /dev/fuse
  security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
  restart: unless-stopped

services:
  chainlit-1:
    <<: *runtime
    image: boba-chainlit:${BOBA_TAG:-latest}
    hostname: chainlit-1
    container_name: chainlit-1
    env_file: ./conf/boba.env
    volumes:
      - ./conf:/app/boba/conf:ro
      - ./conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data:/app/boba/data:rw
      - ./app_root:/app/boba/app_root:rw
      - ./models:/app/boba/models:ro
      - /sys/fs/cgroup/boba.slice:/cgroup:rw
    networks:
      default:
        ipv4_address: 172.18.0.60
    ports:
      - 127.0.0.1:8511:8501
    environment:
      BOBA_INSTANCE_ID: node1
      BOBA_URL_PREFIX: /boba-c1

  chainlit-2:
    <<: *runtime
    image: boba-chainlit:${BOBA_TAG:-latest}
    hostname: chainlit-2
    container_name: chainlit-2
    env_file: ./conf/boba.env
    volumes:
      - ./conf:/app/boba/conf:ro
      - ./conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data-node2:/app/boba/data:rw
      - ./app_root:/app/boba/app_root:rw
      - ./models:/app/boba/models:ro
      - /sys/fs/cgroup/boba.slice:/cgroup:rw
    networks:
      default:
        ipv4_address: 172.18.0.61
    ports:
      - 127.0.0.1:8521:8501
    environment:
      BOBA_INSTANCE_ID: node2
      BOBA_URL_PREFIX: /boba-c2

networks:
  default:
    name: docker
    external: true

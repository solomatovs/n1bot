x-runtime: &runtime
  init: true
  user: "${BOBA_UID:-1000}:${BOBA_GID:-1000}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 4g
  cpus: 4
  pids_limit: 512
  restart: unless-stopped

services:
  chainlit:
    <<: *runtime
    image: boba-chainlit:0.0.26.dev4
    hostname: chainlit
    container_name: chainlit
    networks:
      default:
        ipv4_address: 10.118.0.6
    env_file: ./conf/boba.env
    volumes:
      - ./conf:/app/boba/conf:ro
      - ./conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data:/app/boba/data:rw
      - ./models:/app/boba/models:ro
    ports:
      - "8501"
  chainlit2:
    <<: *runtime
    image: boba-chainlit:0.0.26.dev4
    hostname: chainlit2
    container_name: chainlit2
    networks:
      default:
        ipv4_address: 10.118.0.36
    env_file: ./conf2/boba.env
    environment:
      BOBA_INSTANCE_ID: node2
    volumes:
      - ./conf2:/app/boba/conf:ro
      - ./conf2/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data:/app/boba/data:rw
      - ./models:/app/boba/models:ro
    ports:
      - "8501"


networks:
  default:
    name: ss
    external: true

x-runtime: &runtime
  init: true
  cgroup_parent: boba-studio.slice
  # без переменных берётся USER образа (1000:1000): песочница монтирует
  # образы в user namespace, и от root файлы владельца данных недоступны
  user: "${BOBA_UID:-1000}:${BOBA_GID:-1000}"
  devices:
    - /dev/fuse
  security_opt:
    - seccomp=./conf/seccomp-sandbox.json
    - systempaths=unconfined
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 16g
  cpus: 8
  pids_limit: 2048
  restart: unless-stopped

services:
  studio:
    <<: *runtime
    image: boba-studio:0.0.26.dev4
    hostname: studio
    container_name: studio
    networks:
      default:
        ipv4_address: 10.118.0.12
    env_file: ./conf/boba.env
    volumes:
      - ./conf:/app/boba/conf:ro
      - ./conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data:/app/boba/data:rw
      - ./app_root:/app/boba/app_root:rw
      - ../../runtime/models:/app/boba/models:ro
      - ../../runtime/sandbox:/app/boba/sandbox:ro
      - ${BOBA_SANDBOX_CGROUP:?start boba-sandbox@studio.service and set BOBA_SANDBOX_CGROUP in .env}:/cgroup/boba-sandbox-studio:rw
    ports:
      - "8502"

networks:
  default:
    name: ss
    external: true

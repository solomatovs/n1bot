services:
  aid:
    init: true
    user: "${BOBA_USER}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    restart: unless-stopped
    image: boba-aid:0.0.30.dev7
    hostname: aid
    container_name: aid
    networks:
      default:
        ipv4_address: ${BOBA_ADDRESS}
    env_file: ./conf/boba.env
    command:
      - -m
      - boba.aid.main
      - --config
      - /app/boba/conf/config.toml
    volumes:
      - ./conf/config.toml:/app/boba/conf/config.toml:ro
      - ./conf/krb:/app/boba/conf/krb:ro
      - ./conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data:/app/boba/data:rw
    ports:
      - "8501"
      - "8502"
networks:
  default:
    name: ${BOBA_NETWORK}
    external: ${BOBA_NETWORK_EXTERNAL}

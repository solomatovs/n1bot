enable                 = true
connection             = "${postgres}"
tools                  = [
    "confluence_index_page",
    "confluence_index_space",
    "confluence_attachment",
]
body_format            = "view"
collection             = "kb_confluence"
chunk_size             = 4000
chunk_overlap          = 0
attachments            = [
    "application/pdf",
    "application/msword",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    "application/vnd.ms-excel",
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    "application/vnd.ms-powerpoint",
    "application/vnd.openxmlformats-officedocument.presentationml.presentation",
    "application/vnd.oasis.opendocument.text",
    "application/vnd.oasis.opendocument.spreadsheet",
    "application/vnd.oasis.opendocument.presentation",
    "application/rtf",
    "text/rtf",
    "text/plain",
    "text/markdown",
    "text/x-markdown",
    "text/csv",
    "text/tab-separated-values",
    "image/png",
    "image/jpeg",
    "image/gif",
    "image/bmp",
    "image/webp",
    "image/tiff",
]
text_encodings         = [
    "utf-8",
    "cp1251"
]
page_workers           = 4


[table_shape]
    row_layout_max_columns = 4
    row_layout_min_rows    = 3

[ocr]
    provider = "rapidocr"
    models_dir = "/var/cache/rapidocr"
    language = "eslav"
    text_score = 0.5
    threads = 2

[tables]
    pg_schema = "${app.schema}"
    chunks_table = "kb_chunks"
    collections_table = "kb_collections"
    sources_table = "kb_sources"

[model_cache]
    sandbox = "/var/cache/fastembed"
    process = "${oc.env:BOBA_RUNTIME}/models/fastembed"

[embedding]
    model = "intfloat/multilingual-e5-large"
    dim = 1024
    batch_size = 8
    progress_every = 1

[embedding.provider]
    kind = "fastembed"
    cache_dir = "${...model_cache.${tool_launcher.provider}}"

[sandbox]
    program   = "${oc.env:BOBA_RUNTIME}/plugins/docs"
    rootfs    = "${oc.env:BOBA_RUNTIME}/rootfs/base.ext4"
    mounts    = [
        "${oc.env:BOBA_RUNTIME}/models/fastembed:/var/cache/fastembed",
        "${oc.env:BOBA_RUNTIME}/models/rapidocr:/var/cache/rapidocr",
    ]
    [sandbox.limits]
        process_memory_bytes = 17179869184
        group_memory_bytes   = 8589934592
        group_cpu_percent    = 400

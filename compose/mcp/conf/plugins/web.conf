enable              = true
max_text_chars      = 2000
text_encodings      = ["utf-8", "cp1251"]


[ocr]
    provider = "rapidocr"
    models_dir = "/var/cache/rapidocr"
    language = "eslav"
    text_score = 0.5
    threads = 2

[sandbox]
    program   = "${oc.env:BOBA_RUNTIME}/plugins/docs"
    rootfs    = "${oc.env:BOBA_RUNTIME}/rootfs/base.ext4"
    mounts    = ["${oc.env:BOBA_RUNTIME}/models/rapidocr:/var/cache/rapidocr"]
    [sandbox.limits]
        process_memory_bytes = 4294967296
        group_memory_bytes   = 2147483648

enable    = false
server = "smtp.example.local"
port = 587
use_tls = false
sender = "boba@example.local"
recipient = "ops@example.local"

[auth]
    method = "password"
    user = "boba"
    password = "boba"

[sandbox]
    program   = "${oc.env:BOBA_RUNTIME}/plugins/core"
    rootfs    = "${oc.env:BOBA_RUNTIME}/rootfs/base.ext4"
    [sandbox.limits]
        group_memory_bytes = 1073741824

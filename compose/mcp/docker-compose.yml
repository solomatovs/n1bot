services:
  mcp:
    init: true
    cgroup_parent: boba-mcp.slice
    user: "${BOBA_USER}"
    devices:
      - /dev/fuse
    security_opt:
      - seccomp=../seccomp-sandbox.json
      - systempaths=unconfined
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 16g
    cpus: 8
    pids_limit: 2048
    restart: unless-stopped
    stop_grace_period: 30s
    image: boba-mcp:0.0.30.dev7
    hostname: mcp
    container_name: mcp
    networks:
      default:
        ipv4_address: ${BOBA_ADDRESS}
    command:
      - serve
      - --config
      - /app/boba/conf/config.toml
    volumes:
      - ./conf/config.toml:/app/boba/conf/config.toml:ro
      - ./conf/prompts:/app/boba/conf/prompts:ro
      - ./conf/krb:/app/boba/conf/krb:ro
      - ${BOBA_MODELS}:/app/boba/models:ro
      - ./data:/app/boba/data:rw
      - ${BOBA_SANDBOX_CGROUP}:/cgroup/boba-sandbox-mcp:rw
    ports:
      - "8650"
networks:
  default:
    name: ${BOBA_NETWORK}
    external: ${BOBA_NETWORK_EXTERNAL}

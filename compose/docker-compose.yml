services:
  chainlit:
    image: boba:${BOBA_TAG:-latest}
    hostname: chainlit
    container_name: chainlit
    init: true
    user: "${BOBA_UID:-0}:${BOBA_GID:-0}"
    env_file: ./conf/boba.env
    cgroup_parent: boba.slice
    volumes:
      - ./conf:/app/boba/conf:ro
      - ${BOBA_DATA_DIR:-./data}:/app/boba/data:rw
      - ./app_root:/app/boba/app_root:rw
      - /sys/fs/cgroup/boba.slice:/cgroup:rw
    devices:
      - /dev/fuse
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    ports:
      - 127.0.0.1:8501:8501
    restart: unless-stopped

networks:
  default:
    name: docker
    external: true

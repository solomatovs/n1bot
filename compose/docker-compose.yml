x-runtime: &runtime
  init: true
  # без переменных берётся USER образа (1000:1000): песочница монтирует
  # образы в user namespace, и от root файлы владельца данных недоступны
  user: "${BOBA_UID:-1000}:${BOBA_GID:-1000}"
  devices:
    - /dev/fuse
  security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
  restart: unless-stopped

services:
  chainlit:
    <<: *runtime
    image: boba-chainlit:${BOBA_TAG:-latest}
    hostname: chainlit
    container_name: chainlit
    env_file: ./chainlit/conf/boba.env
    volumes:
      - ./chainlit/conf:/app/boba/conf:ro
      - ./chainlit/conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ${BOBA_DATA_DIR:-./chainlit/data}:/app/boba/data:rw
      - ./chainlit/app_root:/app/boba/app_root:rw
      - ./models:/app/boba/models:ro
      - /sys/fs/cgroup/boba.slice:/cgroup:rw
    ports:
      - 127.0.0.1:8501:8501

  studio:
    <<: *runtime
    image: boba-studio:${BOBA_TAG:-latest}
    hostname: studio
    container_name: studio
    env_file: ./studio/conf/boba.env
    volumes:
      - ./studio/conf:/app/boba/conf:ro
      - ./studio/conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ${BOBA_STUDIO_DATA_DIR:-./studio/data}:/app/boba/data:rw
      - ./studio/app_root:/app/boba/app_root:rw
      - ./models:/app/boba/models:ro
      - /sys/fs/cgroup/boba.slice:/cgroup:rw
    ports:
      - 127.0.0.1:8502:8502

networks:
  default:
    name: docker
    external: true

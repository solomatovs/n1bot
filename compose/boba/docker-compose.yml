services:
  boba:
    init: true
    user: "${BOBA_USER}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g
    cpus: 4
    pids_limit: 1024
    restart: unless-stopped
    stop_grace_period: 30s
    image: boba:0.0.30.dev7
    hostname: boba
    container_name: boba
    networks:
      default:
        ipv4_address: ${BOBA_ADDRESS}
    env_file: ./conf/boba.env
    command:
      - serve
      - --config
      - /app/boba/conf/config.toml
    volumes:
      - ./conf/config.toml:/app/boba/conf/config.toml:ro
      - ./conf/krb:/app/boba/conf/krb:ro
      - ./conf/krb/krb5.conf:/etc/krb5.conf:ro
      - ./data:/app/boba/data:rw
    ports:
      - "8660"

networks:
  default:
    name: ${BOBA_NETWORK}
    external: ${BOBA_NETWORK_EXTERNAL}

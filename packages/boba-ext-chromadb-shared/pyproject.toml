[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-chromadb-shared"
version = "0.1.0"
description = "Shared ChromaDB config (persist_path, embedding_model) for tools and store packages."
requires-python = ">=3.11,<4"
dependencies = ["boba-core",]

[project.entry-points."boba.config_sections"]
chromadb_shared = "boba.ext.chromadb_shared:ChromadbSharedSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

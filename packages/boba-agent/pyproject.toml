[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-agent"
version = "0.1.0"
description = "Boba agent: orchestrator + adapters (fs-workspace, messages, openai, prompt-providers)."
requires-python = ">=3.11,<4"
dependencies = ["boba-core", "boba-llm", "boba-tools"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

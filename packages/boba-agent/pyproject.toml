[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-agent"
version = "0.1.0"
description = "Boba agent runtime: Agent orchestrator, turn reducers, middleware, dialogue/messages."
requires-python = ">=3.11,<4"
dependencies = ["boba-llm", "boba-tools-framework", "boba-tools-domain", "boba-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

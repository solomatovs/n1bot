[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-fs-text-pipeline"
version = "0.1.0"
description = "Pipeline-плагин: FsWalk → FsTransport → TextReader → SlidingChunker → ChromadbStore."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config",
    "boba-foundation",
    "boba-indexing",
    "boba-fs-transport",
    "boba-text-reader",
    "boba-sliding-chunker",
    "boba-chromadb-store",
    "boba-ext-chromadb-shared",
]

[project.entry-points."boba.indexing.pipelines"]
"ext.fs_text" = "boba.ext.fs_text_pipeline:PIPELINE"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

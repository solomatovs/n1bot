[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-text-reader"
version = "0.1.0"
description = "Boba indexing reader: plain text/log/utf-8 → Section."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

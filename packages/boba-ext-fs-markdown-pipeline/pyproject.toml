[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-fs-markdown-pipeline"
version = "0.1.0"
description = "Pipeline-плагин: FsWalk → FsTransport → MarkdownReader → HeadingChunker → ChromadbStore."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config",
    "boba-foundation",
    "boba-indexing",
    "boba-fs-transport",
    "boba-markdown-reader",
    "boba-heading-chunker",
    "boba-chromadb-store",
    "boba-ext-chromadb-shared",
]

[project.entry-points."boba.indexing.pipelines"]
"ext.fs_markdown" = "boba.ext.fs_markdown_pipeline:PIPELINE"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-html-reader"
version = "0.1.0"
description = "Boba indexing reader: HTML → heading-aware Section'ы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-foundation",
    "boba-indexing",
    "boba-ext-html-parser",
]

[project.entry-points."boba.indexing.readers"]
html = "boba.ext.html_reader:register_readers"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-confluence-indexing"
version = "0.1.0"
description = "Boba indexing-extension для Confluence: 3 pipeline (CQL / pages / space) через общий factory + RequestSource'ы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-foundation",
    "boba-config",
    "boba-indexing",
    "boba-confluence-core",
    "boba-http-transport",
    "boba-heading-chunker",
    "boba-chromadb-store",
    "boba-ext-chromadb-shared",
    "httpx>=0.27",
]

[project.entry-points."boba.indexing.pipelines"]
"ext.confluence_cql" = "boba.ext.confluence_indexing.cql:PIPELINE"
"ext.confluence_pages" = "boba.ext.confluence_indexing.pages:PIPELINE"
"ext.confluence_space" = "boba.ext.confluence_indexing.space:PIPELINE"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-doc"
version = "0.0.24.dev2"
description = "Инструменты doc: чтение, карта и поиск по документам workspace ридерами boba-doc в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.24.dev2",
    "boba-doc==0.0.24.dev2",
    "boba-llm==0.0.24.dev2",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
doc = "boba.tool.doc.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "boba-doc[readers,ocr]==0.0.24.dev2",
    "lxml>=5.0",
]
dev = [
    "boba-config==0.0.24.dev2",
    "boba-stand-core==0.0.24.dev2",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["bs4", "markdownify", "pypdfium2", "rapidocr"]
entry_points = ["boba.llm"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-doc"
version = "0.0.12.dev10"
description = "Инструменты doc: чтение и парсинг документов через liteparse в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.12.dev10",
    "boba-text==0.0.12.dev10",
    "langchain-core",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "boba-liteparse==0.0.12.dev10",
    "liteparse>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

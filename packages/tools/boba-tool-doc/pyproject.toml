[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-doc"
version = "0.0.6"
description = "Document parsing tool for the Boba agent: parse an uploaded document into readable text (liteparse)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools==0.0.6",
    "boba-workspace==0.0.6",
    "boba-settings==0.0.6",
    "boba-liteparse==0.0.6",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.plugins"]
doc = "boba.tool.doc"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

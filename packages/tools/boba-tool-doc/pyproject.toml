[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-doc"
dynamic = ["version"]
description = "Document parsing tool for the Boba agent: parse an uploaded document into readable text (liteparse)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-workspace",
    "boba-settings",
    "boba-liteparse",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.plugins"]
doc = "boba.tool.doc"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-doc"
version = "0.1.0"
description = "Document parsing tool for the Boba agent: parse an uploaded document into readable text (liteparse)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-workspace",
    "boba-settings",
    "pydantic",
    "liteparse>=2,<3",
]

[project.entry-points."boba.plugins"]
doc = "boba.tool.doc"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

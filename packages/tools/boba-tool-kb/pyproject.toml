[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-kb"
dynamic = ["version"]
description = "Boba KB: knowledge-base tools (Confluence/ConfluenceDoc ingest + kb_{vector,fts}_search / kb_doc_{vector,fts}_search + confluence_search_cql + downloads) поверх postgres+pgvector."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-workspace",
    "boba-indexing",
    "boba-db-postgres",
    "boba-transport-fs",
    "boba-transport-http",
    "boba-text",
    "boba-html",
    "boba-kbdoc",
    "boba-liteparse",
    # CLI confluence.download использует FsWorkspaceShell из boba.agent.workspace_fs
    "boba-agent",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.10,<2.11",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.11,<1.0",
    "fastembed>=0.4",
]

[project.entry-points."boba.plugins"]
kb = "boba.tool.kb"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools.package-data]
"boba.tool.kb.core" = ["migrations/*.sql"]

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

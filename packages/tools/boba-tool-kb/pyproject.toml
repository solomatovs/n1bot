[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-kb"
version = "0.0.8"
description = "Boba KB: knowledge-base tools (Confluence/ConfluenceDoc ingest + kb_{vector,fts}_search / kb_doc_{vector,fts}_search + confluence_search_cql + downloads) поверх postgres+pgvector."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools==0.0.8",
    "boba-settings==0.0.8",
    "boba-workspace==0.0.8",
    "boba-indexing==0.0.8",
    "boba-db-postgres==0.0.8",
    "boba-transport-fs==0.0.8",
    "boba-transport-http==0.0.8",
    "boba-text==0.0.8",
    "boba-html==0.0.8",
    "boba-kbdoc==0.0.8",
    "boba-liteparse==0.0.8",
    # CLI confluence.download использует FsWorkspaceShell из boba.agent.workspace_fs
    "boba-agent==0.0.8",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.10,<2.11",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.11,<1.0",
    "fastembed>=0.4",
]

[project.entry-points."boba.plugins"]
kb = "boba.tool.kb"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools.package-data]
"boba.tool.kb.core" = ["migrations/*.sql"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-kb"
version = "0.1.0"
description = "Boba KB: knowledge-base tools (Confluence/ConfluenceDoc ingest + kb_{vector,fts}_search / kb_doc_{vector,fts}_search + confluence_search_cql + downloads) поверх postgres+pgvector."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-workspace",
    "boba-indexing",
    "boba-db-postgres",
    "boba-transport-fs",
    "boba-transport-http",
    "boba-text",
    "boba-html",
    "boba-kbdoc",
    "boba-openai",
    # CLI confluence.download использует FsWorkspaceShell из boba.agent.workspace_fs
    "boba-agent",
    # core/embedding.py использует openai-клиент напрямую
    "openai>=1.0,<3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.11,<1.0",
    "fastembed>=0.4",
]

[project.entry-points."boba.plugins"]
kb = "boba.tool.kb"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools.package-data]
"boba.tool.kb.core" = ["migrations/*.sql"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-chromadb"
version = "0.1.0"
description = "Boba ChromaDB: read-only kb-tools (kb_search, kb_list_collections) + write-side ChromaVectorStore (VectorStoreReader/Writer + CollectionsAdmin)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "boba-schema",
    "boba-config",
    "boba-plugin",
    "boba-tools",
    "boba-indexing",
    "chromadb>=0.5",
]

[project.entry-points."boba.plugins"]
chromadb = "boba.tool.chromadb.plugin:ChromadbPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-web"
version = "0.0.26.dev4"
description = "Инструменты web: скачивание ссылки, текст документа роутером boba-doc с OCR и grep — целиком внутри песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-doc==0.0.26.dev4",
    "boba-llm==0.0.26.dev4",
    "boba-text==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "boba-transport-http==0.0.26.dev4",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<3",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
web = "boba.tool.web.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "boba-doc[readers,ocr]==0.0.26.dev4",
    "lxml>=5.0",
]
dev = [
    "boba-config==0.0.26.dev4",
    "pillow>=10",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["httpx", "bs4", "markdownify", "pypdfium2", "rapidocr"]
entry_points = ["boba.llm"]

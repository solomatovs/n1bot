[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-web"
version = "0.0.8"
description = "Boba web tools: web_fetch / web_download c hostname-whitelist'ом и per-host httpx-auth поверх HttpTransport."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools==0.0.8",
    "boba-settings==0.0.8",
    "boba-workspace==0.0.8",
    "boba-indexing==0.0.8",
    "boba-transport-http==0.0.8",
    "pydantic>=2.10,<2.11",
    "httpx>=0.28,<1",
    "markdownify>=0.11,<1.0",
]

[project.entry-points."boba.plugins"]
web = "boba.tool.web"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

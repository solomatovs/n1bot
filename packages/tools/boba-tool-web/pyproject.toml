[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-web"
version = "0.0.8.dev1"
description = "Инструменты web: скачивание и grep страницы целиком внутри песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.8.dev1",
    "boba-transport-http==0.0.8.dev1",
    "langchain",
    "langchain-core",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "markdownify>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

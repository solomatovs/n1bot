[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-web"
dynamic = ["version"]
description = "Boba web tools: web_fetch / web_download c hostname-whitelist'ом и per-host httpx-auth поверх HttpTransport."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-workspace",
    "boba-indexing",
    "boba-transport-http",
    "pydantic>=2.10,<2.11",
    "httpx>=0.28,<1",
    "markdownify>=0.11,<1.0",
]

[project.entry-points."boba.plugins"]
web = "boba.tool.web"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-web"
version = "0.1.0"
description = "Boba web tools: web_fetch / web_download c hostname-whitelist'ом и per-host httpx-auth поверх HttpTransport."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-workspace",
    "boba-indexing",
    "boba-transport-http",
    "pydantic",
    "httpx>=0.27",
    "markdownify>=0.11,<1.0",
]

[project.entry-points."boba.plugins"]
web = "boba.tool.web"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

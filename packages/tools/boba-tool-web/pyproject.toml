[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-web"
version = "0.0.15.dev4"
description = "Инструменты web: скачивание и grep страницы целиком внутри песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.15.dev4",
    "boba-text==0.0.15.dev4",
    "boba-toolkit==0.0.15.dev4",
    "boba-transport-http==0.0.15.dev4",
    "httpx",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
web = "boba.tool.web.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "markdownify>=0.11,<1.0",
]
dev = [
    "boba-config==0.0.15.dev4",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["httpx", "markdownify", "bs4"]

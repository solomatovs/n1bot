[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-confluence"
version = "0.0.19.dev8"
description = "Инструменты Confluence: чтение страниц и вложений, индексация их в базу знаний — всё в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.19.dev8",
    "boba-confluence==0.0.19.dev8",
    "boba-db-postgres==0.0.19.dev8",
    "boba-db-pgvector==0.0.19.dev8",
    "boba-indexing==0.0.19.dev8",
    "boba-llm==0.0.19.dev8",
    "boba-text==0.0.19.dev8",
    "boba-transport-http==0.0.19.dev8",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
confluence = "boba.tool.confluence.plugin:CONFLUENCE"
ingest = "boba.tool.confluence.plugin:INGEST"

[project.optional-dependencies]
payload = [
    "boba-liteparse==0.0.19.dev8",
    "boba-llm[payload]==0.0.19.dev8",
    "lxml>=5.0",
    "liteparse>=2,<3",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11,<1.0",
]
dev = [
    "boba-runtime==0.0.19.dev8",
    "boba-liteparse==0.0.19.dev8",
    "boba-sandbox==0.0.19.dev8",
    "boba-config==0.0.19.dev8",
    "boba-stand==0.0.19.dev8",
    "fastapi>=0.115,<1",
    "liteparse>=2,<3",
    "omegaconf>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
    "pytest>=8",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["fastembed", "liteparse"]

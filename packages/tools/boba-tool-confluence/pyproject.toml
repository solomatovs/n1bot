[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-confluence"
version = "0.1.0"
description = "Boba Confluence: онлайн-tools (search, page outline/section), domain-парсер/декодер/reader, offline indexing pipelines (cql/pages/space)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core",
    "boba-tools",
    "boba-indexing",
    "boba-tool-chromadb",
    "boba-transport-http",
    "boba-reader-html",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.entry-points."boba.plugins"]
confluence = "boba.ext.confluence_tools.plugin:ConfluencePlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

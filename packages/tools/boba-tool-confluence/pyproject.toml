[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-confluence"
version = "0.1.0"
description = "Boba Confluence: онлайн-tools (search, page outline/section, downloads) поверх REST API."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-workspace",
    "boba-indexing",
    "boba-transport-http",
    "boba-html",
    "pydantic",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "markdownify>=0.11,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.entry-points."boba.plugins"]
confluence = "boba.tool.confluence"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

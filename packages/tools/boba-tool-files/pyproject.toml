[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-files"
version = "0.1.0"
description = "Builtin file-system tools for the Boba agent (cat/ls/grep/edit/write/...)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "boba-schema",
    "boba-config",
    "boba-plugin",
    "boba-workspace",
    "boba-tools",
    "boba-settings",
]

[project.entry-points."boba.plugins"]
files = "boba.tool.files.plugin:FilesPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

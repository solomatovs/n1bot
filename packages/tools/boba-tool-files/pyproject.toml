[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-files"
dynamic = ["version"]
description = "Builtin file-system tools for the Boba agent (cat/ls/grep/edit/write/...)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-workspace",
    "boba-settings",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.plugins"]
files = "boba.tool.files"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

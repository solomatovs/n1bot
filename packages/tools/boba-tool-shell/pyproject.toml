[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-shell"
version = "0.0.26.dev4"
description = "Инструмент bash: команда пользователя в песочнице поверх workspace-образа."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev4",
    "pydantic>=2.12,<3",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
bash = "boba.tool.shell.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "pandas>=2,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "odfpy>=1.4,<2",
    "pypdf>=6,<7",
    "pyarrow>=25,<26",
    "lxml>=5.0,<7",
    "charset-normalizer>=3.4,<4",
    "pyyaml>=6,<7",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = [
    "pandas",
    "openpyxl",
    "xlrd",
    "docx",
    "pptx",
    "odf",
    "pypdf",
    "pyarrow",
    "lxml",
    "charset_normalizer",
    "yaml",
    "PIL",
]
apt = [
    "unzip",
    "p7zip-full",
    "file",
    "curl",
    "jq",
    "poppler-utils",
    "catdoc",
    "antiword",
    "unrtf",
    "pandoc",
    "libxml2-utils",
    "sqlite3",
    "xz-utils",
    "bzip2",
]

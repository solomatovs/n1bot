[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-shell"
version = "0.0.12.dev10"
description = "Инструмент bash: команда пользователя в песочнице поверх workspace-образа."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.12.dev10",
    "langchain-core",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "pandas>=2,<3",
    "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-shell"
version = "0.0.8"
description = "Bash tools for the Boba agent: sandboxed (bubblewrap) and local."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools==0.0.8",
    "boba-settings==0.0.8",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.plugins"]
shell = "boba.tool.shell"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

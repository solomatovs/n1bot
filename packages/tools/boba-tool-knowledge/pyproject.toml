[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-knowledge"
version = "0.0.20.dev3"
description = "База знаний: векторный и полнотекстовый поиск по коллекциям чанков в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.20.dev3",
    "boba-confluence==0.0.20.dev3",
    "boba-db-postgres==0.0.20.dev3",
    "boba-db-pgvector==0.0.20.dev3",
    "boba-indexing==0.0.20.dev3",
    "boba-kbdoc==0.0.20.dev3",
    "boba-llm==0.0.20.dev3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
kb = "boba.tool.kb.plugin:KB"

[project.optional-dependencies]
payload = [
    "boba-llm[payload]==0.0.20.dev3",
]
dev = [
    "boba-runtime==0.0.20.dev3",
    "boba-sandbox==0.0.20.dev3",
    "boba-config==0.0.20.dev3",
    "boba-stand==0.0.20.dev3",
    "boba-tool-postgres==0.0.20.dev3",
    "numpy>=1.26",
    "omegaconf>=2.3,<3",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["fastembed"]

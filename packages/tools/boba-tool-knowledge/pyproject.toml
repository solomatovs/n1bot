[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-knowledge"
version = "0.0.13.dev2"
description = "Документы и база знаний: чтение файлов, Confluence, индексация и поиск — всё в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.13.dev2",
    "boba-db-postgres==0.0.13.dev2",
    "boba-db-pgvector==0.0.13.dev2",
    "boba-indexing==0.0.13.dev2",
    "boba-kbdoc==0.0.13.dev2",
    "boba-llm==0.0.13.dev2",
    "boba-text==0.0.13.dev2",
    "boba-transport-http==0.0.13.dev2",
    "langchain-core>=1.4,<1.5",
    "langsmith>=0.8,<0.9",
    "httpx[http2]>=0.28,<1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "lxml>=5.0",
    "boba-liteparse==0.0.13.dev2",
    "boba-llm[payload]==0.0.13.dev2",
    "liteparse>=2,<3",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

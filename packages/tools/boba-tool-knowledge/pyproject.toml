[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-knowledge"
version = "0.0.30.dev1"
description = "База знаний: поиск по схеме ix (словарь, fts/trgm/vector, чтение объекта) и старый поиск по чанкам в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev1",
    "boba-toolkit==0.0.30.dev1",
    "boba-confluence==0.0.30.dev1",
    "boba-db-postgres==0.0.30.dev1",
    "boba-db-pgvector==0.0.30.dev1",
    "boba-indexing==0.0.30.dev1",
    "boba-ix-core==0.0.30.dev1",
    "boba-kbdoc==0.0.30.dev1",
    "boba-llm==0.0.30.dev1",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

[project.entry-points."boba.tools"]
kb = "boba.tool.kb.plugin:KB"

[project.optional-dependencies]
dev = [
    "boba-runtime==0.0.30.dev1",
    "boba-llm-fastembed==0.0.30.dev1",
    "boba-sandbox==0.0.30.dev1",
    "boba-config==0.0.30.dev1",
    "boba-stand==0.0.30.dev1",
    "boba-tool-postgres==0.0.30.dev1",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["fastembed"]
entry_points = ["boba.llm"]

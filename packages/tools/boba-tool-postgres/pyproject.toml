[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
version = "0.1.0"
description = "Boba PG-tools: ad-hoc read-only SQL для LLM (query / list_tables / describe_table / list_targets) поверх boba-db-postgres."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-db-postgres",
    "psycopg[binary,pool]>=3.2",
    "pydantic",
]

[project.entry-points."boba.plugins"]
pg = "boba.tool.pg"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

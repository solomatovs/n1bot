[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
dynamic = ["version"]
description = "Boba PG-tools: ad-hoc read-only SQL для LLM (query / list_tables / describe_table / list_targets) поверх boba-db-postgres."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "boba-settings",
    "boba-db-postgres",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.plugins"]
pg = "boba.tool.pg"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

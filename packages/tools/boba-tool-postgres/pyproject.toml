[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
version = "0.0.8"
description = "SQL-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.8",
    "boba-db-postgres==0.0.8",
    "langchain",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

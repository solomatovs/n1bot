[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
version = "0.0.14.dev9"
description = "SQL-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
    "boba-db-postgres==0.0.14.dev9",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
]
dev = [
    "boba-config==0.0.14.dev9",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

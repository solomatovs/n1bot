[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
version = "0.0.7"
description = "Boba PG-tools: ad-hoc read-only SQL для LLM (query / list_tables / describe_table / list_targets) поверх boba-db-postgres."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools==0.0.7",
    "boba-settings==0.0.7",
    "boba-db-postgres==0.0.7",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.plugins"]
pg = "boba.tool.pg"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

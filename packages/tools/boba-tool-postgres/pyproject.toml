[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
version = "0.0.30.dev1"
description = "SQL-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev1",
    "boba-toolkit==0.0.30.dev1",
    "boba-db-postgres==0.0.30.dev1",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
pg = "boba.tool.pg.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "boba-db-postgres[arrow]==0.0.30.dev1",
]
dev = [
    "boba-runtime==0.0.30.dev1",
    "boba-stand==0.0.30.dev1",
    "omegaconf>=2.3,<3",
    "boba-config==0.0.30.dev1",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = [
    "psycopg",
    "pyarrow",
    "boba.db.postgres.arrow_stream",
    "boba.stream.pg_to_pg.transfer",
    "boba.stream.ch_to_pg.transfer",
]
entry_points = ["boba.transfer.postgres"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-postgres"
version = "0.0.15.dev8"
description = "SQL-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev8",
    "boba-db-postgres==0.0.15.dev8",
    "boba-catalog==0.0.15.dev8",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
pg = "boba.tool.pg.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
]
dev = [
    "boba-config==0.0.15.dev8",
    "boba-runtime==0.0.15.dev8",
    "boba-stand==0.0.15.dev8",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["psycopg"]

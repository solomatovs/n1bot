[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-describer"
version = "0.0.20.dev5"
description = "Инструменты describe_*: описания объектов данных и связей между ними в таблицы node/edge."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.20.dev5",
    "boba-identity==0.0.20.dev5",
    "boba-connections==0.0.20.dev5",
    "boba-db-postgres==0.0.20.dev5",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.tools"]
describer = "boba.tool.describer.plugin:MANIFEST"

[project.entry-points."boba.addresses"]
entity = "boba.tool.describer.address:EntityAddresses"

[project.optional-dependencies]
payload = [
]
dev = [
    "boba-chainlit==0.0.20.dev5",
    "boba-config==0.0.20.dev5",
    "boba-connection-broker==0.0.20.dev5",
    "boba-db-clickhouse==0.0.20.dev5",
    "boba-runtime==0.0.20.dev5",
    "boba-sandbox==0.0.20.dev5",
    "boba-stand==0.0.20.dev5",
    "boba-stand-core==0.0.20.dev5",
    "chainlit==2.11.1",
    "langchain-core>=1.4,<1.5",
    "langgraph",
    "langgraph-checkpoint>=4.1,<5",
    "omegaconf>=2.3,<3",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["psycopg"]
entry_points = ["boba.addresses"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-describer"
version = "0.0.30.dev5"
description = "Инструменты describe_*: описания объектов данных и связей между ними в таблицы node/edge."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev5",
    "boba-toolkit==0.0.30.dev5",
    "boba-identity==0.0.30.dev5",
    "boba-connections==0.0.30.dev5",
    "boba-db-postgres==0.0.30.dev5",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

[project.entry-points."boba.tools"]
describer = "boba.tool.describer.plugin:MANIFEST"

[project.entry-points."boba.addresses"]
entity = "boba.tool.describer.address:EntityAddresses"

[project.optional-dependencies]
payload = [
]
dev = [
    "boba-config==0.0.30.dev5",
    "boba-connection-broker==0.0.30.dev5",
    "boba-db-clickhouse[payload]==0.0.30.dev5",
    "boba-runtime==0.0.30.dev5",
    "boba-stand==0.0.30.dev5",
    "boba-stand-core==0.0.30.dev5",
    "boba-toolrun==0.0.30.dev5",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.package-data]
"boba.tool.describer" = ["schema/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["psycopg"]
entry_points = ["boba.addresses"]

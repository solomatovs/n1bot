[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-chart"
version = "0.0.15.dev2"
description = "Инструмент visualize: Plotly figure-спека, проверенная в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev2",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
chart = "boba.tool.chart.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "plotly>=5.24,<6",
]
dev = [
    "boba-sandbox==0.0.15.dev2",
    "boba-stand==0.0.15.dev2",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["plotly"]

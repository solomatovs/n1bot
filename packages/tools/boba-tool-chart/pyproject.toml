[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-chart"
version = "0.0.11.dev7"
description = "Инструмент visualize: Plotly figure-спека, проверенная в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.11.dev7",
    "langchain",
    "langchain-core",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "plotly>=5.24,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

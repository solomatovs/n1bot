[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-chart"
dynamic = ["version"]
description = "Boba chart tool: рисует интерактивный Plotly-график из figure-spec; возвращает ChartResult для рендера в UI."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",
    "pydantic>=2.10,<2.11",
    "plotly>=5.24,<6",
]

[project.entry-points."boba.plugins"]
chart = "boba.tool.chart"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-clickhouse"
version = "0.0.15.dev4"
description = "ClickHouse-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.15.dev4",
    "boba-toolkit==0.0.15.dev4",
    "boba-db-clickhouse==0.0.15.dev4",
    "clickhouse-connect[async]",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
ch = "boba.tool.ch.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "boba-db-clickhouse[payload]==0.0.15.dev4",
]
dev = [
    "boba-config==0.0.15.dev4",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = ["clickhouse_connect"]

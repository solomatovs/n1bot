[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-clickhouse"
version = "0.0.11.dev2"
description = "ClickHouse-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.11.dev2",
    "boba-db-clickhouse==0.0.11.dev2",
    "langchain",
    "langchain-core",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "boba-db-clickhouse[payload]==0.0.11.dev2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-clickhouse"
version = "0.0.26.dev4"
description = "ClickHouse-инструменты только на чтение: соединение и запрос идут из песочницы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev4",
    "boba-db-clickhouse==0.0.26.dev4",
    "pydantic>=2.12,<3",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.entry-points."boba.tools"]
ch = "boba.tool.ch.plugin:MANIFEST"

[project.optional-dependencies]
payload = [
    "boba-db-clickhouse[payload]==0.0.26.dev4",
]
dev = [
    "boba-runtime==0.0.26.dev4",
    "omegaconf>=2.3,<3",
    "boba-connections==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-stand==0.0.26.dev4",
    "boba-db-clickhouse[payload]==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
imports = [
    "clickhouse_connect",
    "pyarrow",
    "boba.db.clickhouse.arrow_stream",
    "boba.stream.ch_to_ch.transfer",
    "boba.stream.pg_to_ch.transfer",
]
entry_points = ["boba.transfer.clickhouse"]

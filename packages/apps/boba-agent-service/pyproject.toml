[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-agent-service"
version = "0.0.26.dev4"
description = "Boba agent service: агент boba по ACP по сети (streamable HTTP, WebSocket), вход OAuth, процесс агента на сессию."
requires-python = ">=3.11,<4"
dependencies = [
    "agent-client-protocol==1.0.0rc3",
    "boba-access==0.0.26.dev4",
    "boba-agent==0.0.26.dev4",
    "boba-auth==0.0.26.dev4",
    "boba-cancellation==0.0.26.dev4",
    "boba-core==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-oauth==0.0.26.dev4",
    "boba-runtime==0.0.26.dev4",
    "boba-transport-acp==0.0.26.dev4",
    "fastmcp-slim[server]>=4.0,<5",
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "starlette>=1.0,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
boba-agent-service = "boba.agent_service.app:cli"

[project.optional-dependencies]
dev = [
    "boba-config==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-krb==0.0.26.dev4",
    "boba-stand==0.0.26.dev4",
    "httpx2>=2.10,<3",
    "mcp-types>=2.3,<3",
    "omegaconf>=2.3,<3",
    "psycopg>=3.3,<4",
    "pytest>=9.1,<10",
    "websockets>=15,<16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

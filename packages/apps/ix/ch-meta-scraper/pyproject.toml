[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ch-meta-scraper"
version = "0.0.26.dev4"
description = "Скрапер каталога ClickHouse в ядро ix: node, tree, edge и поверхности ch_meta_*."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-db-clickhouse[payload]==0.0.26.dev4",
    "boba-ix-core==0.0.26.dev4",
]

[project.optional-dependencies]
dev = [
    "boba-db-postgres==0.0.26.dev4",
    "boba-stand==0.0.26.dev4",
    "pydantic>=2.10,<3",
    "pytest>=8",
]

[project.scripts]
boba-ch-meta-scraper = "boba.ch_meta_scraper.worker:cli"

[tool.setuptools.package-data]
"boba.ch_meta_scraper" = ["*/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ix-fts"
version = "0.0.23.dev1"
description = "Полнотекстовый индекс ix_fts: аспекты объектов ix любого происхождения."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.23.dev1",
    "boba-db-postgres==0.0.23.dev1",
    "boba-ix-core==0.0.23.dev1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-ix-fts = "boba.ix_fts.worker:cli"

[tool.setuptools.package-data]
"boba.ix_fts" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

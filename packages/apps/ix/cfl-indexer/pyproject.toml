[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cfl-indexer"
version = "0.0.21.dev2"
description = "Индексатор Confluence в граф ix: спейсы, страницы, блог-записи, вложения и комментарии сразу в три индекса cfl_idx_*."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.21.dev2",
    "boba-confluence[html]==0.0.21.dev2",
    "boba-indexing==0.0.21.dev2",
    "boba-liteparse==0.0.21.dev2",
    "boba-text==0.0.21.dev2",
    "boba-transport-http==0.0.21.dev2",
    "boba-pg-ix-core==0.0.21.dev2",
    "boba-pg-idx-fts==0.0.21.dev2",
    "boba-pg-idx-vector==0.0.21.dev2",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-cfl-indexer = "boba.cfl_indexer.worker:main"

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.21.dev2",
    "pytest>=8",
]

[tool.setuptools.package-data]
"boba.cfl_indexer" = ["*/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

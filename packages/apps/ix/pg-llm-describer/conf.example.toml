[ix.llm_describer]
    db_schema = "ix"
    dsn = "host=127.0.0.1 port=5432 dbname=ix user=ix password=secret"
    provider = "openai"
    model = "deepseek/deepseek-v4-flash"
    base_url = "https://router.example.local/v1"
    api_key = "secret"
    max_tokens = 1024
    temperature = 0.2
    tool_choice = "auto"
    batch = 8
    lock_timeout = "2s"
    statement_timeout = "60s"

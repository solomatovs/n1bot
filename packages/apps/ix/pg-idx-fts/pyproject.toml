[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-pg-idx-fts"
version = "0.0.20.dev6"
description = "Индексатор полнотекстового поиска pg_idx_fts по аспектам объектов ix."
requires-python = ">=3.11,<4"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-pg-idx-fts = "boba.pg_idx_fts.worker:main"

[tool.setuptools.package-data]
"boba.pg_idx_fts" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-pg-ix-core"
version = "0.0.21.dev1"
description = "Ядро графа ix: схема ix.surface, ix.node, ix.tree, ix.edge и команда наката схем."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.21.dev1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-ix-core = "boba.pg_ix_core.main:main"

[tool.setuptools.package-data]
"boba.pg_ix_core" = ["*/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

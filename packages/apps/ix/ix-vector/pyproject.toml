[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ix-vector"
version = "0.0.22.dev1"
description = "Векторный индекс ix_emb_e5_1024: чанки аспектов объектов ix через локальные эмбеддинги."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.22.dev1",
    "boba-ix-core==0.0.22.dev1",
    "boba-llm==0.0.22.dev1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
    "tokenizers>=0.20",
]

[project.scripts]
boba-ix-vector = "boba.ix_vector.worker:main"

[tool.setuptools.package-data]
"boba.ix_vector" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

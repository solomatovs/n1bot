[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ix-search-lab"
version = "0.0.30.dev7"
description = "Стенд поисковой выдачи по ix: страница и http-сервер с fts, trgm, vector и подсказками."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.30.dev7",
    "boba-config==0.0.30.dev7",
    "boba-db-postgres==0.0.30.dev7",
    "boba-ix-core==0.0.30.dev7",
    "boba-llm==0.0.30.dev7",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

[project.scripts]
boba-ix-search-lab = "boba.ix_search_lab.server:cli"

[tool.setuptools.package-data]
"boba.ix_search_lab" = ["*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

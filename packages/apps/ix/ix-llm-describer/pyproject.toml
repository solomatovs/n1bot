[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ix-llm-describer"
version = "0.0.26.dev4"
description = "Описатель объектов ix через LLM: таблица pg_llm_description по структуре из pg_meta_*."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-ix-core==0.0.26.dev4",
    "boba-llm==0.0.26.dev4",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

[project.scripts]
boba-ix-llm-describer = "boba.ix_llm_describer.worker:cli"

[tool.setuptools.package-data]
"boba.ix_llm_describer" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ix-llm-describer"
version = "0.0.22.dev1"
description = "Описатель объектов ix через LLM: таблица pg_llm_description по структуре из pg_meta_*."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-chat==0.0.22.dev1",
    "boba-config==0.0.22.dev1",
    "boba-db-postgres==0.0.22.dev1",
    "boba-ix-core==0.0.22.dev1",
    "boba-llm==0.0.22.dev1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-ix-llm-describer = "boba.ix_llm_describer.worker:main"

[tool.setuptools.package-data]
"boba.ix_llm_describer" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-pg-search-lab"
version = "0.0.21.dev1"
description = "Стенд поисковой выдачи по ix: страница и http-сервер с fts, trgm, vector и подсказками."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.21.dev1",
    "boba-pg-ix-core==0.0.21.dev1",
    "boba-llm==0.0.21.dev1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-pg-search-lab = "boba.pg_search_lab.server:main"

[tool.setuptools.package-data]
"boba.pg_search_lab" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

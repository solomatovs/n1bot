[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-pg-idx-trgm"
version = "0.0.21.dev2"
description = "Индексатор триграмм и префиксов pg_idx_trgm по аспектам объектов ix."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.21.dev2",
    "boba-pg-ix-core==0.0.21.dev2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-pg-idx-trgm = "boba.pg_idx_trgm.worker:main"

[tool.setuptools.package-data]
"boba.pg_idx_trgm" = ["*/*.sql", "*/*.md", "*/*.json", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

  - listitem: поток изменений. Какой дешевле в поддержке?
- article: "Контекст: витрина продаж обновляется раз в сутки, к утру отчёты должны быть готовы, а аналитики жалуются, что днём данные устаревают. Ночной пакет перегружает всю таблицу за два часа, поток изменений требует отдельного сервиса и следит за журналом базы. Команда небольшая, дежурств ночью нет, а любые сбои должны чиниться утром без ручной перезаливки. Нужна оценка трудозатрат на поддержку за год и риски каждого варианта, если объём данных вырастет вдвое."
- img "Avatar for Ассистент-BOBA"
- article: "Дешевле в поддержке ночной пакет: один процесс, понятный перезапуск и никаких дежурств. Поток изменений окупится, только если данные нужны в течение дня."

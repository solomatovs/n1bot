- article: Как считается маржа?
- img "Avatar for Ассистент-BOBA"
- article:
  - text: "Маржа — доля цены, которая остаётся после себестоимости:"
  - math: m = ( p − c ) / p
  - text: ", где"
  - math: p
  - text: — цена,
  - math: c
  - text: — себестоимость.
- article: "Суммарная маржа портфеля:"
- math: ∑ i m i
- article: При ценах $5 и $10 и себестоимости $4 маржа — 20 % и 60 %.
- article: Строка <b>не жирный</b> остаётся текстом.

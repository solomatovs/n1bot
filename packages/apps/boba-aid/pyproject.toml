[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-aid"
version = "0.0.33.dev1"
description = "Aid: the chat web UI of the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-sandbox==0.0.33.dev1",
    "boba-identity-postgres==0.0.33.dev1",
    "boba-access-postgres==0.0.33.dev1",
    "boba-core==0.0.33.dev1",
    "boba-auth[http]==0.0.33.dev1",
    "boba-messaging==0.0.33.dev1",
    "boba-runtime==0.0.33.dev1",
    "boba-canvas==0.0.33.dev1",
    "boba-identity==0.0.33.dev1",
    "boba-chat==0.0.33.dev1",
    "boba-config==0.0.33.dev1",
    "boba-connection-broker==0.0.33.dev1",
    "boba-mcp-client==0.0.33.dev1",
    "fastmcp-slim[server]>=4.1.4,<5",
    "mcp-types>=2.3,<3",
    "boba-connections==0.0.33.dev1",
    "boba-toolkit==0.0.33.dev1",
    "boba-cancellation==0.0.33.dev1",
    "boba-db-postgres==0.0.33.dev1",
    "boba-transport-http==0.0.33.dev1",
    "boba-transport-acp==0.0.33.dev1",
    "agent-client-protocol==1.0.0rc3",
    "httpx2>=2.10,<3",
    "mcp>=2.3,<3",
    "anyio>=4,<5",
    "python-multipart>=0.0.18,<1",
    "omegaconf>=2.3,<3",
    "chainlit==2.11.1+boba.1",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "websockets>=15,<16",
    "pydantic>=2.12,<3",
    "psycopg>=3.3,<4",
    "starlette>=1.0,<2",
    "python-engineio>=4.13,<5",
    "literalai==0.1.201+boba.1",
]

[project.optional-dependencies]
dev = [
    "boba-mcp==0.0.33.dev1",
    "boba-oauth==0.0.33.dev1",
    "boba-db-clickhouse==0.0.33.dev1",
    "boba-access==0.0.33.dev1",
    "boba-toolrun==0.0.33.dev1",
    "boba-mcp-adapter==0.0.33.dev1",
    "boba-tool-io==0.0.33.dev1",
    "cryptography>=45.0.1",
    "boba-agent==0.0.33.dev1",
    "boba-cli==0.0.33.dev1",
    "boba-llm-onnx==0.0.33.dev1",
    "boba-doc[readers]==0.0.33.dev1",
    "boba-krb[seal]==0.0.33.dev1",
    "boba-kerberos==0.0.33.dev1",
    "boba-stand==0.0.33.dev1",
    "boba-stand-core==0.0.33.dev1",
    "boba-text==0.0.33.dev1",
    "boba-confluence[html]==0.0.33.dev1",
    "gssapi>=1.9,<2",
    "krb5>=0.7,<1",
    "pillow>=10",
    "playwright>=1.47,<2",
    "pytest>=9.1,<10",
    "pyjwt>=2.8,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "python-socketio>=5.11,<6",
]

[project.scripts]
boba-aid = "boba.aid.infra.entry:cli"

[tool.boba.unimported]
websockets = "WebSocket backend uvicorn: выбирается по aid.ws_protocol, загружается сервером динамически"
boba-access-postgres = "Команда migrate передаёт пакет схемы по имени через importlib"


[tool.setuptools.package-data]
"boba.aid.mcp_servers" = ["schema/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true


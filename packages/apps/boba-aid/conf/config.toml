[krb]
    config     = "${site.krb_config}"
    ccache_dir = "${env.data}/krb/cache"

[app]
    schema          = "aid"
    postgres        = "${postgres}"
    connections     = "${connections}"
    krb             = "${krb}"
    aid             = "${aid}"
    session         = "${session}"
    cluster         = "${cluster}"
    messaging       = "${messaging}"
    profiles        = "${profiles}"
    roles           = "${roles}"
    agent           = "${agent}"
    mcp             = "${mcp}"
    auth            = [
        "${auth.kerberos}",
        "${auth.ldap}",
        "${auth.local}",
        "${auth.proxy}"
    ]

[keys]
    encryption   = "${site.database_encryption_key}"
    session      = "${site.auth_secret}"
    proxy        = "${site.proxy_secret}"
    mcp_proxy    = "${site.mcp_proxy_secret}"
    mcp_client   = "${site.mcp_client.secret}"
    agent_proxy  = "${site.agent_proxy_secret}"
    agent_client = "${site.agent_client.secret}"

[connections]
    cipher = "${keys.encryption}"

[ldap]
    server        = "${site.ldap_url}"
    base_dn       = "${site.ldap_base_dn}"
    auth          = "${site.ldap_auth.${site.ldap_auth_method}}"
    [ldap.mapping]
        member_of = "${site.ldap_roles.memberof}"
        dn        = "${site.ldap_roles.dn}"

[roles]
    [roles.wrt]
        tools = ["*"]
    [roles.read]
        tools = ["*"]

[llm.main]
    kind      = "openai"
    transport = "${agent_http}"
    [llm.main.connection]
        host              = "${site.llm_host}"
        path              = "${site.llm_path}"
        ssl_verify        = "${site.llm_ssl_verify}"
        timeout_sec       = 600
        retry_attempts    = 3
        retry_backoff_sec = 1.0
        retry_statuses    = { 429 = 5 }
        auth              = "${site.llm_auth.${site.llm_auth_method}}"

[model_limits.general]
    context_window    = "${site.model_limits.general.context_window}"
    max_output_tokens = "${site.model_limits.general.max_output_tokens}"
    reasoning_return  = "turn"

[model_limits.search]
    context_window    = "${site.model_limits.search.context_window}"
    max_output_tokens = "${site.model_limits.search.max_output_tokens}"
    reasoning_return  = "turn"

[profiles.general]
    display_name            = "Общий"
    description             = "Профиль общего назначения: доступны все инструменты"
    default                 = true
    roles                   = ["*"]
    tools                   = ["connection_list", "connection_search"]
    mcp                     = ["aid_all"]
    provider                = "${llm.main}"
    model                   = "${site.models.general}"
    system_prompt           = "${site.profiles.general.system_prompt}"
    limits                  = "${model_limits.general}"
    [profiles.general.sampling]
        temperature      = 1.0
        top_p            = 0.95
        presence_penalty = 0.0
        max_tokens       = 16000
        reasoning_effort = "low"

[profiles.search]
    display_name          = "Поиск по Confluence"
    description           = "Поиск по Confluence и базе знаний"
    default               = false
    roles                 = ["*"]
    tools                 = ["connection_list", "connection_search"]
    mcp                   = ["aid_chat", "aid_search"]
    provider              = "${llm.main}"
    model                 = "${site.models.search}"
    system_prompt         = "${site.profiles.search.system_prompt}"
    limits                = "${model_limits.search}"
    [profiles.search.sampling]
        temperature      = 1.0
        top_p            = 0.95
        presence_penalty = 0.0
        max_tokens       = 4096
        reasoning_effort = "low"

[agent_http]
    dump                      = { enable = false, path = "${env.data}/dump" }
    trust_env                 = true
    proxy                     = ""
    http2                     = false
    stream_stall_sec          = 600
    connect_timeout           = 5
    write_timeout             = 100
    pool_timeout              = 5
    retries                   = 3
    max_connections           = 50
    max_keepalive_connections = 10
    keepalive_expiry          = 5
    tcp_keepalive             = true
    tcp_keepidle              = 60
    tcp_keepintvl             = 10
    tcp_keepcnt               = 10
    tcp_user_timeout          = 0

[postgres]
    host              = "${site.pg_host}"
    hostaddr          = "${site.pg_addr}"
    port              = "${site.pg_port}"
    dbname            = "${site.pg_database}"
    sslmode           = "${site.pg_sslmode}"
    application_name  = "boba-aid"
    connect_timeout   = 10
    autocommit        = true
    auth              = "${site.pg_auth.${site.pg_auth_method}}"
    [postgres.pool]
        timeout           = 5.0
        min_size          = 2
        max_size          = 16
        max_waiting       = 0
        max_lifetime      = 12000
        max_idle          = 600
        reconnect_timeout = 300
        num_workers       = 3

[postgres_history]
    host             = "${site.pg_host}"
    hostaddr         = "${site.pg_addr}"
    port             = "${site.pg_port}"
    dbname           = "${site.pg_database}"
    sslmode          = "${site.pg_sslmode}"
    application_name = "boba-agent"
    connect_timeout  = 10
    auth             = "${site.pg_history_auth.${site.pg_history_auth_method}}"
    [postgres_history.pool]
        min_size = 2
        max_size = 8
        timeout  = 30

[agent]
    public_url   = "http://127.0.0.1:${env.port}${env.url_prefix}"
    seal_ttl_sec = 600
    question_timeout_sec = 3600
    process      = "${agent_launch.${env.agent_mode}}"
    [agent.history]
        kind     = "postgres"
        schema   = "boba"
        postgres = "${postgres_history}"
    [agent.tools]
        always_load = []
    [agent.limits]
        tool_result_window_share = 0.25

[agent_launch.process]
    command             = "${env.agent_command}"
    args                = ["--stdio", "--setting-sources", ""]
    private_dir         = "${env.data}/agents"
    start_timeout_sec   = 30
    request_timeout_sec = 120
    stop_timeout_sec    = 10

[agent_launch.service]
    auth                = "${agent_auth.boba}"
    start_timeout_sec   = 60
    request_timeout_sec = 120
    silence_timeout_sec = 60
    [agent_launch.service.endpoint]
        service = "${service.boba}"
        path    = "/acp"

[service.boba]
    scheme = "${env.agent_scheme}"
    host   = "${env.agent_host}"
    port   = "${env.agent_port}"
    path   = "${env.agent_prefix}"

[agent_auth.boba]
    auth          = "proxy"
    client_id     = "boba-chat"
    client_secret = "${keys.agent_client}"
    secret        = "${keys.agent_proxy}"
    issuer        = "${service.boba}"

[service.boba_mcp]
    scheme = "${env.mcp_scheme}"
    host   = "${env.mcp_host}"
    port   = "${env.mcp_port}"
    path   = "${env.mcp_prefix}"

[mcp_limits.boba]
    connect_timeout_sec = 20.0
    call_timeout_sec    = 86400.0

[mcp.servers.aid_chat]
    limits = "${mcp_limits.boba}"
    [mcp.servers.aid_chat.endpoint]
        transport = "streamable-http"
        service   = "${service.boba_mcp}"
        path      = "/chat"
        auth      = "${mcp_auth.boba}"

[mcp.servers.aid_all]
    limits = "${mcp_limits.boba}"
    [mcp.servers.aid_all.endpoint]
        transport = "streamable-http"
        service   = "${service.boba_mcp}"
        path      = "/all"
        auth      = "${mcp_auth.boba}"

[mcp.servers.aid_search]
    limits = "${mcp_limits.boba}"
    [mcp.servers.aid_search.endpoint]
        transport = "streamable-http"
        service   = "${service.boba_mcp}"
        path      = "/search"
        auth      = "${mcp_auth.boba}"

[mcp_auth.boba]
    auth          = "proxy"
    client_id     = "boba-chat"
    client_secret = "${keys.mcp_client}"
    secret        = "${keys.mcp_proxy}"
    issuer        = "${service.boba_mcp}"

[auth.kerberos]
    type                = "kerberos"
    principal_format    = "{username}@${site.krb_realm}"
    [auth.kerberos.accept]
        service_name    = "HTTP/${site.krb_domain}@${site.krb_realm}"
        keytab          = "${site.krb_http_keytab}"
    [auth.kerberos.delegation]
        mode            = "constrained"
        service_ccache  = "FILE:${site.krb_ccache_http}"
        krb5_config     = "${krb.config}"
    [auth.kerberos.roles]
        ldap            = "${ldap}"

[auth.ldap]
    type                = "ldap"
    server              = "${ldap.server}"
    base_dn             = "${ldap.base_dn}"
    user_filter         = "(sAMAccountName={username})"
    bind_dn_template    = '${site.ldap_netbios}\{username}'
    [auth.ldap.roles]
        directory       = "${ldap.mapping}"

[auth.local]
    type          = "local"
    users         = "${site.local_auth.users}"
    require_roles = true
    [auth.local.roles.local]
        mapping = "${site.local_auth.roles}"

[auth.proxy]
    type            = "proxy"
    path            = "/auth/proxy"
    secret          = "${keys.proxy}"
    max_skew_sec    = 60
    allowed_clients = "${site.proxy.allowed_clients}"
    require_roles   = true
    [auth.proxy.headers]
        user      = "X-Remote-User"
        timestamp = "X-Boba-Timestamp"
        signature = "X-Boba-Signature"
    [auth.proxy.roles]
        ldap = "${ldap}"
    [auth.proxy.roles.local]
        mapping = "${site.proxy.local_roles}"
    [auth.proxy.roles.header]
        name = "X-Remote-Roles"
    [auth.proxy.profiles.header]
        name     = "X-Remote-Profiles"
        selected = "X-Remote-Profile"

[messaging]
    provider = "${env.messaging_provider}"

[stream_groups]
    open_sec       = 60
    stall_sec      = 300
    poll_sec       = 0.5
    pipe_bytes     = 65536
    pipe_bytes_max = 1048576

[cluster]
    node_id           = "${env.instance_id}"
    host              = "${env.host}"
    lock_ttl_sec      = 20
    heartbeat_sec     = 6
    reaper_period_sec = 10
    queue_usage_limit = 0.5
    retention_sec     = 3600

[session]
    auth_secret     = "${keys.session}"
    cookie          = "access_token"
    cookie_samesite = "none"
    session_ttl_sec = 86400
    session_max_sec = 604800
    generation      = ""

[aid]
    host            = "${env.listen_host}"
    port            = "${env.port}"
    url_prefix      = "${env.url_prefix}"
    root            = "${env.app_root}"
    files_dir       = "${env.data}/files"
    ws_protocol     = "wsproto"
    ping_interval    = 300
    ping_timeout     = 300
    ws_ping_interval = 20
    ws_ping_timeout  = 20
    shutdown_timeout_sec = 10

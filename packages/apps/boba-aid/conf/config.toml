[krb]
    config     = "${site.krb_config}"
    ccache_dir = "${env.data}/krb/cache"

[app]
    schema          = "aid"
    postgres        = "${postgres}"
    keys            = "${keys}"
    krb             = "${krb}"
    aid             = "${aid}"
    session         = "${session}"
    cluster         = "${cluster}"
    messaging       = "${messaging}"
    profiles        = "${profiles}"
    roles           = "${roles}"
    agent           = "${agent}"
    mcp             = "${mcp}"
    auth            = [
        "${auth.kerberos}",
        "${auth.ldap}",
        "${auth.local}",
        "${auth.proxy}"
    ]

[keys]
    encryption = "${site.database_encryption_key}"
    session    = "${site.auth_secret}"
    proxy      = "${site.proxy_secret}"
    mcp_client = "${site.mcp_client.secret}"

[ldap]
    server        = "${site.ldap_url}"
    base_dn       = "${site.ldap_base_dn}"
    bind_dn       = "${site.ldap_bind_user}"
    bind_password = "${site.ldap_bind_password}"
    [ldap.mapping]
        member_of = "${site.ldap_roles.memberof}"
        dn        = "${site.ldap_roles.dn}"

[roles]
    [roles.wrt]
        tools = ["*"]
    [roles.read]
        tools = ["*"]

[llm.main]
    kind      = "openai"
    transport = "${http}"
    [llm.main.connection]
        host              = "${site.llm_host}"
        path              = "${site.llm_path}"
        ssl_verify        = "${site.llm_ssl_verify}"
        timeout_sec       = 600
        retry_attempts    = 3
        retry_backoff_sec = 1.0
        retry_statuses    = { 429 = 5 }
        auth              = { method = "bearer", token = "${site.llm_token}" }

[profiles.general]
    display_name            = "General"
    description             = "Профиль общего назначения: доступны все инструменты"
    default                 = true
    roles                   = ["*"]
    tools                   = ["connection_list", "connection_search"]
    mcp                     = ["boba_general"]
    provider                = "${llm.main}"
    model                   = "${site.models.general}"
    settings                = ["*"]
    system_prompt           = "Ты ассистент BOBA"
    [profiles.general.sampling]
        temperature      = 1.0
        top_p            = 0.95
        presence_penalty = 0.0
        max_tokens       = 16000
        reasoning_effort = "low"

[profiles.search]
    display_name          = "Confluence search"
    description           = "Поиск по Confluence и базе знаний"
    default               = false
    roles                 = ["*"]
    tools                 = ["connection_list", "connection_search"]
    mcp                   = ["boba_base", "boba_search"]
    provider              = "${llm.main}"
    model                 = "${site.models.search}"
    settings              = []
    system_prompt         = "Ты поисковый ассистент BOBA: ищешь ответы в Confluence и базе знаний и отвечаешь со ссылками на источники"
    [profiles.search.sampling]
        temperature      = 1.0
        top_p            = 0.95
        presence_penalty = 0.0
        max_tokens       = 4096
        reasoning_effort = "low"

[http]
    dump                      = { enable = true, path = "${env.data}/dump" }
    trust_env                 = true
    proxy                     = ""
    http2                     = false
    stream_stall_sec          = 600
    connect_timeout           = 5
    write_timeout             = 100
    pool_timeout              = 5
    retries                   = 3
    max_connections           = 50
    max_keepalive_connections = 10
    keepalive_expiry          = 5
    tcp_keepalive             = true
    tcp_keepidle              = 60
    tcp_keepintvl             = 10
    tcp_keepcnt               = 10
    tcp_user_timeout          = 0

[postgres]
    host              = "${site.pg_host}"
    hostaddr          = "${site.pg_addr}"
    port              = "${site.pg_port}"
    dbname            = "${site.aid_database}"
    sslmode           = "${site.pg_sslmode}"
    application_name  = "boba-aid"
    connect_timeout   = 10
    autocommit        = true
    auth              = "${site.pg_auth.${site.pg_auth_method}}"
    [postgres.pool]
        timeout           = 5.0
        min_size          = 2
        max_size          = 16
        max_waiting       = 0
        max_lifetime      = 12000
        max_idle          = 600
        reconnect_timeout = 300
        num_workers       = 3

[agent]
    public_url   = "http://127.0.0.1:${env.port}${env.url_prefix}"
    seal_ttl_sec = 600
    [agent.process]
        command           = "boba"
        args              = ["acp", "--setting-sources", ""]
        env               = {}
        private_dir       = "${env.data}/agents"
        start_timeout_sec = 30
        stop_timeout_sec  = 10
    [agent.history]
        kind   = "postgres"
        schema = "boba"
    [agent.limits]
        context_window    = 128000
        max_output_tokens = 8192

[mcp.servers.boba_base]
    connect_timeout_sec  = 20.0
    call_timeout_sec     = 86400.0
    [mcp.servers.boba_base.endpoint]
        transport = "streamable-http"
        scheme    = "${env.mcp_scheme}"
        host      = "${env.mcp_host}"
        port      = "${env.mcp_port}"
        path      = "${env.mcp_prefix}/mcp/base"
        auth      = "${mcp_auth.boba}"

[mcp.servers.boba_general]
    connect_timeout_sec  = 20.0
    call_timeout_sec     = 86400.0
    [mcp.servers.boba_general.endpoint]
        transport = "streamable-http"
        scheme    = "${env.mcp_scheme}"
        host      = "${env.mcp_host}"
        port      = "${env.mcp_port}"
        path      = "${env.mcp_prefix}/mcp/general"
        auth      = "${mcp_auth.boba}"

[mcp.servers.boba_search]
    connect_timeout_sec  = 20.0
    call_timeout_sec     = 86400.0
    [mcp.servers.boba_search.endpoint]
        transport = "streamable-http"
        scheme    = "${env.mcp_scheme}"
        host      = "${env.mcp_host}"
        port      = "${env.mcp_port}"
        path      = "${env.mcp_prefix}/mcp/search"
        auth      = "${mcp_auth.boba}"

[mcp_auth.boba]
    auth          = "proxy"
    client_id     = "boba-chat"
    client_secret = "${keys.mcp_client}"
    secret        = "${keys.proxy}"
    [mcp_auth.boba.issuer]
        scheme = "${env.mcp_scheme}"
        host   = "${env.mcp_host}"
        port   = "${env.mcp_port}"
        path   = "${env.mcp_issuer_path}"

[auth.kerberos]
    type                = "kerberos"
    principal_format    = "{username}@${site.krb_realm}"
    [auth.kerberos.accept]
        service_name    = "HTTP/${site.krb_domain}@${site.krb_realm}"
        keytab          = "${site.krb_http_keytab}"
    [auth.kerberos.delegation]
        mode            = "constrained"
        service_ccache  = "FILE:${site.krb_ccache_http}"
        krb5_config     = "${krb.config}"
    [auth.kerberos.roles]
        ldap            = "${ldap}"

[auth.ldap]
    type                = "ldap"
    server              = "${ldap.server}"
    base_dn             = "${ldap.base_dn}"
    user_filter         = "(sAMAccountName={username})"
    bind_dn_template    = '${site.ldap_netbios}\{username}'
    [auth.ldap.roles]
        directory       = "${ldap.mapping}"

[auth.local]
    type          = "local"
    users         = "${site.local_auth.users}"
    require_roles = true
    [auth.local.roles.local]
        mapping = "${site.local_auth.roles}"

[auth.proxy]
    type            = "proxy"
    path            = "/auth/proxy"
    secret          = "${keys.proxy}"
    max_skew_sec    = 60
    allowed_clients = "${site.proxy.allowed_clients}"
    require_roles   = true
    [auth.proxy.headers]
        user      = "X-Remote-User"
        timestamp = "X-Boba-Timestamp"
        signature = "X-Boba-Signature"
    [auth.proxy.roles]
        ldap = "${ldap}"
    [auth.proxy.roles.local]
        mapping = "${site.proxy.local_roles}"
    [auth.proxy.roles.header]
        name = "X-Remote-Roles"
    [auth.proxy.profiles.header]
        name     = "X-Remote-Profiles"
        selected = "X-Remote-Profile"

[messaging]
    provider = "${env.messaging_provider}"

[stream_groups]
    open_sec       = 60
    stall_sec      = 300
    poll_sec       = 0.5
    pipe_bytes     = 65536
    pipe_bytes_max = 1048576

[cluster]
    node_id           = "${env.instance_id}"
    host              = "${env.host}"
    lock_ttl_sec      = 20
    heartbeat_sec     = 6
    reaper_period_sec = 10
    queue_usage_limit = 0.5
    retention_sec     = 3600

[session]
    auth_secret     = "${keys.session}"
    cookie          = "access_token"
    cookie_samesite = "none"
    session_ttl_sec = 86400
    session_max_sec = 604800
    generation      = ""

[aid]
    host            = "${env.listen_host}"
    port            = "${env.port}"
    url_prefix      = "${env.url_prefix}"
    root            = "${env.app_root}"
    files_dir       = "${env.data}/files"
    ws_protocol     = "wsproto"
    ping_interval    = 300
    ping_timeout     = 300
    ws_ping_interval = 20
    ws_ping_timeout  = 20
    shutdown_timeout_sec = 10

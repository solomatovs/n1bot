enable           = true
connection       = "${postgres}"
tools            = [
    "kb_vector_search",
    "kb_fts_search",
    "kb_catalog2",
    "kb_fts_search2",
    "kb_trgm_search2",
    "kb_vector_search2",
    "kb_node2"
]
collection       = "kb_confluence"
db_schema        = "ix"
max_result_chars = 200000

[tables]
    pg_schema         = "kb"
    chunks_table      = "kb_chunks"
    collections_table = "kb_collections"
    sources_table     = "kb_sources"

[fastembed_cache]
    sandbox = "/var/cache/fastembed"
    process = "${env.models}/fastembed"

[fastembed]
    kind      = "fastembed"
    cache_dir = "${tool.kb.fastembed_cache.${env.tool_launcher}}"

[embedding]
    provider       = "${tool.kb.fastembed}"
    model          = "${site.models.embedding}"
    dim            = 1024
    batch_size     = 8
    progress_every = 1

[sandbox]
    network = true
    binds   = [
        "${env.models}/fastembed:/var/cache/fastembed",
        "/etc/resolv.conf:/etc/resolv.conf",
        "/etc/hosts:/etc/hosts",
        "${env.krb}/krb5.conf:/etc/krb5.conf"
    ]
    [sandbox.limits]
        process_memory_bytes = 17179869184
        group_memory_bytes   = 8589934592
        group_cpu_percent    = 400

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-mcp"
version = "0.0.26.dev4"
description = "Boba mcp: MCP-сервер с инструментами boba — endpoint на профиль, вход boba, исполнение в песочнице, журналы вызовов."
requires-python = ">=3.11,<4"
dependencies = [
    "fastmcp-slim[server]>=4.0,<5",
    "mcp-types>=2.3,<3",
    "mcp>=2.3,<3",
    "joserfc>=1.0,<2",
    "boba-runtime==0.0.26.dev4",
    "boba-auth==0.0.26.dev4",
    "boba-access==0.0.26.dev4",
    "boba-cancellation==0.0.26.dev4",
    "boba-canvas==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-messaging==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "starlette>=1.0,<2",
    "uvicorn[standard]>=0.35,<1",
    "langchain-core>=1.4,<1.5",
    "pydantic>=2.12,<3",
]

[project.scripts]
boba-mcp = "boba.mcp_server.app:cli"

[project.optional-dependencies]
dev = [
    "fastmcp-slim[client]>=4.0,<5",
    "boba-stand==0.0.26.dev4",
    "boba-krb==0.0.26.dev4",
    "boba-ldap==0.0.26.dev4",
    "gssapi>=1.9,<2",
    "krb5>=0.7,<1",
    "boba-stand-core==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-tool-canvas==0.0.26.dev4",
    "boba-tool-chart==0.0.26.dev4",
    "boba-tool-clickhouse==0.0.26.dev4",
    "boba-tool-confluence==0.0.26.dev4",
    "boba-tool-doc==0.0.26.dev4",
    "boba-tool-knowledge==0.0.26.dev4",
    "boba-tool-postgres==0.0.26.dev4",
    "boba-tool-shell==0.0.26.dev4",
    "boba-tool-web==0.0.26.dev4",
    "boba-transport-http==0.0.26.dev4",
    "omegaconf>=2.3,<3",
    "psycopg>=3.3,<4",
    "boba-connection-broker==0.0.26.dev4",
    "boba-sandbox==0.0.26.dev4",
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

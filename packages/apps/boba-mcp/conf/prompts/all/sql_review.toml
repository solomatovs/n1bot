description = "Review an SQL statement: correctness, performance and safety"

[arguments.sql]
description = "The SQL statement to review"
required    = true

[arguments.dialect]
description = "The SQL dialect: postgres, clickhouse, oracle"
required    = false

[[messages]]
role = "user"
text = """Review the SQL statement below.

Dialect: {dialect}

```sql
{sql}
```

Check that it does what it seems to intend and that it is valid in the dialect. Point out performance problems: missing filters, full scans, joins that multiply rows, functions on indexed columns. Point out anything unsafe: changes without a filter, long locks, implicit casts that change results. When something should change, give the corrected statement."""

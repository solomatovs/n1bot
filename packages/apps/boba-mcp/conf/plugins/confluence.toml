enable          = true
tools           = [
    "confluence_search",
    "confluence_spaces",
    "confluence_fetch",
    "confluence_grep",
    "confluence_address"
]
body_format     = "view"
max_text_chars  = 6000

transport       = "${http}"

confluence      = "${confluence}"

[sandbox]
    program   = "plugins/docs"
    rootfs    = "rootfs/base.ext4"
    images    = ["models/rapidocr:/var/cache/rapidocr"]
    [sandbox.limits]
        process_memory_bytes = 4294967296
        group_memory_bytes   = 2147483648

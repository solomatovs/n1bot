enable          = true
tools           = [
    "confluence_search",
    "confluence_spaces",
    "confluence_fetch",
    "confluence_grep",
    "confluence_address"
]
body_format     = "view"
max_text_chars  = 6000

transport       = "${http}"

confluence      = "${confluence}"

[sandbox]
    network = true
    binds   = [
        "${env.models}/rapidocr:/var/cache/rapidocr",
        "/etc/resolv.conf:/etc/resolv.conf",
        "/etc/hosts:/etc/hosts",
        "${env.krb}/krb5.conf:/etc/krb5.conf"
    ]
    [sandbox.limits]
        process_memory_bytes = 4294967296
        group_memory_bytes   = 2147483648

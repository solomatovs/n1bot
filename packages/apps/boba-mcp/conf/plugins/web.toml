enable              = true
max_text_chars      = 2000
text_encodings      = ["utf-8", "cp1251"]
tools               = ["web_fetch_page", "web_grep_page", "web_address"]

transport = "${http}"

ocr                 = "${ocr}"

[sandbox]
    [sandbox.limits]
        process_memory_bytes = 4294967296
        group_memory_bytes   = 2147483648

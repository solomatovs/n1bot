enable     = true
connection = "${postgres}"
db_schema  = "${app.schema}"
tools      = [
    "describe_node",
    "describe_edge",
    "describe_list_nodes",
    "describe_list_edges",
    "describe_delete_node",
    "describe_delete_edge"
]

[sandbox]
    program   = "plugins/db"
    rootfs    = "rootfs/base.ext4"
    [sandbox.limits]
        group_memory_bytes = 1073741824

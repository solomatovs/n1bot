enable           = true
connection       = "${postgres}"
tools            = [
    "kb_vector_search",
    "kb_fts_search",
    # "kb_catalog2",
    # "kb_fts_search2",
    # "kb_trgm_search2",
    # "kb_vector_search2",
    # "kb_node2",
]
collection       = "kb_confluence"
db_schema        = "ix"
max_result_chars = 200000

tables           = "${kb_tables}"
embedding        = "${embedding.main}"

[sandbox]
    network = true
    binds   = [
        "/etc/resolv.conf:/etc/resolv.conf",
        "/etc/hosts:/etc/hosts",
        "${env.krb}/krb5.conf:/etc/krb5.conf"
    ]
    images  = [
        "${env.models}/fastembed.ext4:/var/cache/fastembed"
    ]
    [sandbox.limits]
        process_memory_bytes = 17179869184
        group_memory_bytes   = 8589934592
        group_cpu_percent    = 400

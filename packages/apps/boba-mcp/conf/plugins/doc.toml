enable                  = true
text_encodings          = ["utf-8", "cp1251"]
max_text_chars          = 200000
search_context_chars    = 80
tools                   = ["read_document", "document_outline", "search_document"]

ocr                     = "${ocr}"

[sandbox]
    program   = "plugins/docs"
    rootfs    = "rootfs/base.ext4"
    images    = ["models/rapidocr:/var/cache/rapidocr"]
    workspace = true
    [sandbox.limits]
        process_memory_bytes = 17179869184
        group_memory_bytes   = 4294967296

enable    = false
tools     = ["mail"]
server    = "${site.mail.server}"
port      = "${site.mail.port}"
use_tls   = "${site.mail.use_tls}"
user      = "${site.mail.user}"
password  = "${site.mail.password}"
sender    = "${site.mail.sender}"
recipient = "${site.mail.recipient}"

[sandbox]
    network = true
    binds   = [
        "/etc/resolv.conf:/etc/resolv.conf",
        "/etc/hosts:/etc/hosts"
    ]
    [sandbox.limits]
        group_memory_bytes = 1073741824

enable    = false
tools     = ["mail"]
server    = "${mail.server}"
port      = "${mail.port}"
use_tls   = "${mail.use_tls}"
auth      = "${mail.auth}"
sender    = "${mail.sender}"
recipient = "${mail.recipient}"

[sandbox]
    program   = "plugins/core"
    rootfs    = "rootfs/base.ext4"
    [sandbox.limits]
        group_memory_bytes = 1073741824

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit"
version = "0.0.26.dev4"
description = "Chainlit2 web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-auth==0.0.26.dev4",
    "boba-messaging==0.0.26.dev4",
    "boba-runtime==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-canvas==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-chat==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-connection-broker==0.0.26.dev4",
    "boba-mcp-client==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "boba-cancellation==0.0.26.dev4",
    "boba-access==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-sandbox==0.0.26.dev4",
    "boba-krb==0.0.26.dev4",
    "boba-llm==0.0.26.dev4",
    "boba-transport-http==0.0.26.dev4",
    "python-multipart>=0.0.18,<1",
    "typing-extensions>=4.12,<5",
    "omegaconf>=2.3,<3",
    "plotly>=5.24,<6",
    "chainlit==2.11.1",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.12,<3",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "starlette>=1.0,<2",
    "aiofiles>=24.1,<26",
    "python-engineio>=4.13,<5",
    "literalai>=0.1.201,<0.2",
]

[project.optional-dependencies]
dev = [
    "boba-llm-http==0.0.26.dev4",
    "boba-llm-onnx==0.0.26.dev4",
    "boba-doc[readers]==0.0.26.dev4",
    "boba-krb[seal]==0.0.26.dev4",
    "boba-db-clickhouse==0.0.26.dev4",
    "boba-kerberos==0.0.26.dev4",
    "boba-stand==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "boba-text==0.0.26.dev4",
    "boba-confluence[html]==0.0.26.dev4",
    "gssapi>=1.9,<2",
    "httpx>=0.28,<1",
    "krb5>=0.7,<1",
    "playwright>=1.47,<2",
    "psycopg>=3.3,<4",
    "pytest>=9.1,<10",
    "pyjwt>=2.8,<3",
]

[project.scripts]
boba-chainlit = "boba.chainlit.infra.entry:AppEntry.run"

[tool.setuptools.package-data]
"boba.chainlit.chat" = ["translations/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true


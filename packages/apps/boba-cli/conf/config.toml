[krb]
    config     = "${site.krb_config}"
    ccache_dir = "${env.data}/krb/cache"

[app]
    schema  = "agent"
    krb     = "${krb}"
    session = "${session}"
    agent   = "${agent}"
    auth    = ["${auth.ldap}", "${auth.local}", "${auth.proxy}"]

[keys]
    session      = "${site.auth_secret}"
    agent_proxy  = "${site.agent_proxy_secret}"
    agent_client = "${site.agent_client.secret}"

[ldap]
    server        = "${site.ldap_url}"
    base_dn       = "${site.ldap_base_dn}"
    bind_dn       = "${site.ldap_bind_user}"
    bind_password = "${site.ldap_bind_password}"
    [ldap.mapping]
        member_of = "${site.ldap_roles.memberof}"
        dn        = "${site.ldap_roles.dn}"

[postgres_history]
    host             = "${site.pg_host}"
    hostaddr         = "${site.pg_addr}"
    port             = "${site.pg_port}"
    dbname           = "${site.pg_database}"
    sslmode          = "${site.pg_sslmode}"
    application_name = "boba-agent"
    connect_timeout  = 10
    auth             = "${site.pg_history_auth.${site.pg_history_auth_method}}"
    [postgres_history.pool]
        min_size = 2
        max_size = 16
        timeout  = 30

[llm.main]
    kind            = "openai"
    baseUrl         = "${site.llm_base_url}"
    apiKey          = "${site.llm_auth.bearer.token}"
    sslVerify       = "${site.llm_ssl_verify}"
    timeoutSec      = 600
    retryAttempts   = 3
    retryBackoffSec = 1.0
    retryStatuses   = { 429 = 5 }

[model_limits.main]
    contextWindow   = 128000
    maxOutputTokens = 8192
    reasoningReturn = "turn"

[agent]
    host                 = "${env.listen_host}"
    port                 = "${env.port}"
    path                 = "/acp"
    public_url           = "${env.public_url}"
    url_prefix           = "${env.url_prefix}"
    shutdown_timeout_sec = 10
    idle_sec             = 1800
    [agent.history]
        schema   = "boba"
        postgres = "${postgres_history}"
    [agent.settings]
        [agent.settings.permissions]
            defaultMode = "bypassPermissions"
            allowBypass = true
        [agent.settings.mcp]
            callTimeoutSec = 86400
        [agent.settings.tools]
            alwaysLoad = []
        [agent.settings.sessions]
            maxOpen = 256
        [agent.settings.limits]
            toolResultWindowShare = 0.25
    [agent.profiles.general]
        roles = ["*"]
        [agent.profiles.general.model]
            provider        = "${llm.main}"
            model           = "${site.models.general}"
            systemPrompt    = "${site.profiles.general.system_prompt}"
            contextWindow   = "${model_limits.main.contextWindow}"
            maxOutputTokens = "${model_limits.main.maxOutputTokens}"
            reasoningReturn = "${model_limits.main.reasoningReturn}"
            [agent.profiles.general.model.sampling]
                temperature      = 1.0
                top_p            = 0.95
                presence_penalty = 0.0
                max_tokens       = 16000
                reasoning_effort = "low"
    [agent.profiles.search]
        roles = ["*"]
        [agent.profiles.search.model]
            provider        = "${llm.main}"
            model           = "${site.models.search}"
            systemPrompt    = "${site.profiles.search.system_prompt}"
            contextWindow   = "${model_limits.main.contextWindow}"
            maxOutputTokens = "${model_limits.main.maxOutputTokens}"
            reasoningReturn = "${model_limits.main.reasoningReturn}"
    [agent.clients.boba-chat]
        secret = "${keys.agent_client}"

[auth.ldap]
    type             = "ldap"
    server           = "${ldap.server}"
    base_dn          = "${ldap.base_dn}"
    user_filter      = "(sAMAccountName={username})"
    bind_dn_template = '${site.ldap_netbios}\{username}'
    [auth.ldap.roles]
        directory = "${ldap.mapping}"

[auth.local]
    type          = "local"
    users         = "${site.local_auth.users}"
    require_roles = true
    [auth.local.roles.local]
        mapping = "${site.local_auth.roles}"

[auth.proxy]
    type          = "proxy"
    secret        = "${keys.agent_proxy}"
    max_skew_sec  = 60
    require_roles = true
    [auth.proxy.roles.header]
        name = "X-Remote-Roles"

[session]
    auth_secret     = "${keys.session}"
    session_ttl_sec = 3600
    session_max_sec = 28800
    generation      = ""

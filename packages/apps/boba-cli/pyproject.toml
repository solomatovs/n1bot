[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli"
version = "0.0.30.dev4"
description = "Boba cli: процесс агента — режимы boba --stdio (Agent Client Protocol через стандартные потоки) и boba serve (агент как служба по сети с входом OAuth)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev4",
    "agent-client-protocol==1.0.0rc3",
    "boba-agent==0.0.30.dev4",
    "boba-cancellation==0.0.30.dev4",
    "boba-history-jsonl==0.0.30.dev4",
    "boba-history-postgres==0.0.30.dev4",
    "boba-db-postgres==0.0.30.dev4",
    "boba-llm==0.0.30.dev4",
    "boba-llm-http==0.0.30.dev4",
    "boba-llm-onnx==0.0.30.dev4",
    "boba-transport-acp==0.0.30.dev4",
    "boba-access==0.0.30.dev4",
    "boba-auth==0.0.30.dev4",
    "boba-identity==0.0.30.dev4",
    "boba-ldap==0.0.30.dev4",
    "boba-oauth==0.0.30.dev4",
    "boba-runtime==0.0.30.dev4",
    "fastmcp-slim[server]>=4.0,<5",
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "mcp-types>=2.3,<3",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
    "starlette>=1.0,<2",
    "uvicorn>=0.35,<1",
    "websockets>=15,<16",
]

[project.scripts]
boba = "boba.cli.app:cli"

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev4",
    "boba-config==0.0.30.dev4",
    "boba-krb==0.0.30.dev4",
    "httpx2>=2.10,<3",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.boba.unimported]
websockets = "протокол WebSocket сервера uvicorn: boba serve принимает ACP по WebSocket"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

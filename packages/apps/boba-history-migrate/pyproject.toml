[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-history-migrate"
version = "0.0.26.dev4"
description = "Boba history migrate: одноразовый перенос истории чата из checkpoints langgraph в history_records агента."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent==0.0.26.dev4",
    "boba-history-postgres==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-krb==0.0.26.dev4",
    "langchain-core>=1.4,<1.5",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

[project.scripts]
boba-history-migrate = "boba.history_migrate.app:cli"

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

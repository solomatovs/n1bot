[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-chromadb"
version = "0.1.0"
description = "Read-only ChromaDB knowledge-base tools for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config",
    "boba-foundation",
    "boba-indexing",
    "boba-patterns",
    "boba-tools",
    "chromadb>=0.5",
]

[project.entry-points."boba.tools"]
chromadb = "boba.ext.chromadb:register_tools"

[project.entry-points."boba.indexing.stores"]
chromadb_persist = "boba.ext.chromadb:register_stores"

[project.entry-points."boba.config_sections"]
chromadb = "boba.ext.chromadb.config:ChromadbSection"
chromadb_kb_list_collections = "boba.ext.chromadb.kb_list_collections:KbListCollectionsToolSection"
chromadb_kb_search = "boba.ext.chromadb.kb_search:KbSearchToolSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

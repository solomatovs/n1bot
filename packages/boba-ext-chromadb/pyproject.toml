[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-chromadb"
version = "0.1.0"
description = "Read-only ChromaDB knowledge-base tools for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = ["boba", "chromadb>=0.5"]

[project.entry-points."boba.tools"]
chromadb = "boba.ext.chromadb:register_tools"

# Секция конфига extension'а — подхватывается ConfigFactory при сборке
# бандла, чтобы register_tools(ctx) мог вызвать ctx.config.section(ChromadbSection).
[project.entry-points."boba.config_sections"]
chromadb = "boba.ext.chromadb.config:ChromadbSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

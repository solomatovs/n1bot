[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chunking"
version = "0.1.0"
description = "Boba text-chunking: TextSplitter (str→Iterable[str]) + Chunker'ы (sliding / heading)."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing", "boba-patterns"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

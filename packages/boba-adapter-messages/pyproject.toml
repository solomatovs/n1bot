[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-adapter-messages"
version = "0.1.0"
description = "MessageService implementations for Boba: in-memory and JSONL-on-workspace."
requires-python = ">=3.11,<4"
dependencies = ["boba-agent", "boba-llm", "boba-core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-markdown-reader"
version = "0.1.0"
description = "Boba indexing reader: markdown → heading-aware Section'ы."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing", "boba-markdown-parser"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

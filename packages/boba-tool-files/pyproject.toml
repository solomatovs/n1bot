[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-files"
version = "0.1.0"
description = "Builtin file-system tools for the Boba agent (cat/ls/grep/edit/write/...)."
requires-python = ">=3.11,<4"
dependencies = ["boba-agent", "boba-core"]

[project.entry-points."boba.plugins"]
files = "boba.ext.files_tools.plugin:FilesPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

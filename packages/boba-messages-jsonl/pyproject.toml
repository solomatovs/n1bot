[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-messages-jsonl"
version = "0.1.0"
description = "Boba: JSONL-реализация MessageService поверх workspace-файла."
requires-python = ">=3.11,<4"
dependencies = ["boba-core", "boba-llm", "boba-agent"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

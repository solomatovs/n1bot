[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-confluence-tools"
version = "0.1.0"
description = "Boba онлайн-tools для Confluence: search, page outline, page section (REST API)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools-framework",
    "boba-foundation",
    "boba-confluence-page-pipeline",
    "boba-confluence-search-pipeline",
    "boba-confluence-shared",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx",
]

[project.entry-points."boba.tools"]
confluence = "boba.ext.confluence_tools:register_tools"

[project.entry-points."boba.config_sections"]
confluence = "boba.ext.confluence_tools.config:ConfluenceSection"
confluence_page = "boba.ext.confluence_tools.page:ConfluencePageSection"
confluence_page_outline = "boba.ext.confluence_tools.page_outline:ConfluencePageOutlineToolSection"
confluence_page_section = "boba.ext.confluence_tools.page_section:ConfluencePageSectionToolSection"
confluence_search = "boba.ext.confluence_tools.search:ConfluenceSearchToolSection"
confluence_search_runtime = "boba.ext.confluence_tools.search:ConfluenceSearchSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

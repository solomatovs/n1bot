[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-sandbox"
version = "0.0.8.dev1"
description = "Boba sandbox: реализация ToolLauncher на bubblewrap — профили, cgroup-лимиты, запуск процессов, ext4-образ пользователя через fuse2fs."
requires-python = ">=3.11,<4"
dependencies = [
    # порт ToolLauncher и остановка хода
    "boba-toolkit==0.0.8.dev1",
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

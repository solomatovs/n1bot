[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-fs"
version = "0.0.8"
description = "Boba FS transport: FsRequest + FsTransport + FsWalkRequestSource (open files into RawDocument's)."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

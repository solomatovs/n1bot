[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-web"
version = "0.0.9"
description = "Boba web: WebCaller + протокол fetch/grep + payload, исполняемый в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.9",
    "boba-transport-http==0.0.9",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<2.11",
]

# зависимости payload'а: нужны только внутри песочницы,
# в окружении приложения их быть не должно
[project.optional-dependencies]
payload = [
    "markdownify>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-http"
version = "0.0.12.dev3"
description = "Boba HTTP transport: HttpRequest + HttpTransport + auth callables (PatAuth/BasicAuth) на httpx."
requires-python = ">=3.11,<4"
dependencies = [
    # остановка хода: прерыватель регистрируется в TurnCancellation
    "boba-cancellation==0.0.12.dev3",
    "httpx>=0.28,<1",
    # auth.py / connection.py: профили на pydantic BaseModel
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

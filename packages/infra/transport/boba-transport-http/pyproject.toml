[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-http"
version = "0.0.15.dev6"
description = "Boba HTTP transport: HttpRequest + HttpTransport + auth callables (PatAuth/BasicAuth) на httpx."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev6",
    "boba-connections==0.0.15.dev6",
    "boba-kerberos==0.0.15.dev6",
    "boba-cancellation==0.0.15.dev6",
    "boba-krb==0.0.15.dev6",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.15.dev6",
    "pydantic>=2.10,<2.11",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[project.entry-points."boba.connections"]
web = "boba.transport.http.connection:MANIFEST"

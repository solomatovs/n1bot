[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-http"
version = "0.1.0"
description = "Boba HTTP transport: HttpRequest + HttpTransport + auth callables (PatAuth/BasicAuth) на httpx."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-http"
dynamic = ["version"]
description = "Boba HTTP transport: HttpRequest + HttpTransport + auth callables (PatAuth/BasicAuth) на httpx."
requires-python = ">=3.11,<4"
dependencies = [
    "httpx>=0.28,<1",
    # auth.py / connection.py: профили на pydantic BaseModel
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

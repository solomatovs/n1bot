[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-http"
version = "0.0.26.dev4"
description = "Boba HTTP transport: HttpRequest + HttpTransport + auth callables (PatAuth/BasicAuth) на httpx."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<3",
    "boba-connections==0.0.26.dev4",
    "boba-kerberos==0.0.26.dev4",
    "boba-cancellation==0.0.26.dev4",
    "boba-krb==0.0.26.dev4",
    "httpx>=0.28,<1",
    "httpcore>=1.0",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[project.entry-points."boba.connections"]
web = "boba.transport.http.manifest:MANIFEST"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-http"
version = "0.0.14.dev9"
description = "Boba HTTP transport: HttpRequest + HttpTransport + auth callables (PatAuth/BasicAuth) на httpx."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.14.dev9",
    "boba-cancellation==0.0.14.dev9",
    "boba-krb==0.0.14.dev9",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.14.dev9",
    "pydantic>=2.10,<2.11",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

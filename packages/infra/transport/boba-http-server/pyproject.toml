[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-http-server"
version = "0.0.33.dev4"
description = "HTTP server lifecycle, configuration and readiness probes."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.33.dev4",
    "boba-identity==0.0.33.dev4",
    "boba-tool-io==0.0.33.dev4",
    "pydantic>=2.12,<3",
    "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[project.optional-dependencies]

dev = [
    "boba-stand==0.0.33.dev4",
    "pytest>=9.1,<10",
]

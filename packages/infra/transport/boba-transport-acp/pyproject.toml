[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-transport-acp"
version = "0.0.30.dev2"
description = "Boba ACP v2 transport: MCP-over-ACP envelope, idle with error, version negotiation and both connection sides over the acp SDK."
requires-python = ">=3.11,<4"
dependencies = [
    "agent-client-protocol==1.0.0rc3",
    "mcp-types>=2.3,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev2",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

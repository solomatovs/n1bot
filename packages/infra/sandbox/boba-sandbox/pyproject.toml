[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-sandbox"
version = "0.0.30.dev3"
description = "Boba sandbox: реализация ToolLauncher на bubblewrap — профили, cgroup-лимиты, запуск процессов, ext4-образ пользователя через fuse2fs."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.30.dev3",
    "boba-cancellation==0.0.30.dev3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
payload = []
dev = [
    "boba-runtime==0.0.30.dev3",
    "boba-config==0.0.30.dev3",
    "boba-stand==0.0.30.dev3",
    "boba-tool-shell==0.0.30.dev3",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
guest = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-sandbox"
version = "0.0.33.dev2"
description = "Boba sandbox: реализация ToolLauncher на bubblewrap — профили, cgroup-лимиты, запуск процессов, ext4-образ пользователя через fuse2fs."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-canvas==0.0.33.dev2",
    "boba-tool-io==0.0.33.dev2",
    "boba-core==0.0.33.dev2",
    "boba-toolkit==0.0.33.dev2",
    "boba-cancellation==0.0.33.dev2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
host = [
    "anyio>=4,<5",
    "boba-config==0.0.33.dev2",
    "boba-storage==0.0.33.dev2",
]
payload = []
dev = [
    "boba-config==0.0.33.dev2",
    "boba-stand==0.0.33.dev2",
    "boba-tool-shell==0.0.33.dev2",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
    "boba-mcp==0.0.33.dev2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
guest = true

[tool.boba.extras]
"boba.sandbox.paths" = "host"
"boba.sandbox.storage" = "host"

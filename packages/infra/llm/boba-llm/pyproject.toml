[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-llm"
version = "0.0.15.dev6"
description = "Boba LLM providers: openai-совместимый транспорт, чат-модель, эмбеддеры и структурная генерация (local/openai)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-chat==0.0.15.dev6",
    "boba-indexing==0.0.15.dev6",
    "boba-toolkit==0.0.15.dev6",
    "httpcore>=1.0",
    "typing-extensions>=4.12",
    "httpx[http2]>=0.28,<1",
    "httpx-sse>=0.4,<1",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
chat = [
    "langchain-core>=1.4,<1.5",
]
payload = [
    "fastembed>=0.4,<1",
]
generation = [
    "onnxruntime-genai>=0.15,<1",
]
dev = [
    "langchain-core>=1.4,<1.5",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
data = ["/var/cache/fastembed"]

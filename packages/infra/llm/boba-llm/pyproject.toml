[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-llm"
version = "0.0.14.dev7"
description = "Boba LLM providers: openai-совместимый транспорт, чат-модель, эмбеддеры и структурная генерация (local/openai)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.14.dev7",
    "boba-toolkit==0.0.14.dev7",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
chat = [
    "langchain[openai]",
    "langchain-core>=1.4,<1.5",
    "langsmith>=0.8,<0.9",
]
payload = [
    "fastembed>=0.4,<1",
]
generation = [
    "onnxruntime-genai>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

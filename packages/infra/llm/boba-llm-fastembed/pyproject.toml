[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-llm-fastembed"
version = "0.0.24.dev1"
description = "Boba LLM provider fastembed: локальные эмбеддинги in-process на ONNX."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-llm==0.0.24.dev1",
    "boba-toolkit==0.0.24.dev1",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
payload = [
    "fastembed>=0.4,<1",
]
dev = [
    "pytest>=8",
]

[project.entry-points."boba.llm"]
fastembed = "boba.llm.fastembed:MANIFEST"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
data = ["/var/cache/fastembed"]

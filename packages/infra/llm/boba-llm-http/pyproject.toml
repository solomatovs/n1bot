[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-llm-http"
version = "0.0.23.dev1"
description = "Boba LLM providers over HTTP: openai-совместимый чат и эмбеддинги, нативный чат ollama."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-llm==0.0.23.dev1",
    "boba-toolkit==0.0.23.dev1",
    "boba-transport-http==0.0.23.dev1",
    "httpx>=0.28,<1",
    "httpx-sse>=0.4,<1",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.entry-points."boba.llm"]
openai = "boba.llm.http.openai:MANIFEST"
ollama = "boba.llm.http.ollama:MANIFEST"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

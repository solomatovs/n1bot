[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-openai"
version = "0.1.0"
description = "Boba LLM-провайдер OpenAI: терминал, observers, конвертеры request/response, OpenAIChatVisitor."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "boba-workspace",
    "boba-llm",
    "boba-indexing",
    "boba-tools",
    "openai>=1.0,<3",
    "httpx>=0.27",
    # Синхронизировано с boba-llm/boba-tools: chainlit 2.11+ ломает
    # ForwardRef-резолв на pydantic 2.11+.
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

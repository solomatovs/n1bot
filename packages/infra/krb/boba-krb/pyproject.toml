[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-krb"
version = "0.0.14.dev8"
description = "Boba Kerberos: KeytabCredentials (TGT из keytab в свой ccache), SPNEGO-accept, S4U-делегирование, PAC group SIDs."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.14.dev8",
    "boba-toolkit==0.0.14.dev8",
    "gssapi",
    "krb5",
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

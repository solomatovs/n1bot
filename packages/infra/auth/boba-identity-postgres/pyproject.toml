[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-identity-postgres"
version = "0.0.33.dev1"
description = "Общее PostgreSQL-хранилище пользователей, ролей и членства для AID, MCP и службы агента."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-db-postgres==0.0.33.dev1",
    "boba-identity==0.0.33.dev1",
    "psycopg>=3.3,<4",
]

[tool.setuptools.package-data]
"boba.identity_postgres" = ["schema/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

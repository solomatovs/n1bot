[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-identity-postgres"
version = "0.0.33.dev4"
description = "Общее PostgreSQL-хранилище пользователей, ролей и членства для AID, MCP и службы агента."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-db-postgres==0.0.33.dev4",
    "boba-identity==0.0.33.dev4",
    "psycopg>=3.3,<4",
    "pydantic>=2.12,<3",
]

[tool.setuptools.package-data]
"boba.identity_postgres" = ["schema/*.sql", "migrations/*/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[project.optional-dependencies]
locks = [
    "boba-db-postgres[messaging]==0.0.33.dev4",
    "boba-messaging==0.0.33.dev4",
]
dev = [
    "boba-aid==0.0.33.dev4",
    "boba-chat==0.0.33.dev4",
    "boba-messaging==0.0.33.dev4",
    "boba-stand==0.0.33.dev4",
    "boba-db-postgres[messaging]==0.0.33.dev4",
    "psycopg>=3.3,<4",
    "pytest>=9.1,<10",
]
[tool.boba.extras]
"boba.identity_postgres.locks" = "locks"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-krb"
version = "0.0.15.dev5"
description = "Boba Kerberos: KeytabCredentials (TGT из keytab в свой ccache), SPNEGO-accept, S4U-делегирование, PAC group SIDs."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-kerberos==0.0.15.dev5",
    "boba-toolkit==0.0.15.dev5",
    "gssapi",
    "krb5",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
seal = ["cryptography>=42"]
dev = [
    "boba-db-clickhouse==0.0.15.dev5",
    "boba-db-postgres==0.0.15.dev5",
    "cryptography>=42",
    "boba-stand==0.0.15.dev5",
    "ldap3",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-krb"
version = "0.0.33.dev3"
description = "Boba Kerberos: KeytabCredentials (TGT из keytab в свой ccache), SPNEGO-accept, S4U-делегирование, PAC group SIDs."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-kerberos==0.0.33.dev3",
    "boba-toolkit==0.0.33.dev3",
    "gssapi>=1.9,<2",
    "krb5>=0.7,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
config = [
    "boba-config==0.0.33.dev3",
]
connections = [
    "boba-connections==0.0.33.dev3",
    "boba-identity==0.0.33.dev3",
    "cryptography>=45.0.1",
]
seal = ["cryptography>=45.0.1"]
dev = [
    "boba-db-clickhouse==0.0.33.dev3",
    "boba-db-postgres==0.0.33.dev3",
    "cryptography>=45.0.1",
    "boba-stand==0.0.33.dev3",
    "ldap3>=2.9,<3",
    "pytest>=9.1,<10",
    "boba-config==0.0.33.dev3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.extras]
"boba.krb.connections" = "connections"
"boba.krb.layout" = "config"
"boba.krb.seal" = "seal"

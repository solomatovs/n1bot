[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-crypto"
version = "0.0.33.dev1"
description = "Encryption of secret model fields for persistence."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.12,<3",
    "cryptography>=45.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[project.optional-dependencies]

dev = [
    "boba-stand==0.0.33.dev1",
    "boba-stand-core==0.0.33.dev1",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

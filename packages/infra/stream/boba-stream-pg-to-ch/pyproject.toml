[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stream-pg-to-ch"
version = "0.0.24.dev2"
description = "Пара postgres -> ClickHouse: контракт RowDescription источника переводится в типы ClickHouse по OID и typmod, сверка с каталогом приёмника, поток COPY text в input() как TabSeparated без перекодирования."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.24.dev2",
    "boba-db-postgres==0.0.24.dev2",
    "boba-db-clickhouse[payload]==0.0.24.dev2",
    "psycopg[binary,pool]>=3.3",
]

[project.entry-points."boba.transfer.clickhouse"]
postgres = "boba.stream.pg_to_ch.transfer:PgToCh"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

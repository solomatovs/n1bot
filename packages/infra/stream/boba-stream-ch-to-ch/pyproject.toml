[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stream-ch-to-ch"
version = "0.0.26.dev1"
description = "Пара ClickHouse -> ClickHouse: контракт колонок из шапки TabSeparatedWithNamesAndTypes как есть, сверка текстов типов с каталогом приёмника, DDL текстом типа источника, поток TabSeparated в input() без перекодирования."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev1",
    "boba-db-clickhouse[payload]==0.0.26.dev1",
]

[project.entry-points."boba.transfer.clickhouse"]
clickhouse = "boba.stream.ch_to_ch.transfer:ChToCh"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

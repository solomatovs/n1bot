[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-io"
version = "0.0.33.dev3"
description = "Исполнение инструментов: Linux-пайпы, гостевая программа, барьер группы и Arrow-потоки."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.33.dev3",
    "boba-toolkit==0.0.33.dev3",
    "boba-cancellation==0.0.33.dev3",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
]

[project.optional-dependencies]
arrow = ["pyarrow>=25,<26"]
dev = ["boba-stand==0.0.33.dev3", "pyarrow>=25,<26", "pytest>=9.1,<10"]

[tool.boba.extras]
"boba.tool_io.arrow" = "arrow"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

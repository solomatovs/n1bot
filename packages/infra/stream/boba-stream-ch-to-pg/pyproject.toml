[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stream-ch-to-pg"
version = "0.0.26.dev3"
description = "Пара ClickHouse -> postgres: контракт TabSeparatedWithNamesAndTypes источника переводится в типы postgres по тексту типа, сверка с каталогом приёмника, поток TabSeparated в COPY text без перекодирования."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev3",
    "boba-db-postgres==0.0.26.dev3",
    "boba-db-clickhouse==0.0.26.dev3",
    "psycopg[binary,pool]>=3.3",
]

[project.entry-points."boba.transfer.postgres"]
clickhouse = "boba.stream.ch_to_pg.transfer:ChToPg"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

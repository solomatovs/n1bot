[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stream-pg-to-pg"
version = "0.0.26.dev1"
description = "Пара postgres -> postgres: контракт колонок RowDescription как есть, сверка по OID и typmod с каталогом приёмника, DDL текстом типа источника, поток COPY csv или text."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev1",
    "boba-db-postgres==0.0.26.dev1",
    "psycopg[binary,pool]>=3.3",
]

[project.entry-points."boba.transfer.postgres"]
postgres = "boba.stream.pg_to_pg.transfer:PgToPg"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

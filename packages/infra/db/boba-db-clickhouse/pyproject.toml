[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-clickhouse"
version = "0.0.26.dev3"
description = "Boba ClickHouse: ClickHouseConfig + подключение payload'а по HTTP, пароль или Kerberos SPNEGO на каждый запрос."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<2.11",
    "boba-toolkit==0.0.26.dev3",
    "boba-catalog==0.0.26.dev3",
    "boba-connections==0.0.26.dev3",
    "boba-kerberos==0.0.26.dev3",
    "boba-krb==0.0.26.dev3",
]

[project.entry-points."boba.addresses"]
clickhouse = "boba.db.clickhouse.address:ChAddresses"

[project.optional-dependencies]
payload = [
    "boba-toolkit[arrow]==0.0.26.dev3",
    "clickhouse-connect[async]>=1.6,<2",
    "aiohttp>=3.14,<3.15",
    "pyarrow>=25,<26",
    "fastavro>=1.9,<2",
]
dev = [
    "boba-config==0.0.26.dev3",
    "boba-stand==0.0.26.dev3",
    "clickhouse-connect[async]>=1.6,<2",
    "pyarrow>=25,<26",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.extras]
"boba.db.clickhouse.payload" = "payload"
"boba.db.clickhouse.formats" = "payload"
"boba.db.clickhouse.arrow_stream" = "payload"
"boba.db.clickhouse.transfer" = "payload"

[project.entry-points."boba.catalog"]
clickhouse = "boba.db.clickhouse.snapshot:ChSnapshot"

[project.entry-points."boba.connections"]
clickhouse = "boba.db.clickhouse.manifest:MANIFEST"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-clickhouse"
version = "0.0.15.dev1"
description = "Boba ClickHouse: ClickHouseConfig + подключение payload'а по HTTP, пароль или Kerberos SPNEGO на каждый запрос."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.15.dev1",
    "boba-kerberos==0.0.15.dev1",
    "boba-krb==0.0.15.dev1",
]

[project.optional-dependencies]
payload = [
    "clickhouse-connect[async]>=1.6,<2",
]
dev = [
    "boba-stand==0.0.15.dev1",
    "pydantic>=2.10,<2.11",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

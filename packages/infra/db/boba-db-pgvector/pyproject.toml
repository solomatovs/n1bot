[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-pgvector"
version = "0.0.12.dev10"
description = "KB-store поверх postgres+pgvector: адаптеры boba.indexing.store, bootstrap схемы и миграции."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-db-postgres==0.0.12.dev10",
    "boba-indexing==0.0.12.dev10",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.package-data]
"boba.db.pgvector" = ["migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

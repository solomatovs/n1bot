[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-postgres"
version = "0.0.30.dev5"
description = "Boba PostgreSQL: PostgresConfig + AsyncPostgresPool — единственный async-пул системы, с kerberos-кредами на подключение."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev5",
    "pydantic>=2.12,<3",
    "boba-connections==0.0.30.dev5",
    "boba-kerberos==0.0.30.dev5",
    "boba-cancellation==0.0.30.dev5",
    "boba-krb==0.0.30.dev5",
    "boba-toolkit==0.0.30.dev5",
    "psycopg[binary,pool]>=3.3,<4",
]

[project.entry-points."boba.addresses"]
postgresql = "boba.db.postgres.address:PgAddresses"

[project.entry-points."boba.connections"]
postgres = "boba.db.postgres.manifest:MANIFEST"

[project.optional-dependencies]
arrow = [
    "boba-toolkit[arrow]==0.0.30.dev5",
    "pyarrow>=25,<26",
]
dev = [
    "boba-stand==0.0.30.dev5",
    "pytest>=9.1,<10",
]

[tool.boba.extras]
"boba.db.postgres.arrow" = "arrow"
"boba.db.postgres.arrow_stream" = "arrow"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

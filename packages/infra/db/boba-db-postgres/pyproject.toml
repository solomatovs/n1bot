[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-postgres"
version = "0.0.14.dev9"
description = "Boba PostgreSQL: PostgresConfig + AsyncPostgresPool — единственный async-пул системы, с kerberos-кредами на подключение."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-connections==0.0.14.dev9",
    "boba-kerberos==0.0.14.dev9",
    "boba-cancellation==0.0.14.dev9",
    "boba-krb==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
    "psycopg[binary,pool]>=3.3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.14.dev9",
    "pydantic>=2.10,<2.11",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

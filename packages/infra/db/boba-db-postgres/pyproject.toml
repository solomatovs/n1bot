[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-postgres"
version = "0.0.33.dev2"
description = "Boba PostgreSQL: PostgresConfig + AsyncPostgresPool — единственный async-пул системы, с kerberos-кредами на подключение."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tool-io==0.0.33.dev2",
    "boba-core==0.0.33.dev2",
    "pydantic>=2.12,<3",
    "boba-connections==0.0.33.dev2",
    "boba-kerberos==0.0.33.dev2",
    "boba-cancellation==0.0.33.dev2",
    "boba-krb==0.0.33.dev2",
    "boba-toolkit==0.0.33.dev2",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
]

[project.entry-points."boba.addresses"]
postgresql = "boba.db.postgres.address:PgAddresses"

[project.entry-points."boba.connections"]
postgres = "boba.db.postgres.manifest:MANIFEST"

[project.optional-dependencies]
cli = [
    "boba-config==0.0.33.dev2",
    "boba-krb[config]==0.0.33.dev2",
    "omegaconf>=2.3,<3",
]
messaging = [
    "boba-identity==0.0.33.dev2",
    "boba-messaging==0.0.33.dev2",
]
arrow = [
    "boba-tool-io[arrow]==0.0.33.dev2",
    "pyarrow>=25,<26",
]
dev = [
    "boba-stand==0.0.33.dev2",
    "pytest>=9.1,<10",
    "boba-aid==0.0.33.dev2",
    "boba-chat==0.0.33.dev2",
    "boba-identity==0.0.33.dev2",
    "boba-messaging==0.0.33.dev2",
]

[tool.boba.extras]
"boba.db.postgres.messaging" = "messaging"
"boba.db.postgres.migration_cli" = "cli"
"boba.db.postgres.arrow" = "arrow"
"boba.db.postgres.arrow_stream" = "arrow"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools.package-data]
"boba.db.postgres" = ["sql/*.sql"]

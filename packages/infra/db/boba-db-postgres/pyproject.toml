[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-postgres"
version = "0.1.0"
description = "Boba PostgreSQL read-only pool: PostgresConfig + PostgresConnection + PostgresPool + get_pool() process-singleton."
requires-python = ">=3.11,<4"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

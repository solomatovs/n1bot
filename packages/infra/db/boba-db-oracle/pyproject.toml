[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-db-oracle"
version = "0.0.26.dev4"
description = "Boba Oracle: тип соединения OracleConfig (пароль или wallet), адреса объектов, thin-клиент python-oracledb."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.12,<3",
    "boba-toolkit==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
]

[project.entry-points."boba.connections"]
oracle = "boba.db.oracle.manifest:MANIFEST"

[project.entry-points."boba.addresses"]
oracle = "boba.db.oracle.address:OraAddresses"

[project.optional-dependencies]
payload = [
    "boba-toolkit[arrow]==0.0.26.dev4",
    "oracledb==26.0.0+boba.1",
    "pyarrow>=25,<26",
]
dev = [
    "boba-db-postgres==0.0.26.dev4",
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.boba.extras]
"boba.db.oracle.payload" = "payload"
"boba.db.oracle.arrow_stream" = "payload"
"boba.db.oracle.trace" = "payload"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

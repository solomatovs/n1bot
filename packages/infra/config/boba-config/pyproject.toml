[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-config"
version = "0.0.15.dev8"
description = "Boba config: загрузка toml/yaml/CLI в OmegaConf и привязка секций к pydantic-моделям."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<2.11",
    "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

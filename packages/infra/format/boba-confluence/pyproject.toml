[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-confluence"
version = "0.0.23.dev1"
description = "Boba Confluence format: REST-DTO, адреса и пагинатор REST, разбор JSON и HTML Confluence."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.23.dev1",
    "boba-connections==0.0.23.dev1",
    "boba-toolkit==0.0.23.dev1",
    "boba-transport-http==0.0.23.dev1",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<2.11",
]

[project.entry-points."boba.addresses"]
confluence = "boba.confluence.address:ConfluenceAddresses"

[project.optional-dependencies]
html = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.11,<1.0",
]
dev = [
    "pytest>=8",
]

[tool.boba.extras]
"boba.confluence.html" = "html"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

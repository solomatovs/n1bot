[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-liteparse"
version = "0.0.15.dev6"
description = "Boba liteparse: движок парсинга документов поверх нативного liteparse; исполняется только в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-text==0.0.15.dev6",
    "liteparse>=2,<3",
]

[project.optional-dependencies]
dev = [
    "boba-indexing==0.0.15.dev6",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.sandbox]
data = ["/usr/share/tessdata"]
apt = ["imagemagick", "libreoffice-writer", "libreoffice-calc", "libreoffice-impress", "ghostscript", "fonts-dejavu-core"]
root = "sandbox-root"
setup = "sandbox-setup.sh"

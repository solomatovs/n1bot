[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-liteparse"
version = "0.0.7"
description = "Boba liteparse toolchain: движок поверх liteparse (parse / parse_native / search_items) + LiteParseParams + LiteParseReader (Reader[str] постранично)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.7",
    "pydantic>=2.10,<2.11",
    "liteparse>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-liteparse"
version = "0.0.9"
description = "Boba liteparse toolchain: движок поверх liteparse (parse / parse_native / search_items) + контрактные модели + PagedDocumentReader/LiteParseReader (Reader[str] постранично)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.8",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
engine = [
    "liteparse>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

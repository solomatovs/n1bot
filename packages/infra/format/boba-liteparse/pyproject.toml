[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-liteparse"
version = "0.0.14.dev8"
description = "Boba liteparse: движок парсинга документов поверх нативного liteparse; исполняется только в песочнице."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-text==0.0.14.dev8",
    "pydantic>=2.10,<2.11",
    "liteparse>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

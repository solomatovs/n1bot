[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-liteparse"
dynamic = ["version"]
description = "Boba liteparse toolchain: движок поверх liteparse (parse / parse_native / search_items) + LiteParseParams + LiteParseReader (Reader[str] постранично)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing",
    "pydantic>=2.10,<2.11",
    "liteparse>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

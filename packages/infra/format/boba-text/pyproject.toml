[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-text"
version = "0.0.15.dev6"
description = "Boba text-pipeline: PlainTextReader, OverlapCharSplitter, SectionChunker — concrete text-impl'ы доменных контрактов из boba-indexing."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.15.dev6",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

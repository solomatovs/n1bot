[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-text"
version = "0.0.30.dev1"
description = "Boba text-pipeline: PlainTextReader, OverlapCharSplitter, SectionChunker — concrete text-impl'ы доменных контрактов из boba-indexing."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.30.dev1",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev1",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

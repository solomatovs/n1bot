[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-kbdoc"
version = "0.0.15.dev1"
description = "Boba KB-document format: Reader-обёртка с header'ом (**key:** value) поверх произвольного inner Reader[str]."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.15.dev1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

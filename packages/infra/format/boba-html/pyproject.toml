[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-html"
dynamic = ["version"]
description = "Boba HTML: всё для индексации HTML — parser, reader'ы (heading / plain / semantic / readability), keys."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.6",
    "markdownify>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

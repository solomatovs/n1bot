[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-html"
version = "0.0.7"
description = "Boba HTML: всё для индексации HTML — parser, reader'ы (heading / plain / semantic / readability), keys."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing==0.0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.6",
    "markdownify>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

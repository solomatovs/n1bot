[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-doc"
version = "0.0.24.dev1"
description = "Boba doc: чтение документов по форматам (pdf, docx, xlsx, pptx, xls, rtf, html, текст, картинки) окнами страниц из потока без seek; OCR сканов и картинок моделями PP-OCR. Секции конфига — без тяжёлых зависимостей, ридеры и OCR за extras."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-llm==0.0.24.dev1",
    "pillow>=10",
    "pydantic>=2.10,<2.11",
]

[project.optional-dependencies]
readers = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.11,<1.0",
    "openpyxl>=3.1,<4",
    "pypdfium2>=5,<6",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "striprtf>=0.0.29,<1",
    "xlrd>=2,<3",
]
ocr = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "rapidocr>=3.9,<4",
]
dev = [
    "boba-stand==0.0.24.dev1",
    "openpyxl>=3.1,<4",
    "pytest>=8",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "xlwt>=1.3",
]

[tool.boba.extras]
"boba.doc.html" = "readers"
"boba.doc.readers" = "readers"
"boba.doc.router" = "readers"
"boba.doc.bridge" = "readers"
"boba.doc.ocr" = "ocr"

[tool.boba.sandbox]
data = ["/var/cache/rapidocr"]
apt = ["libgl1", "libglib2.0-0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

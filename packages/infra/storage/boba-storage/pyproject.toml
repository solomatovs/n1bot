[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-storage"
version = "0.0.33.dev3"
description = "Streaming filesystem storage and tool journals."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-canvas==0.0.33.dev3",
    "boba-toolkit==0.0.33.dev3",
    "boba-core==0.0.33.dev3",
    "boba-identity==0.0.33.dev3",
    "pydantic>=2.12,<3",
    "anyio>=4,<5",
]

[project.optional-dependencies]
http = ["starlette>=1.0,<2"]
dev = [
    "boba-stand==0.0.33.dev3",
    "pytest>=9.1,<10",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.extras]
"boba.storage.http" = "http"

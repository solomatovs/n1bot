[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-history-postgres"
version = "0.0.26.dev4"
description = "Boba history postgres: порт истории агента над Postgres — таблица записей сессии и advisory-lock захвата."
requires-python = ">=3.11,<4"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-history-postgres"
version = "0.0.30.dev2"
description = "Boba history postgres: порт истории агента над Postgres — таблица записей сессии и advisory-lock захвата."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent==0.0.30.dev2",
    "boba-db-postgres==0.0.30.dev2",
    "psycopg>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev2",
    "boba-history-jsonl==0.0.30.dev2",
    "boba-config==0.0.30.dev2",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.package-data]
"boba.history.postgres" = ["schema/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

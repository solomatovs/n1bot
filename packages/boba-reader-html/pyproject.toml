[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-reader-html"
version = "0.1.0"
description = "Boba HTML reader: heading-aware Section'ы из HTML-документов (h1..h6 + html-id anchor'ы)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

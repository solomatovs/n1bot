[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-config-source-toml"
version = "0.1.0"
description = "Boba ConfigSource: TOML — TomlSource + TomlFileSource (Docker-secrets via *_file)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core",
    "tomli",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-web-chainlit"
version = "0.1.0"
description = "Chainlit web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent",
    "boba-core",
    "chainlit>=2.11,<3",
    "CodeSettings is not fully defined",
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-web-chainlit = "boba.web.chainlit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

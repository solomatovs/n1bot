[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-web-chainlit"
version = "0.1.0"
description = "Chainlit web UI app for the Boba agent."
requires-python = ">=3.11,<4"
# Декларируем зависимости явно — runtime тяжёлый (chainlit, fastapi,
# traceloop-sdk, ~30 opentelemetry-инструментаторов). До миграции
# requirements.txt → pyproject.toml эти deps продолжают приходить через
# core requirements.txt; здесь дублируем верхнеуровневые имена для
# документации и для будущей миграции (когда core requirements.txt
# исчезнет, чтобы chainlit-app остался автономно устанавливаемым).
dependencies = [
    "boba",
    "boba-adapter-fs-workspace",
    "boba-adapter-messages",
    "boba-adapter-openai",
    "boba-adapter-prompt-providers",
    "boba-config-env",
    "boba-config-toml",
    "chainlit>=2.11,<3",
    # chainlit 2.11+ ломает ForwardRef-резолв ``CodeSettings``/``Action``
    # на pydantic 2.11+ — импорт chainlit падает с "CodeSettings is not
    # fully defined". Держим 2.10.x до апдейта chainlit.
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-web-chainlit = "boba.web.chainlit.__main__:main"

# Конфиг chainlit-сервера и UI-оверрайдов — в общем bundle'е приложения,
# подхватываются ConfigFactory через discovery. Bootstrap (__main__) и
# ChatSession читают их через bundle.section(...).
[project.entry-points."boba.config_sections"]
chainlit = "boba.web.chainlit.config:ChainlitSection"
chainlit_ui_override = "boba.web.chainlit.ui_overrides:ChainlitUiOverrideSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

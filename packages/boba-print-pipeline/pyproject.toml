[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-print-pipeline"
version = "0.1.0"
description = "Pipeline-оркестратор: чтение коллекции из Store и вывод в текстовый sink (stdout по умолчанию)."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing", "boba-patterns"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

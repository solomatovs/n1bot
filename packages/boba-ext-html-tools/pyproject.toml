[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-html-tools"
version = "0.1.0"
description = "Boba HTML navigation tools: outline + section reading via workspace files."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core",
    "boba-agent",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.entry-points."boba.tools"]
html = "boba.ext.html_tools:register_tools"

[project.entry-points."boba.config_sections"]
html = "boba.ext.html_tools.config:HtmlSection"
html_outline = "boba.ext.html_tools.outline:HtmlOutlineToolSection"
html_section = "boba.ext.html_tools.section:HtmlSectionToolSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-html-as-markdown"
version = "0.1.0"
description = "Композитный мост HTML → Markdown: markdownify + MarkdownReader из boba-html и boba-markdown."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing",
    "boba-html",
    "boba-markdown",
    "markdownify>=0.11",
]

[project.optional-dependencies]
readability = ["trafilatura>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

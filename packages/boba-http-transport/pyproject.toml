[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-http-transport"
version = "0.1.0"
description = "Generic HTTP transport: HttpRequest → RawDocument; PAT/Basic auth callables."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

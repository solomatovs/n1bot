[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-patterns"
version = "0.0.1"
description = "Foundation patterns for Boba: Converter, StreamConverter, Specification, Id, etc."
requires-python = ">=3.11,<4"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

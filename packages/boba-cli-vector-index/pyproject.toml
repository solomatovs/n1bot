[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli-vector-index"
version = "0.1.0"
description = "Operator CLI: единый CLI поверх IndexPipeline + Print/Search-pipeline'ов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-chromadb-store",
    "boba-ext-chromadb-shared",
    "boba-config",
    "boba-config-sources",
    "boba-foundation",
    "boba-indexing",
    "boba-patterns",
    "boba-print-pipeline",
    "boba-search-pipeline",
    "boba-fs-pipelines",
    "boba-confluence-pipelines",
]

[project.scripts]
boba-cli-vector-index = "boba.cli.vector_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

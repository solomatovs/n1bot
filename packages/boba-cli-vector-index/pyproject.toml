[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli-vector-index"
version = "0.1.0"
description = "Operator CLI: pure runner поверх IndexPipeline; Source/Reader/Chunker/Store — отдельные ext-плагины."
requires-python = ">=3.11,<4"
# Runner ничего не знает про конкретные backend'ы — всё через entry-points.
dependencies = [
    "boba-config",
    "boba-config-source-cli",
    "boba-config-source-env",
    "boba-config-source-toml",
    "boba-foundation",
    "boba-indexing",
    "boba-patterns",
]

[project.scripts]
boba-cli-vector-index = "boba.cli.vector_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

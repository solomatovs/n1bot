[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-llm"
dynamic = ["version"]
description = "Boba LLM contract: модели/события/ошибки/observer/retry-middleware. Pure-домен, без провайдеров."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "boba-tools",
    # Синхронизировано с boba-agent/boba-chainlit: chainlit 2.11+
    # ломает ForwardRef-резолв на pydantic 2.11+.
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-llm"
version = "0.1.0"
description = "Boba LLM contract: модели/события/ошибки/observer/retry-middleware. Pure-домен, без провайдеров."
requires-python = ">=3.11,<4"
dependencies = ["boba-patterns"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

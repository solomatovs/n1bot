[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-settings"
version = "0.0.14.dev7"
description = "OmegaConf-источники + чистые pydantic-модели: load -> bind -> validate."
requires-python = ">=3.11,<4"
dependencies = [
    # 2.11+ ломает ForwardRef-резолв (см. boba-chainlit).
    "pydantic>=2.10,<2.11",
    "omegaconf>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

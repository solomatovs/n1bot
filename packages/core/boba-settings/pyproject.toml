[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-settings"
dynamic = ["version"]
description = "OmegaConf-источники + чистые pydantic-модели: load -> bind -> validate."
requires-python = ">=3.11,<4"
dependencies = [
    # 2.11+ ломает ForwardRef-резолв (см. boba-agent/boba-llm/boba-tools).
    "pydantic>=2.10,<2.11",
    "omegaconf>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

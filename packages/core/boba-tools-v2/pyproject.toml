[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tools-v2"
version = "0.1.0"
description = "Boba tools v2: декларативный фреймворк tools поверх Dishka DI. @tool + @provides, Annotated-based DI/config injection, общий Container со scope-аналитикой."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-tools",       # для Tool ABC и StaticToolSource — адаптер опирается на них
    "boba-settings",    # BobaFlatSettings для @config-авто-загрузки
    "dishka>=1.9",
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolkit"
version = "0.0.26.dev4"
description = "Основание инструментов: песочница bwrap, workspace-образы, отмена хода и контракт результата."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.26.dev4",
    "pydantic-core>=2.41,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
arrow = [
    "pyarrow>=25,<26",
]
dev = [
    "boba-stand==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "pyarrow>=25,<26",
    "pytest>=9.1,<10",
]

[tool.boba.extras]
"boba.toolkit.arrow" = "arrow"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

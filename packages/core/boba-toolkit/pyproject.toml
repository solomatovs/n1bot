[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolkit"
version = "0.0.15.dev3"
description = "Основание инструментов: песочница bwrap, workspace-образы, отмена хода и контракт результата."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.15.dev3",
    "pydantic-core>=2.27",
    "pydantic>=2.10,<2.11",
    "annotated-types>=0.7",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.15.dev3",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

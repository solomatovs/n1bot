[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolkit"
version = "0.0.10"
description = "Основание инструментов: песочница bwrap, workspace-образы, отмена хода и контракт результата."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

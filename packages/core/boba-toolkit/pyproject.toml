[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolkit"
version = "0.0.14.dev8"
description = "Основание инструментов: песочница bwrap, workspace-образы, отмена хода и контракт результата."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<2.11",
    "annotated-types>=0.7",
]

# ветка --config в entry.py: сборка injected-конфигов из toml приложения;
# в песочницу extra не ставится — omegaconf туда нельзя
[project.optional-dependencies]
config = [
    "boba-settings==0.0.14.dev8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

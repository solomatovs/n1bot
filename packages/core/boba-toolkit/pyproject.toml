[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolkit"
version = "0.0.33.dev3"
description = "Контракты инструментов: модели вызова и результата, порты, кадры, манифест и план DAG без Linux I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.33.dev3",
    "boba-mcp-models==0.0.33.dev3",
    "mcp-types>=2.3,<3",
    "pydantic-core>=2.41,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.33.dev3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

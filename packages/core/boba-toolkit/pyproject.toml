[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolkit"
version = "0.0.8"
description = "Основание инструментов: песочница bwrap, workspace-образы, отмена хода и контракт результата."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-db-postgres==0.0.8",
    "boba-transport-http==0.0.8",
    "psycopg[binary,pool]>=3.2",
    "langchain-core",
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

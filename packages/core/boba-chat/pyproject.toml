[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chat"
version = "0.0.30.dev6"
description = "Boba chat: конверты и порт LLM-провайдера, конфиги бэкендов чата и генерации по схеме — модели без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-access==0.0.30.dev6",
    "boba-identity==0.0.30.dev6",
    "boba-llm==0.0.30.dev6",
    "boba-toolkit==0.0.30.dev6",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev6",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

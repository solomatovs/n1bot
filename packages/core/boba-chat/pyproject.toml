[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chat"
version = "0.0.14.dev8"
description = "Boba chat: конверты и порт LLM-провайдера, конфиги бэкендов чата и генерации по схеме — модели без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

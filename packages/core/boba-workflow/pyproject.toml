[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-workflow"
version = "0.0.15.dev3"
description = "Boba workflow: граф вычислений над инструментами — спека, стадии, порядок, автомат запуска."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-access==0.0.15.dev3",
    "boba-identity==0.0.15.dev3",
    "boba-toolkit==0.0.15.dev3",
    "boba-messaging==0.0.15.dev3",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tools"
version = "0.0.8"
description = "Boba tools: декларативный @tool/@provides framework на Dishka DI + Tool ABC + ToolRegistry/Catalog/Executor."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns==0.0.8",
    "dishka>=1.9",
    # Синхронизировано с boba-llm/boba-agent/boba-chainlit: chainlit
    # 2.11+ ломает ForwardRef-резолв на pydantic 2.11+.
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tools"
version = "0.1.0"
description = "Boba tools: contract layer (Tool ABC, ToolResult, ToolContext) + ToolExecutor framework. Pure-domain, без I/O и LLM-провайдеров."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "boba-schema",
    "boba-workspace",
    # Синхронизировано с boba-llm/boba-agent/boba-chainlit-agent: chainlit
    # 2.11+ ломает ForwardRef-резолв на pydantic 2.11+.
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

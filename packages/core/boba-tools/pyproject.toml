[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tools"
dynamic = ["version"]
description = "Boba tools: декларативный @tool/@provides framework на Dishka DI + Tool ABC + ToolRegistry/Catalog/Executor."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "dishka>=1.9",
    # Синхронизировано с boba-llm/boba-agent/boba-chainlit: chainlit
    # 2.11+ ломает ForwardRef-резолв на pydantic 2.11+.
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stand-core"
version = "0.0.32.dev1"
description = "Boba stand core: помощники тестов, которым хватает домена — фейки, контекст вызова, аудит зависимостей."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.32.dev1",
    "boba-identity==0.0.32.dev1",
    "boba-toolkit==0.0.32.dev1",
    "packaging>=24.2,<27",
    "pydantic>=2.12,<3",
    "pytest>=9.1,<10",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.32.dev1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

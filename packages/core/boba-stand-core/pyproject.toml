[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stand-core"
version = "0.0.19.dev1"
description = "Boba stand core: помощники тестов, которым хватает домена — фейки, контекст вызова, пользователи, аудит зависимостей."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.19.dev1",
    "boba-chat==0.0.19.dev1",
    "boba-identity==0.0.19.dev1",
    "boba-toolkit==0.0.19.dev1",
    "pydantic>=2.10,<3",
    "pytest>=8",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

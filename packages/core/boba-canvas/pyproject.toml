[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-canvas"
version = "0.0.26.dev4"
description = "Boba canvas: ключи хранилища, журнал потоков, канвас и вьюверы, правила хранения и передачи файлов — модели и правила без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

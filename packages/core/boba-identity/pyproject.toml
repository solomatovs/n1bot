[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-identity"
version = "0.0.26.dev4"
description = "Boba identity: субъект, область и контекст вызова, сессия, ошибки слоёв, реестр запусков — без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

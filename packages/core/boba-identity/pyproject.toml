[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-identity"
version = "0.0.15.dev1"
description = "Boba identity: субъект, область и контекст вызова, сессия, ошибки слоёв, реестр запусков — без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.15.dev1",
    "boba-toolkit==0.0.15.dev1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

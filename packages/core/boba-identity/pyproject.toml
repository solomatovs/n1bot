[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-identity"
version = "0.0.14.dev9"
description = "Boba identity: субъект, область и контекст вызова, сессия, ошибки слоёв, реестр запусков — без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<3",
    "boba-cancellation==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

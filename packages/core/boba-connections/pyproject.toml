[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-connections"
version = "0.0.15.dev6"
description = "Boba connections: профили внешних систем (postgres, clickhouse, http, kerberos) и правила доступа к ним — модели без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev6",
    "boba-identity==0.0.15.dev6",
    "boba-kerberos==0.0.15.dev6",
    "cryptography>=42",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "boba-db-clickhouse==0.0.15.dev6",
    "boba-db-postgres==0.0.15.dev6",
    "boba-connection-broker==0.0.15.dev6",
    "boba-stand==0.0.15.dev6",
    "boba-transport-http==0.0.15.dev6",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

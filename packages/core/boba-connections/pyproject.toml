[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-connections"
version = "0.0.30.dev7"
description = "Boba connections: профили внешних систем (postgres, clickhouse, http, kerberos) и правила доступа к ним — модели без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev7",
    "boba-toolkit==0.0.30.dev7",
    "boba-identity==0.0.30.dev7",
    "boba-kerberos==0.0.30.dev7",
    "cryptography>=45.0.1",
    "joserfc>=1.7,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev7",
    "boba-db-clickhouse==0.0.30.dev7",
    "boba-db-postgres==0.0.30.dev7",
    "boba-stand-core==0.0.30.dev7",
    "boba-transport-http==0.0.30.dev7",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

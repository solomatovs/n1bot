[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-kerberos"
version = "0.0.30.dev7"
description = "Boba kerberos: модели и ошибки kerberos — секции профилей, режимы делегирования, билет входа, порт печати — без gssapi."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev7",
    "pydantic>=2.12,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-agent"
version = "0.0.26.dev4"
description = "Boba agent: ядро агента — записи истории, очередь ввода, сборка запроса, ход, сжатие; знает только порты."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-cancellation==0.0.26.dev4",
    "boba-llm==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "boba-mcp-client==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-history-jsonl==0.0.26.dev4",
    "boba-prompt-assembly==0.0.26.dev4",
    "boba-llm-http==0.0.26.dev4",
    "boba-transport-http==0.0.26.dev4",
    "uvicorn>=0.35,<1",
    "boba-llm-onnx==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.boba.unimported]
boba-prompt-assembly = "сверка загрузчика с эталонной моделью журнала: тесты зовут python -m boba.prompt_assembly субпроцессом"

[tool.setuptools.package-data]
"boba.agent" = ["template/*/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-agent"
version = "0.1.0"
description = "Boba agent: orchestrator + builder + middleware + turn-spec + prompt/messages контракты + InMemoryMessageService + JsonLinesMessageService + filesystem-реализация WorkspaceShell/Registry + file/git/env/workspace PromptProvider'ы и PromptLoader. Без LLM-провайдеров."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns",
    "boba-schema",
    "boba-config",
    "boba-plugin",
    "boba-workspace",
    "boba-llm",
    "boba-tools",
    # Синхронизировано с boba-chainlit-agent: chainlit 2.11+ ломает
    # ForwardRef-резолв на pydantic 2.11+
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

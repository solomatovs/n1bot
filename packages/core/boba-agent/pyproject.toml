[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-agent"
version = "0.0.8"
description = "Boba agent: orchestrator + builder + middleware + turn-spec + prompt/history контракты + InMemoryHistoryService + JsonLinesHistoryService + HistoryDialogView + filesystem-реализация WorkspaceShell/Registry + file/git/env/workspace PromptProvider'ы и PromptLoader. Дефолтный LLM-провайдер — OpenAI-совместимый (boba-openai); переопределяется через AgentBuilder.use_llm(...)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-patterns==0.0.8",
    "boba-workspace==0.0.8",
    "boba-settings==0.0.8",
    "boba-llm==0.0.8",
    "boba-openai==0.0.8",
    "boba-tools==0.0.8",
    # Синхронизировано с boba-chainlit: chainlit 2.11+ ломает
    # ForwardRef-резолв на pydantic 2.11+
    "pydantic>=2.10,<2.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

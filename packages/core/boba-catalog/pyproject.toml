[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-catalog"
version = "0.0.30.dev6"
description = "Boba catalog: домен каталога данных — слои, наборы, колонки, виды загрузки, потоки; снимок, операции, diff. Без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.30.dev6",
    "boba-db-clickhouse==0.0.30.dev6",
    "boba-db-postgres==0.0.30.dev6",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-indexing"
version = "0.0.26.dev4"
description = "Boba indexing + processing: Source/Reader/Chunker/Store/IndexPipeline + streaming-processing primitives (Request/Transport/Decoder/RawDocument/Section)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-llm==0.0.26.dev4",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

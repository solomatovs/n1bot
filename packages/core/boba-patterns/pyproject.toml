[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-patterns"
version = "0.0.7"
description = "Boba foundation: Id, Converter, Specification, errors, Stream*, FoldFactory, PrioritySource — атомарные паттерны без внешних зависимостей."
requires-python = ">=3.11,<4"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

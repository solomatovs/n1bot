[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-messaging"
version = "0.0.26.dev4"
description = "Boba messaging: модели сообщений шины, конверт, порт MessageBus и реализация в памяти — без I/O."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-identity==0.0.26.dev4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-schema"
version = "0.1.0"
description = "Boba typed schema kernel: ConfigValue + PythonValueAdapter, Coercer-pipeline, ObjectSchema/FieldSpec, builder'ы schema_from_dataclass/schema_from_callable."
requires-python = ">=3.11,<4"
dependencies = ["boba-patterns"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

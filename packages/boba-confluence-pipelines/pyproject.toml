[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-confluence-pipelines"
version = "0.1.0"
description = "Confluence indexing-pipeline'ы Boba: 3 pipeline (CQL / pages / space) через общий factory + RequestSource'ы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core",
    "boba-indexing",
    "boba-confluence-core",
    "boba-http-transport",
    "boba-chunking",
    "boba-chromadb-store",
    "boba-ext-chromadb-shared",
    "httpx>=0.27",]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-next"
version = "0.0.1"
description = "Next-generation Boba core: standalone confignext + foundation patterns."
requires-python = ">=3.11,<4"
dependencies = ["boba-patterns"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba_next*"]

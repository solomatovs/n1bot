[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-confluence-search-pipeline"
version = "0.1.0"
description = "Pipeline-оркестратор: поиск страниц Confluence по CQL через REST API."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-confluence-shared",
    "boba-patterns",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

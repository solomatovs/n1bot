[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-adapter-prompt-providers"
version = "0.1.0"
description = "Boba: file/git/env/static-реализации PromptProvider + PromptLoader."
requires-python = ">=3.11,<4"
dependencies = ["boba-core", "boba-agent"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

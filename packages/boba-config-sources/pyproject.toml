[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-config-sources"
version = "0.1.0"
description = "ConfigSource implementations for Boba: CLI argv, env vars (+_FILE), TOML (+_file)."
requires-python = ">=3.11,<4"
dependencies = ["boba-config", "boba-foundation", "tomli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

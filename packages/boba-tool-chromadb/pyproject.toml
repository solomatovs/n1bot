[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tool-chromadb"
version = "0.1.0"
description = "Boba ChromaDB: read-only kb-tools (kb_search, kb_list_collections), write-side ChromadbPersistStore, общий config (persist_path + embedding)."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core",
    "boba-tools",
    "boba-indexing",
    "chromadb>=0.5",
]

[project.entry-points."boba.plugins"]
chromadb = "boba.ext.chromadb_tools.plugin:ChromadbPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit2"
version = "0.1.0"
description = "Chainlit2 web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent",
    "boba-workspace",
    "boba-settings",
    "boba-llm",
    "boba-openai",
    "boba-tools",
    "tabulate>=0.9,<1",
    "plotly>=5.24,<6",
    "chainlit>=2.11,<3",
    "httpx[http2]>=0.28,<1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic>=2.10,<2.11",
    "langchain[openai,schema]",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "fastapi-gssapi",
    "gssapi",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

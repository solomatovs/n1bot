[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit2"
version = "0.0.7"
description = "Chainlit2 web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent==0.0.7",
    "boba-workspace==0.0.7",
    "boba-settings==0.0.7",
    "boba-llm==0.0.7",
    "boba-openai==0.0.7",
    "boba-tools==0.0.7",
    # код авторизации (Fix/LDAP/Kerberos) и доменные ошибки
    "boba-auth==0.0.7",
    "tabulate>=0.9,<1",
    "plotly>=5.24,<6",
    "chainlit>=2.11,<3",
    "httpx[http2]>=0.28,<1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic>=2.10,<2.11",
    "langchain[openai]",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]>=3.2",
    "sqlmodel>=0.0.22",
]

[project.scripts]
boba-chainlit2 = "boba.chainlit2.infra.bootstrap:run_app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

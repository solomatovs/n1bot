[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli"
version = "0.0.6"
description = "Operator CLI: run a single agent query against the Boba runtime."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent==0.0.6",
    "boba-patterns==0.0.6",
    "boba-workspace==0.0.6",
    "boba-settings==0.0.6",
    "boba-llm==0.0.6",
    "boba-openai==0.0.6",
    "boba-tools==0.0.6",
    # 2.11+ ломает ForwardRef-резолв (см. boba-agent/boba-llm/boba-settings).
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-cli = "boba.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli"
dynamic = ["version"]
description = "Operator CLI: run a single agent query against the Boba runtime."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent",
    "boba-patterns",
    "boba-workspace",
    "boba-settings",
    "boba-llm",
    "boba-openai",
    "boba-tools",
    # 2.11+ ломает ForwardRef-резолв (см. boba-agent/boba-llm/boba-settings).
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-cli = "boba.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

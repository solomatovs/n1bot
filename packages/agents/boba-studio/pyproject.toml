[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-studio"
version = "0.0.14.dev9"
description = "Boba Studio: процесс над сервисами — REST и socket.io под {prefix}/api и страница workflow под {prefix}/workflow."
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40",
    "pydantic>=2.10,<3",
    "pyjwt>=2.8",
    "python-socketio>=5.11,<6",
    "httpx>=0.28,<1",
    "websockets>=13",
    "uvicorn>=0.30",
    "boba-identity==0.0.14.dev9",
    "boba-chat==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
    "boba-toolrun==0.0.14.dev9",
    "boba-workflow==0.0.14.dev9",
    "boba-workflow-engine==0.0.14.dev9",
    "boba-runtime==0.0.14.dev9",
    "boba-sandbox==0.0.14.dev9",
]

[project.optional-dependencies]
tools = [
    "boba-tool-shell==0.0.14.dev9",
    "boba-tool-chart==0.0.14.dev9",
    "boba-tool-web==0.0.14.dev9",
    "boba-tool-doc==0.0.14.dev9",
    "boba-tool-postgres==0.0.14.dev9",
    "boba-tool-clickhouse==0.0.14.dev9",
    "boba-tool-knowledge==0.0.14.dev9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit"
version = "0.0.14.dev9"
description = "Chainlit2 web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-messaging==0.0.14.dev9",
    "boba-runtime==0.0.14.dev9",
    "boba-toolrun==0.0.14.dev9",
    "boba-canvas==0.0.14.dev9",
    "boba-identity==0.0.14.dev9",
    "boba-chat==0.0.14.dev9",
    "boba-connections==0.0.14.dev9",
    "boba-config==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
    "boba-cancellation==0.0.14.dev9",
    "boba-access==0.0.14.dev9",
    "boba-tool-shell==0.0.14.dev9",
    "boba-db-postgres==0.0.14.dev9",
    "boba-sandbox==0.0.14.dev9",
    "boba-krb==0.0.14.dev9",
    "boba-llm[chat]==0.0.14.dev9",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "typing-extensions>=4.12",
    "omegaconf>=2.3,<3",
    "plotly>=5.24,<6",
    "tabulate>=0.9,<1",
    "chainlit>=2.11,<3",
    "httpx[http2]>=0.28,<1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic>=2.10,<2.11",
    "langchain[openai]",
    "langchain-core>=1.4,<1.5",
    "langgraph",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-postgres",
    "starlette",
    "aiofiles",
    "python-engineio",
    "literalai",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "boba-connection-broker==0.0.14.dev9",
    "boba-liteparse==0.0.14.dev9",
    "boba-stand==0.0.14.dev9",
    "boba-text==0.0.14.dev9",
    "boba-tool-chart==0.0.14.dev9",
    "boba-tool-clickhouse==0.0.14.dev9",
    "boba-tool-doc==0.0.14.dev9",
    "boba-tool-knowledge==0.0.14.dev9",
    "boba-tool-postgres==0.0.14.dev9",
    "boba-tool-web==0.0.14.dev9",
    "boba-transport-http==0.0.14.dev9",
    "boba-workflow-engine==0.0.14.dev9",
    "gssapi>=1.9",
    "krb5>=0.7",
    "playwright>=1.47",
    "pytest>=8",
]

[project.scripts]
boba-chainlit = "boba.chainlit.infra.entry:AppEntry.run"

[tool.setuptools.package-data]
"boba.chainlit.auth" = ["*.js"]
"boba.chainlit.chat" = ["translations/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true


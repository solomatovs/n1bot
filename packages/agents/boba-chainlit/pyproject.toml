[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit"
version = "0.0.7"
description = "Chainlit web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent==0.0.7",
    "boba-workspace==0.0.7",
    "boba-settings==0.0.7",
    "boba-llm==0.0.7",
    "boba-openai==0.0.7",
    "boba-tools==0.0.7",
    # код авторизации (Fix/LDAP/Kerberos) и доменные ошибки
    "boba-auth==0.0.7",
    "tabulate>=0.9,<1",
    "plotly>=5.24,<6",
    "chainlit>=2.11,<3",
    # composition.py монтирует FastAPI-приложение и поднимает uvicorn
    "fastapi[standard]",
    "uvicorn[standard]",
    # chainlit 2.11+ ломает ForwardRef-резолв на pydantic 2.11+
    # ("CodeSettings is not fully defined"). Держим 2.10.x до апдейта chainlit.
    "pydantic>=2.10,<2.11",
]

[project.scripts]
boba-chainlit = "boba.chainlit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

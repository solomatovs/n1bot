[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit"
version = "0.0.14.dev7"
description = "Chainlit2 web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-settings==0.0.14.dev7",
    "boba-toolkit==0.0.14.dev7",
    "boba-cancellation==0.0.14.dev7",
    "boba-tool-shell==0.0.14.dev7",
    "boba-tool-chart==0.0.14.dev7",
    "boba-tool-web==0.0.14.dev7",
    "boba-tool-doc==0.0.14.dev7",
    "boba-tool-postgres==0.0.14.dev7",
    "boba-tool-clickhouse==0.0.14.dev7",
    "boba-tool-knowledge==0.0.14.dev7",
    "boba-db-postgres==0.0.14.dev7",
    "boba-db-pgvector==0.0.14.dev7",
    "boba-db-clickhouse==0.0.14.dev7",
    "boba-sandbox==0.0.14.dev7",
    "boba-transport-http==0.0.14.dev7",
    "boba-krb==0.0.14.dev7",
    "boba-llm[chat]==0.0.14.dev7",
    "ldap3",
    "cryptography>=42,<51",
    "omegaconf>=2.3,<3",
    "plotly>=5.24,<6",
    "tabulate>=0.9,<1",
    "chainlit>=2.11,<3",
    "httpx[http2]>=0.28,<1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic>=2.10,<2.11",
    "langchain[openai]",
    "langchain-core>=1.4,<1.5",
    "langsmith>=0.8,<0.9",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "starlette",
    "httpcore",
    "aiofiles",
    "python-engineio",
    "literalai",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
boba-chainlit = "boba.chainlit.infra.entry:AppEntry.run"

[tool.setuptools.package-data]
"boba.chainlit.auth" = ["*.js"]
"boba.chainlit.chat" = ["translations/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true


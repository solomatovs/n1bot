[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-chainlit-agent"
version = "0.1.0"
description = "Chainlit web UI app for the Boba agent."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent",
    "boba-patterns",
    "boba-workspace",
    "boba-settings",
    "boba-llm",
    "boba-openai",
    "boba-tools",
    "chainlit>=2.11,<3",
    # chainlit 2.11+ ломает ForwardRef-резолв на pydantic 2.11+
    # ("CodeSettings is not fully defined"). Держим 2.10.x до апдейта chainlit.
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2.13,<3",
]

[project.scripts]
boba-chainlit-agent = "boba.chainlit.agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-hermes"
dynamic = ["version"]
description = "Chainlit web UI app over the Hermes agent backend."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-agent",
    "chainlit>=2.11,<3",
    "httpx[http2]>=0.28,<1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic>=2.10,<2.11",
    "psycopg[binary,pool]>=3.2",
    "sqlmodel>=0.0.22",
    "gssapi",
    "krb5",
    "ldap3",
    "fastapi-gssapi>=0.1.1",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.setuptools_scm]
root = "../../.."
tag_regex = '^release-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match=release-*", "--match=dev-*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-search-pipeline"
version = "0.1.0"
description = "Pipeline-оркестратор: семантический поиск в Store и вывод hits в текстовый sink."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing", "boba-patterns"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

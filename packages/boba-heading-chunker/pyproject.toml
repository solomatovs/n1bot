[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-heading-chunker"
version = "0.1.0"
description = "Boba indexing chunker: per-Section split (anchor-preserving), без пересечения границ heading'ов."
requires-python = ">=3.11,<4"
dependencies = ["boba-config", "boba-foundation", "boba-indexing", "boba-text-splitter"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

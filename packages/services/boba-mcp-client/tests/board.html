<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>board</title>
<style>
  :root { color-scheme: light; color: #1f1f1f; }
  :root[data-theme="dark"] { color-scheme: dark; color: #e8e8e8; }
  body { margin: 0; padding: 8px; font-family: sans-serif; }
  #board { border: 1px solid #888; min-height: 40px; padding: 4px; }
</style>
</head>
<body>
<div id="theme"></div>
<div id="board"></div>
<div id="result"></div>
<button id="call-app">app only</button>
<button id="call-model">model only</button>
<button id="send-message">message</button>
<button id="send-context">context</button>
<div id="answer"></div>
<div id="probe"></div>
<script>
  let next = 1;
  const waiting = new Map();

  function send(message) {
    window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, message), "*");
  }

  function request(method, params) {
    const id = next++;
    send({ id, method, params });
    return new Promise((resolve, reject) => waiting.set(id, { resolve, reject }));
  }

  function text(result) {
    return (result.content || []).map((block) => block.text || "").join(" ");
  }

  function answer(promise) {
    const node = document.getElementById("answer");
    promise.then(
      (result) => { node.textContent = "answer: " + text(result); },
      (error) => { node.textContent = "error: " + error.message; },
    );
  }

  function themed(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById("theme").textContent = "theme: " + theme;
  }

  // ширину задаёт хост, приложение сообщает только свою высоту — при любом
  // росте содержимого, а не только по уведомлениям хоста
  const sizes = new ResizeObserver(() => {
    send({
      method: "ui/notifications/size-changed",
      params: { height: document.body.scrollHeight },
    });
  });

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.jsonrpc !== "2.0") {
      return;
    }

    if (data.id !== undefined && waiting.has(data.id)) {
      const pending = waiting.get(data.id);
      waiting.delete(data.id);
      if (data.error) {
        pending.reject(new Error(data.error.message));
      } else {
        pending.resolve(data.result);
      }
      return;
    }

    if (data.method === "ui/notifications/tool-input") {
      document.getElementById("board").innerHTML = data.params.arguments.markup;
    }

    if (data.method === "ui/notifications/host-context-changed" && data.params.theme) {
      themed(data.params.theme);
    }

    if (data.method === "ui/notifications/tool-result") {
      document.getElementById("result").textContent = "result: " + text(data.params);
    }
  });

  document.getElementById("call-app").onclick = () =>
    answer(request("tools/call", { name: "app_only", arguments: {} }));
  document.getElementById("call-model").onclick = () =>
    answer(request("tools/call", { name: "model_only", arguments: {} }));
  document.getElementById("send-message").onclick = () =>
    answer(request("ui/message", {
      role: "user",
      content: [{ type: "text", text: "scenario:answer the board asks to go on" }],
    }));
  document.getElementById("send-context").onclick = () =>
    answer(request("ui/update-model-context", {
      content: [{ type: "text", text: "the board shows three cells" }],
      structuredContent: { cells: 3 },
    }));

  let cookies = "none";
  try {
    if (document.cookie) {
      cookies = document.cookie;
    }
  } catch (error) {
    cookies = "none";
  }

  let page = "hidden";
  try {
    page = window.top.document.title;
  } catch (error) {
    page = "hidden";
  }

  document.getElementById("probe").textContent = "cookies: " + cookies + "; chat page: " + page;

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "board", version: "1" },
    appCapabilities: {},
  }).then((result) => {
    themed(result.hostContext.theme);
    send({ method: "ui/notifications/initialized", params: {} });
    sizes.observe(document.body);
  });
</script>
</body>
</html>

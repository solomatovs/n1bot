[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-mcp-client"
version = "0.0.26.dev4"
description = "Boba mcp client: порт сервера инструментов над любым MCP-сервером — streamable HTTP, SSE или stdio; результаты семейства boba оживают моделями."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev4",
    "boba-canvas==0.0.26.dev4",
    "boba-auth==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-sandbox==0.0.26.dev4",
    "mcp>=2.3,<3",
    "httpx2>=2.10,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-runtime==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    "pytest-xdist>=3.6,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

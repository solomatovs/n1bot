[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-connection-broker"
version = "0.0.15.dev7"
description = "Boba connection broker: хранилище соединений и грантов на postgres, соединения субъекта на вызов, билеты kerberos для тел инструментов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev7",
    "boba-identity==0.0.15.dev7",
    "boba-connections==0.0.15.dev7",
    "boba-kerberos==0.0.15.dev7",
    "boba-toolrun==0.0.15.dev7",
    "boba-db-postgres==0.0.15.dev7",
    "pydantic>=2.10,<3",
    "langchain-core>=1.4,<1.5",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "boba-cancellation==0.0.15.dev7",
    "boba-db-clickhouse==0.0.15.dev7",
    "boba-transport-http==0.0.15.dev7",
    "boba-auth==0.0.15.dev7",
    "boba-stand==0.0.15.dev7",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

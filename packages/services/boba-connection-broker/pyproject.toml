[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-connection-broker"
version = "0.0.26.dev4"
description = "Boba connection broker: хранилище соединений и грантов на postgres, соединения субъекта на вызов, билеты kerberos для тел инструментов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-access==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "boba-kerberos==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-messaging==0.0.26.dev4",
    "fastapi>=0.116,<1",
    "pydantic>=2.12,<3",
    "langchain-core>=1.4,<1.5",
    "psycopg>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "boba-db-clickhouse==0.0.26.dev4",
    "boba-transport-http==0.0.26.dev4",
    "boba-auth==0.0.26.dev4",
    "boba-stand==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-connection-broker"
version = "0.0.30.dev3"
description = "Boba connection broker: хранилище соединений и грантов на postgres, соединения субъекта на вызов, билеты kerberos для тел инструментов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev3",
    "boba-toolkit==0.0.30.dev3",
    "boba-identity==0.0.30.dev3",
    "boba-access==0.0.30.dev3",
    "boba-connections==0.0.30.dev3",
    "boba-kerberos==0.0.30.dev3",
    "boba-toolrun==0.0.30.dev3",
    "boba-db-postgres==0.0.30.dev3",
    "pydantic>=2.12,<3",
    "psycopg>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "boba-db-clickhouse==0.0.30.dev3",
    "boba-transport-http==0.0.30.dev3",
    "boba-auth==0.0.30.dev3",
    "boba-stand==0.0.30.dev3",
    "boba-stand-core==0.0.30.dev3",
    "pytest>=9.1,<10",
]

[tool.setuptools.package-data]
"boba.connection_broker" = ["schema/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

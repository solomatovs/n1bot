[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-auth"
version = "0.0.30.dev2"
description = "Boba auth: вход пользователя приложений — токены, пароли, SPNEGO, креды."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-identity==0.0.30.dev2",
    "boba-connections==0.0.30.dev2",
    "boba-kerberos==0.0.30.dev2",
    "boba-krb[seal]==0.0.30.dev2",
    "boba-toolkit==0.0.30.dev2",
    "pydantic>=2.12,<3",
    "pyjwt>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "boba-ldap==0.0.30.dev2",
    "boba-config==0.0.30.dev2",
    "boba-stand==0.0.30.dev2",
    "boba-stand-core==0.0.30.dev2",
    "omegaconf>=2.3,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

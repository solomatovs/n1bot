[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolrun"
version = "0.0.33.dev2"
description = "Boba toolrun: конвейер обёрток вызова инструмента (права, отмена, журнал, поток, ошибки), исполнитель вызова и реестр инструментов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-config==0.0.33.dev2",
    "boba-connections==0.0.33.dev2",
    "boba-core==0.0.33.dev2",
    "boba-kerberos==0.0.33.dev2",
    "boba-tool-io==0.0.33.dev2",
    "boba-toolkit==0.0.33.dev2",
    "boba-access==0.0.33.dev2",
    "boba-cancellation==0.0.33.dev2",
    "boba-identity==0.0.33.dev2",
    "boba-canvas==0.0.33.dev2",
    "pydantic>=2.12,<3",
    "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
sandbox = ["boba-sandbox[host]==0.0.33.dev2", "boba-krb==0.0.33.dev2"]
dev = [
    "boba-sandbox[host]==0.0.33.dev2",
    "boba-stand==0.0.33.dev2",
    "boba-stand-core==0.0.33.dev2",
    "pytest>=9.1,<10",
    "boba-db-postgres==0.0.33.dev2",
    "boba-krb[connections]==0.0.33.dev2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[tool.boba.extras]
"boba.toolrun.sandbox" = "sandbox"
"boba.toolrun.cli" = "sandbox"

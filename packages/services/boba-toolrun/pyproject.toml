[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolrun"
version = "0.0.15.dev7"
description = "Boba toolrun: конвейер обёрток вызова инструмента (права, отмена, журнал, поток, ошибки), исполнитель вызова и реестр инструментов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev7",
    "boba-access==0.0.15.dev7",
    "boba-cancellation==0.0.15.dev7",
    "boba-identity==0.0.15.dev7",
    "boba-canvas==0.0.15.dev7",
    "boba-messaging==0.0.15.dev7",
    "pydantic>=2.10,<3",
    "langchain-core>=1.4,<1.5",
]

[project.optional-dependencies]
dev = [
    "boba-sandbox==0.0.15.dev7",
    "boba-stand==0.0.15.dev7",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

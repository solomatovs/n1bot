[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-toolrun"
version = "0.0.30.dev3"
description = "Boba toolrun: конвейер обёрток вызова инструмента (права, отмена, журнал, поток, ошибки), исполнитель вызова и реестр инструментов."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.30.dev3",
    "boba-access==0.0.30.dev3",
    "boba-cancellation==0.0.30.dev3",
    "boba-identity==0.0.30.dev3",
    "boba-canvas==0.0.30.dev3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-sandbox==0.0.30.dev3",
    "boba-stand==0.0.30.dev3",
    "boba-stand-core==0.0.30.dev3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

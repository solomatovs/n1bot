[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-mcp-adapter"
version = "0.0.30.dev5"
description = "Boba mcp adapter: карточки инструментов порта ToolServer как инструменты сервера fastmcp — общий слой boba-mcp и ретранслятора чата."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.30.dev5",
    "fastmcp-slim[server]>=4.0,<5",
    "mcp-types>=2.3,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand-core==0.0.30.dev5",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

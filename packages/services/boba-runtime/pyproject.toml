[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-runtime"
version = "0.0.26.dev4"
description = "Boba runtime: контейнер зависимостей app/session/call и загрузчик tool-плагинов из конфига."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-ldap==0.0.26.dev4",
    "boba-cancellation==0.0.26.dev4",
    "boba-access==0.0.26.dev4",
    "boba-canvas==0.0.26.dev4",
    "boba-messaging==0.0.26.dev4",
    "boba-chat==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-connection-broker==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-sandbox==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-krb[seal]==0.0.26.dev4",
    "boba-db-pgvector==0.0.26.dev4",
    "pydantic>=2.12,<3",
    "psycopg>=3.3,<4",
    "omegaconf>=2.3,<3",
    "starlette>=1.0,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "websockets>=13,<16",
    "aiofiles>=24.1,<26",
    "boba-auth==0.0.26.dev4",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "uvicorn>=0.35,<1",
    "pyjwt>=2.8,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

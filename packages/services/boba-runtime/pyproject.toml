[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-runtime"
version = "0.0.14.dev9"
description = "Boba runtime: контейнер зависимостей app/session/call и загрузчик tool-плагинов из конфига."
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "omegaconf>=2.3,<3",
    "langchain-core>=0.3,<1",
    "boba-access==0.0.14.dev9",
    "boba-canvas==0.0.14.dev9",
    "boba-chat==0.0.14.dev9",
    "boba-connections==0.0.14.dev9",
    "boba-db-postgres==0.0.14.dev9",
    "boba-connection-broker==0.0.14.dev9",
    "boba-identity==0.0.14.dev9",
    "boba-sandbox==0.0.14.dev9",
    "boba-settings==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
    "boba-toolrun==0.0.14.dev9",
    "boba-workflow-engine==0.0.14.dev9",
    "boba-workflow==0.0.14.dev9",
    "boba-tool-knowledge==0.0.14.dev9",
    "boba-tool-clickhouse==0.0.14.dev9",
    "boba-tool-postgres==0.0.14.dev9",
    "boba-tool-doc==0.0.14.dev9",
    "boba-tool-web==0.0.14.dev9",
    "boba-tool-chart==0.0.14.dev9",
    "boba-tool-shell==0.0.14.dev9",
    "boba-krb[seal]==0.0.14.dev9",
    "boba-db-pgvector==0.0.14.dev9",
    "starlette>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

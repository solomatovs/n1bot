[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-runtime"
version = "0.0.15.dev1"
description = "Boba runtime: контейнер зависимостей app/session/call и загрузчик tool-плагинов из конфига."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-ldap==0.0.15.dev1",
    "boba-cancellation==0.0.15.dev1",
    "boba-access==0.0.15.dev1",
    "boba-canvas==0.0.15.dev1",
    "boba-messaging==0.0.15.dev1",
    "boba-chat==0.0.15.dev1",
    "boba-connections==0.0.15.dev1",
    "boba-db-postgres==0.0.15.dev1",
    "boba-connection-broker==0.0.15.dev1",
    "boba-identity==0.0.15.dev1",
    "boba-sandbox==0.0.15.dev1",
    "boba-config==0.0.15.dev1",
    "boba-toolkit==0.0.15.dev1",
    "boba-toolrun==0.0.15.dev1",
    "boba-workflow-engine==0.0.15.dev1",
    "boba-tool-knowledge==0.0.15.dev1",
    "boba-krb[seal]==0.0.15.dev1",
    "boba-db-pgvector==0.0.15.dev1",
    "pydantic>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "omegaconf>=2.3,<3",
    "langchain-core>=1.4,<1.5",
    "starlette>=0.40",
    "boba-auth==0.0.15.dev1",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.15.dev1",
    "pyjwt>=2.8",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-workflow-engine"
version = "0.0.15.dev1"
description = "Boba workflow engine: хранилище workflow и запусков на postgres, каталог инструментов, исполнение графа стадий, инструменты workflow для чата."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-toolkit==0.0.15.dev1",
    "boba-identity==0.0.15.dev1",
    "boba-messaging==0.0.15.dev1",
    "boba-cancellation==0.0.15.dev1",
    "boba-workflow==0.0.15.dev1",
    "boba-connections==0.0.15.dev1",
    "boba-toolrun==0.0.15.dev1",
    "boba-db-postgres==0.0.15.dev1",
    "pydantic>=2.10,<3",
    "langchain-core>=1.4,<1.5",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "boba-runtime==0.0.15.dev1",
    "boba-stand==0.0.15.dev1",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

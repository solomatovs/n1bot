[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-oauth"
version = "0.0.26.dev4"
description = "Boba oauth: сервер авторизации OAuth 2.1 служб boba — токены, печати, страницы входа, обмен утверждения proxy."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-auth==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-runtime==0.0.26.dev4",
    "fastmcp-slim[server]>=4.0,<5",
    "mcp>=2.3,<3",
    "joserfc>=1.0,<2",
    "cryptography>=45.0.1",
    "starlette>=1.0,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "boba-stand==0.0.26.dev4",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

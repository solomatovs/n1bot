[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli-agent-run"
version = "0.1.0"
description = "Operator CLI: run a single agent query against the Boba runtime."
requires-python = ">=3.11,<4"
dependencies = [
    "boba",
    "boba-patterns",
    "boba-adapter-fs-workspace",
    "boba-adapter-messages",
    "boba-adapter-openai",
    "boba-adapter-prompt-providers",
    "boba-config-cli",
    "boba-config-env",
    "boba-config-toml",
]

[project.scripts]
boba-cli-agent-run = "boba.cli.agent_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

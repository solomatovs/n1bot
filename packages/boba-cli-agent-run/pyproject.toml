[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-cli-agent-run"
version = "0.1.0"
description = "Operator CLI: run a single agent query against the Boba runtime."
requires-python = ">=3.11,<4"
# Декларируем зависимость от boba core явно. На dev-машине и в Dockerfile
# ставится через --no-deps, потому что boba доставляется PYTHONPATH'ом, не
# pip-инсталляцией. Tool-плагины подгружаются через entry-points
# установленных pip-пакетов (boba-ext-files, boba-ext-chromadb и т.п.).
dependencies = [
    "boba",
    "boba-adapter-fs-workspace",
    "boba-adapter-messages",
    "boba-adapter-openai",
    "boba-adapter-prompt-providers",
    "boba-config-env",
    "boba-config-toml",
]

[project.scripts]
boba-cli-agent-run = "boba.cli.agent_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-fs-transport"
version = "0.1.0"
description = "Filesystem transport: FsRequest → RawDocument; FsWalkRequestSource обходит каталоги."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-confluence-shared"
version = "0.1.0"
description = "Shared Confluence-export HTML parser: heading collection + anchor resolution + macro stripping."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-foundation",
    "boba-html-parser",
    "boba-http-transport",
    "beautifulsoup4>=4.12",
    "httpx",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

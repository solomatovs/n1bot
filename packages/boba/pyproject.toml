[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba"
version = "0.1.0"
description = "Boba — RAG agent for knowledge base"
requires-python = ">=3.11,<4"
dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

# PEP 420 namespace-package: sub-пакеты в разных src-корнях, маппим явно.
# При добавлении нового sub-пакета — дописать в ``[tool.setuptools] packages``.
[tool.setuptools.package-dir]
"boba.domain" = "src/domain/src/boba/domain"
"boba.infra" = "src/infra/src/boba/infra"

[tool.setuptools]
packages = [
    "boba.domain",
    "boba.domain.agent",
    "boba.domain.agent.middleware",
    "boba.domain.agent.turn",
    "boba.domain.core",
    "boba.domain.core.tools",
    "boba.domain.llm",
    "boba.domain.llm.middleware",
    "boba.infra",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-tools"
version = "0.1.0"
description = "Boba tools framework: Tool, ToolsService, args/wire builders, plugin loader."
requires-python = ">=3.11,<4"
dependencies = ["boba-config", "boba-foundation", "boba-patterns", "boba-rendering"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-confluence-runtime"
version = "0.1.0"
description = "Boba runtime-extension для Confluence: онлайн-tools (search, page outline, page section) + page/search pipelines + httpx-фабрика."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core",
    "boba-agent",
    "boba-confluence-core",
    "httpx",
]

[project.entry-points."boba.tools"]
confluence = "boba.ext.confluence_runtime:register_tools"

[project.entry-points."boba.config_sections"]
confluence = "boba.ext.confluence_runtime.config:ConfluenceSection"
confluence_page = "boba.ext.confluence_runtime.tools.page:ConfluencePageSection"
confluence_page_outline = "boba.ext.confluence_runtime.tools.page_outline:ConfluencePageOutlineToolSection"
confluence_page_section = "boba.ext.confluence_runtime.tools.page_section:ConfluencePageSectionToolSection"
confluence_search = "boba.ext.confluence_runtime.tools.search:ConfluenceSearchToolSection"
confluence_search_runtime = "boba.ext.confluence_runtime.tools.search:ConfluenceSearchSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

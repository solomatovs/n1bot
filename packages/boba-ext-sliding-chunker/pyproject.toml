[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-sliding-chunker"
version = "0.1.0"
description = "Boba indexing chunker: character-based sliding window with soft breaks."
requires-python = ">=3.11,<4"
dependencies = ["boba-config", "boba-foundation", "boba-indexing"]

[project.entry-points."boba.indexing.chunkers"]
sliding = "boba.ext.sliding_chunker:register_chunkers"

[project.entry-points."boba.config_sections"]
sliding_chunker = "boba.ext.sliding_chunker.config:SlidingChunkerConfigSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

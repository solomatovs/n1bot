[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-markdown"
version = "0.1.0"
description = "Boba markdown: всё для индексации markdown — section-parser (ATX), block-parser (markdown-it-py), Reader, Chunker, MetadataKeys."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-indexing",
]

[project.optional-dependencies]
structural = ["markdown-it-py>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-confluence-core"
version = "0.1.0"
description = "Boba Confluence домен: HTML-парсер (heading-aware), connection-конфиг, JSON-decoder, heading-aware Reader. Без I/O-зависимостей."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-foundation",
    "boba-html-parser",
    "boba-http-transport",
    "boba-indexing",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-core"
version = "0.1.0"
description = "Boba core: patterns + foundation (declaration, value, coercion, workspace) + config + builtin config-sources (cli/env/dict). TOML живёт в boba-config-source-toml."
requires-python = ">=3.11,<4"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

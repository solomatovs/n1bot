[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-core"
version = "0.1.0"
description = "Boba core: patterns + foundation (errors, declaration, value, coercion, workspace) + config + config-sources (cli/env/toml)."
requires-python = ">=3.11,<4"
dependencies = ["tomli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stand"
version = "0.0.26.dev4"
description = "Boba stand: общие фикстуры тестов — конфиг, тестовая база, пул, kerberos, контекст вызова."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-db-clickhouse[payload]==0.0.26.dev4",
    "boba-db-oracle[payload]==0.0.26.dev4",
    "boba-transport-http==0.0.26.dev4",
    "boba-auth==0.0.26.dev4",
    "boba-chat==0.0.26.dev4",
    "boba-llm-http==0.0.26.dev4",
    "boba-connection-broker==0.0.26.dev4",
    "boba-sandbox==0.0.26.dev4",
    "boba-tool-shell==0.0.26.dev4",
    "boba-tool-clickhouse==0.0.26.dev4",
    "boba-tool-postgres==0.0.26.dev4",
    "boba-tool-web==0.0.26.dev4",
    "boba-catalog-service==0.0.26.dev4",
    "boba-catalog==0.0.26.dev4",
    "boba-config==0.0.26.dev4",
    "boba-identity==0.0.26.dev4",
    "boba-messaging==0.0.26.dev4",
    "boba-krb[seal]==0.0.26.dev4",
    "boba-kerberos==0.0.26.dev4",
    "boba-db-postgres==0.0.26.dev4",
    "boba-connections==0.0.26.dev4",
    "boba-runtime==0.0.26.dev4",
    "boba-ldap==0.0.26.dev4",
    "boba-access==0.0.26.dev4",
    "boba-toolkit==0.0.26.dev4",
    "boba-toolrun==0.0.26.dev4",
    "boba-stand-core==0.0.26.dev4",
    "boba-ix-core==0.0.26.dev4",
    "boba-ix-fts==0.0.26.dev4",
    "boba-ix-trgm==0.0.26.dev4",
    "boba-ix-vector==0.0.26.dev4",
    "boba-cfl-indexer==0.0.26.dev4",
    "boba-confluence==0.0.26.dev4",
    "boba-llm==0.0.26.dev4",
    "boba-llm-fastembed==0.0.26.dev4",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "typing-extensions>=4.12,<5",
    "playwright>=1.47,<2",
    "pydantic>=2.12,<3",
    "uvicorn>=0.35,<1",
    "pytest>=9.1,<10",
    "anyio>=4,<5",
    "psycopg>=3.3,<4",
    "omegaconf>=2.3,<3",
    "langchain-core>=1.4,<1.5",
    "krb5>=0.7,<1",
    "gssapi>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "boba-chainlit==0.0.26.dev4",
    "starlette>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

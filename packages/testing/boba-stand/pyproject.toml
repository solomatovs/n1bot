[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stand"
version = "0.0.14.dev9"
description = "Boba stand: общие фикстуры тестов — конфиг, тестовая база, пул, kerberos, контекст вызова."
requires-python = ">=3.11,<4"
dependencies = [
    "pytest>=8",
    "anyio>=4",
    "psycopg[binary,pool]>=3.2,<4",
    "omegaconf>=2.3,<3",
    "boba-settings==0.0.14.dev9",
    "boba-identity==0.0.14.dev9",
    "boba-cancellation==0.0.14.dev9",
    "boba-krb==0.0.14.dev9",
    "boba-db-postgres==0.0.14.dev9",
    "boba-connections==0.0.14.dev9",
    "boba-runtime==0.0.14.dev9",
    "boba-access==0.0.14.dev9",
    "boba-toolkit==0.0.14.dev9",
    "boba-toolrun==0.0.14.dev9",
    "langchain-core>=0.3",
    "krb5>=0.7",
    "gssapi>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

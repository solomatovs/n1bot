[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stand"
version = "0.0.30.dev5"
description = "Boba stand: общие фикстуры тестов — конфиг, тестовая база, пул, kerberos, контекст вызова."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-core==0.0.30.dev5",
    "agent-client-protocol==1.0.0rc3",
    "boba-db-clickhouse[payload]==0.0.30.dev5",
    "boba-db-oracle[payload]==0.0.30.dev5",
    "boba-transport-http==0.0.30.dev5",
    "boba-auth==0.0.30.dev5",
    "boba-chat==0.0.30.dev5",
    "boba-llm-http==0.0.30.dev5",
    "boba-connection-broker==0.0.30.dev5",
    "boba-sandbox==0.0.30.dev5",
    "boba-tool-shell==0.0.30.dev5",
    "boba-tool-clickhouse==0.0.30.dev5",
    "boba-tool-postgres==0.0.30.dev5",
    "boba-tool-web==0.0.30.dev5",
    "boba-config==0.0.30.dev5",
    "boba-identity==0.0.30.dev5",
    "boba-krb[seal]==0.0.30.dev5",
    "boba-kerberos==0.0.30.dev5",
    "boba-db-postgres==0.0.30.dev5",
    "boba-connections==0.0.30.dev5",
    "boba-runtime==0.0.30.dev5",
    "boba-ldap==0.0.30.dev5",
    "boba-access==0.0.30.dev5",
    "boba-toolkit==0.0.30.dev5",
    "boba-toolrun==0.0.30.dev5",
    "boba-stand-core==0.0.30.dev5",
    "boba-ix-core==0.0.30.dev5",
    "boba-ix-fts==0.0.30.dev5",
    "boba-ix-trgm==0.0.30.dev5",
    "boba-ix-vector==0.0.30.dev5",
    "boba-cfl-indexer==0.0.30.dev5",
    "boba-confluence==0.0.30.dev5",
    "boba-llm==0.0.30.dev5",
    "boba-llm-fastembed==0.0.30.dev5",
    "boba-agent==0.0.30.dev5",
    "boba-cli==0.0.30.dev5",
    "boba-history-jsonl==0.0.30.dev5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "typing-extensions>=4.12,<5",
    "playwright>=1.47,<2",
    "pydantic>=2.12,<3",
    "uvicorn>=0.35,<1",
    "pytest>=9.1,<10",
    "anyio>=4,<5",
    "psycopg>=3.3,<4",
    "omegaconf>=2.3,<3",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "mcp-types>=2.3,<3",
]

[tool.setuptools.package-data]
"boba.stand" = ["acp_schema/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

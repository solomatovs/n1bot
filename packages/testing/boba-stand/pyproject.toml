[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-stand"
version = "0.0.15.dev1"
description = "Boba stand: общие фикстуры тестов — конфиг, тестовая база, пул, kerberos, контекст вызова."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-auth==0.0.15.dev1",
    "boba-chat==0.0.15.dev1",
    "boba-connection-broker==0.0.15.dev1",
    "boba-sandbox==0.0.15.dev1",
    "boba-workflow==0.0.15.dev1",
    "boba-workflow-engine==0.0.15.dev1",
    "boba-config==0.0.15.dev1",
    "boba-identity==0.0.15.dev1",
    "boba-messaging==0.0.15.dev1",
    "boba-cancellation==0.0.15.dev1",
    "boba-krb==0.0.15.dev1",
    "boba-db-postgres==0.0.15.dev1",
    "boba-connections==0.0.15.dev1",
    "boba-runtime==0.0.15.dev1",
    "boba-access==0.0.15.dev1",
    "boba-toolkit==0.0.15.dev1",
    "boba-toolrun==0.0.15.dev1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "playwright>=1.47",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30",
    "pytest>=8",
    "anyio>=4",
    "psycopg[binary,pool]>=3.2,<4",
    "omegaconf>=2.3,<3",
    "langchain-core>=0.3",
    "krb5>=0.7",
    "gssapi>=1.9",
]

[project.optional-dependencies]
dev = [
    "boba-chainlit==0.0.15.dev1",
    "starlette>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

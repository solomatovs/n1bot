[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-files"
version = "0.1.0"
description = "Builtin file-system tools for the Boba agent (cat/ls/grep/edit/write/...)."
requires-python = ">=3.11,<4"
dependencies = ["boba"]

[project.entry-points."boba.tools"]
files = "boba_files:register_tools"

[tool.setuptools.packages.find]
where = ["src"]

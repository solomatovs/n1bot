[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-html-reader"
version = "0.1.0"
description = "Boba indexing reader: HTML → heading-aware Section'ы."
requires-python = ">=3.11,<4"
dependencies = [
    "boba-foundation",
    "boba-indexing",
    "boba-html-parser",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-reader-markdown"
version = "0.1.0"
description = "Boba Markdown reader: heading-aware Section'ы из markdown-документов (ATX-headings + slug-anchor'ы)."
requires-python = ">=3.11,<4"
dependencies = ["boba-indexing"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba-ext-confluence-source"
version = "0.1.0"
description = "Boba indexing source: Confluence Server/DC REST. 3 modes — space, pages, cql."
requires-python = ">=3.11,<4"
dependencies = ["boba-config", "boba-foundation", "boba-indexing", "httpx>=0.27"]

[project.entry-points."boba.indexing.sources"]
confluence = "boba.ext.confluence_source:register_sources"

[project.entry-points."boba.config_sections"]
confluence_common = "boba.ext.confluence_source.config:ConfluenceCommonSection"
confluence_space = "boba.ext.confluence_source.space_source:ConfluenceSpaceSourceSection"
confluence_pages = "boba.ext.confluence_source.pages_source:ConfluencePagesSourceSection"
confluence_cql = "boba.ext.confluence_source.cql_source:ConfluenceCqlSourceSection"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boba*"]
namespaces = true

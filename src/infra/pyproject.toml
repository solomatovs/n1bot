[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boba-infra"
version = "0.1.0"
description = "Boba infrastructure — DI container, composition root"
authors = ["Sergei Solomatov"]
packages = [{ include = "boba/infra", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boba-domain = { path = "../domain", develop = true }
boba-adapters = { path = "../adapters", develop = true }
dishka = "*"
openai = "*"
httpx = "*"
tomli = "*"

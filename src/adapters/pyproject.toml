[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boba-adapters"
version = "0.1.0"
description = "Boba adapters — concrete implementations of domain protocols"
authors = ["Sergei Solomatov"]
packages = [{ include = "boba/adapters", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boba-domain = { path = "../domain", develop = true }
openai = "*"
httpx = "*"

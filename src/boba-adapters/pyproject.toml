[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boba-adapters"
version = "0.1.0"
description = "N1Bot adapters — concrete implementations of domain protocols"
authors = ["Sergei Solomatov"]
packages = [{ include = "boba_adapters", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boba-domain = { path = "../boba-domain", develop = true }
openai = "*"
chromadb = "*"
langchain = "*"
langchain-community = "*"
langchain-openai = "*"
langchain-core = "*"
langchain-chroma = "*"
langchain-ollama = "*"
httpx = "*"
numpy = "*"
tiktoken = "*"
markdownify = "*"
atlassian-python-api = "*"
pydantic = "*"
lxml = "*"

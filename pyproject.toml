[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
pythonpath = [
    "packages/boba-agent/src",
    "packages/boba-config-source-toml/src",
    "packages/boba-core/src",
    "packages/boba-indexing/src",
    "packages/boba-llm/src",
    "packages/boba-messages-jsonl/src",
    "packages/boba-prompt-providers/src",
    "packages/boba-provider-openai/src",
    "packages/boba-tools/src",
    "packages/boba-workspace-fs/src",
    "packages/agents/boba-cli-agent-run/src",
    "packages/agents/boba-web-chainlit/src",
    "packages/tools/boba-tool-chromadb/src",
    "packages/tools/boba-tool-confluence/src",
    "packages/tools/boba-tool-files/src",
    "packages/tools/boba-tool-html/src",
]
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "integration: тест ходит во внешние сервисы (Confluence/Ollama/...). Запускать вручную: `pytest -m integration`. По умолчанию исключаются.",
]

[tool.pyright]
include = ["packages"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
extraPaths = [
    "packages/boba-agent/src",
    "packages/boba-config-source-toml/src",
    "packages/boba-core/src",
    "packages/boba-indexing/src",
    "packages/boba-llm/src",
    "packages/boba-messages-jsonl/src",
    "packages/boba-prompt-providers/src",
    "packages/boba-provider-openai/src",
    "packages/boba-tools/src",
    "packages/boba-workspace-fs/src",
    "packages/agents/boba-cli-agent-run/src",
    "packages/agents/boba-web-chainlit/src",
    "packages/tools/boba-tool-chromadb/src",
    "packages/tools/boba-tool-confluence/src",
    "packages/tools/boba-tool-files/src",
    "packages/tools/boba-tool-html/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "B", "UP", "SIM", "C90", "N", "S",
    "A", "C4", "T20", "PT", "RET", "PIE", "PL", "RUF",
]
ignore = [
    # ambiguous unicode — ложные срабатывания на кириллице
    "RUF001", "RUF002", "RUF003",
    "RET504",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["boba"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "SLF001", "S105", "S106", "PLC0415"]
"packages/agents/boba-cli-*/**" = ["T201", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/boba/src/domain/src",
    "packages/boba/src/infra/src",
    "packages/boba-adapter-fs-workspace/src",
    "packages/boba-adapter-messages/src",
    "packages/boba-adapter-openai/src",
    "packages/boba-adapter-prompt-providers/src",
    "packages/boba-config-cli/src",
    "packages/boba-config-env/src",
    "packages/boba-config-toml/src",
    "packages/boba-web-chainlit/src",
    "packages/boba-cli-agent-run/src",
    "packages/boba-cli-vector-index/src",
    "packages/boba-ext-files/src",
    "packages/boba-ext-chromadb/src",
]
addopts = ["--strict-markers"]

[tool.pyright]
include = ["packages", "tests"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
extraPaths = [
    "packages/boba/src/domain/src",
    "packages/boba/src/infra/src",
    "packages/boba-adapter-fs-workspace/src",
    "packages/boba-adapter-messages/src",
    "packages/boba-adapter-openai/src",
    "packages/boba-adapter-prompt-providers/src",
    "packages/boba-config-cli/src",
    "packages/boba-config-env/src",
    "packages/boba-config-toml/src",
    "packages/boba-web-chainlit/src",
    "packages/boba-cli-agent-run/src",
    "packages/boba-cli-vector-index/src",
    "packages/boba-ext-files/src",
    "packages/boba-ext-chromadb/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "B", "UP", "SIM", "C90", "N", "S",
    "A", "C4", "T20", "PT", "RET", "PIE", "PL", "RUF",
]
ignore = [
    # ambiguous unicode — ложные срабатывания на кириллице
    "RUF001", "RUF002", "RUF003",
    "RET504",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["boba"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "SLF001", "S105", "S106", "PLC0415"]
"packages/boba-cli-*/**" = ["T201", "BLE001"]

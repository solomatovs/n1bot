[tool.pytest.ini_options]
testpaths = ["packages"]
cache_dir = "compose/.pytest_cache"
python_files = ["test_*.py"]
pythonpath = [
    "packages/infra/format/boba-kbdoc/src",
    "packages/infra/format/boba-liteparse/src",
    "packages/infra/format/boba-text/src",
    "packages/infra/llm/boba-llm/src",
    "packages/infra/transport/boba-transport-http/src",
    "packages/infra/db/boba-db-postgres/src",
    "packages/infra/db/boba-db-pgvector/src",
    "packages/infra/db/boba-db-clickhouse/src",
    "packages/infra/sandbox/boba-sandbox/src",
    "packages/infra/krb/boba-krb/src",
    "packages/core/boba-cancellation/src",
    "packages/core/boba-indexing/src",
    "packages/core/boba-settings/src",
    "packages/core/boba-toolkit/src",
    "packages/agents/boba-chainlit/src",
    "packages/tools/boba-tool-shell/src",
    "packages/tools/boba-tool-chart/src",
    "packages/tools/boba-tool-web/src",
    "packages/tools/boba-tool-doc/src",
    "packages/tools/boba-tool-postgres/src",
    "packages/tools/boba-tool-clickhouse/src",
    "packages/tools/boba-tool-knowledge/src",
]
addopts = ["--strict-markers", "-m", "not integration and not ui and not load and not run"]
markers = [
    "run: ручной прогон инструмента с аргументами из файла теста. Запускать вручную: `pytest -m run` (или F5 на файле). По умолчанию исключаются.",
    "integration: тест ходит во внешние сервисы (Confluence/Ollama/...). Запускать вручную: `pytest -m integration`. По умолчанию исключаются.",
    "ui: тест поднимает приложение и браузер (playwright + postgres). Запускать вручную: `pytest -m ui`. По умолчанию исключаются.",
    "load: нагрузка и аварийные завершения песочницы; минуты и десятки процессов. Запускать вручную: `pytest -m load`. По умолчанию исключаются.",
]

[tool.pyright]
include = ["packages", "build/test"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "packages/*/*/build",
]
extraPaths = [
    "packages/infra/format/boba-kbdoc/src",
    "packages/infra/format/boba-liteparse/src",
    "packages/infra/format/boba-text/src",
    "packages/infra/llm/boba-llm/src",
    "packages/infra/transport/boba-transport-http/src",
    "packages/infra/db/boba-db-postgres/src",
    "packages/infra/db/boba-db-pgvector/src",
    "packages/infra/db/boba-db-clickhouse/src",
    "packages/infra/sandbox/boba-sandbox/src",
    "packages/infra/krb/boba-krb/src",
    "packages/core/boba-cancellation/src",
    "packages/core/boba-indexing/src",
    "packages/core/boba-settings/src",
    "packages/core/boba-toolkit/src",
    "packages/agents/boba-chainlit/src",
    "packages/tools/boba-tool-shell/src",
    "packages/tools/boba-tool-chart/src",
    "packages/tools/boba-tool-web/src",
    "packages/tools/boba-tool-doc/src",
    "packages/tools/boba-tool-postgres/src",
    "packages/tools/boba-tool-clickhouse/src",
    "packages/tools/boba-tool-knowledge/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py311"
line-length = 88
force-exclude = true
extend-exclude = [
    "compose",
    "build/src",
    "packages/*/*/build",
]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "B", "UP", "SIM", "C90", "N", "S",
    "A", "C4", "T20", "PT", "RET", "PIE", "PL", "RUF", "TID",
]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "RET504",
    "SIM102", "SIM108",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["boba"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"shutil.which".msg = "PATH is attacker-controlled: use boba.toolkit.binaries.TrustedBinaries"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101", "PLR2004", "SLF001", "S105", "S106", "PLC0415", "TID251", "T201",
    "C901",
]
"build/test/**" = ["T201", "E402", "TID251", "S603", "PLW1510", "S108"]

[tool.uv.workspace]
members = [
    "packages/core/*",
    "packages/agents/*",
    "packages/tools/*",
    "packages/infra/*/*",
]

[tool.uv.sources]
boba-settings       = { workspace = true }
boba-cancellation   = { workspace = true }
boba-indexing       = { workspace = true }
boba-toolkit        = { workspace = true }
boba-tool-shell     = { workspace = true }
boba-tool-chart     = { workspace = true }
boba-tool-web       = { workspace = true }
boba-tool-doc       = { workspace = true }
boba-tool-postgres  = { workspace = true }
boba-tool-clickhouse = { workspace = true }
boba-tool-knowledge = { workspace = true }
boba-kbdoc          = { workspace = true }
boba-liteparse      = { workspace = true }
boba-text           = { workspace = true }
boba-transport-http = { workspace = true }
boba-db-postgres    = { workspace = true }
boba-db-pgvector    = { workspace = true }
boba-db-clickhouse  = { workspace = true }
boba-sandbox        = { workspace = true }
boba-krb            = { workspace = true }
boba-llm            = { workspace = true }
boba-chainlit       = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "pyright>=1.1.400",
    "playwright>=1.40",
    "boba-liteparse",
    "markdownify>=0.11,<1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "clickhouse-connect[async]>=1.6,<2",
    "fastembed>=0.4,<1",
    "onnxruntime-genai>=0.15,<1",
]

[tool.uv]
python-downloads = "never"
python-preference = "only-system"
environments = ["python_full_version >= '3.11' and python_full_version < '3.12' and sys_platform == 'linux'"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "n1bot"
version = "0.1.0"
description = "N1 Hub RAG — Confluence knowledge base"
authors = ["Sergei Solomatov"]
packages = [{ include = "**/*.py", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
chromadb = "*"
langchain = "*"
langchain-community = "*"
langchain-openai = "*"
langchain-core = "*"
langchain-chroma = "*"
langchain-ollama = "*"
httpx = "*"
numpy = "*"
openai = "*"
tiktoken = "*"
pandas = "*"
markdownify = "*"
atlassian-python-api = "*"
pydantic = "*"
lxml = "*"


[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
pyright = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

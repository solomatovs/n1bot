[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boba"
version = "0.1.0"
description = "Boba — RAG agent for Confluence knowledge base"
authors = ["Sergei Solomatov"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
boba-domain = { path = "src/domain", develop = true }
boba-app = { path = "src/app", develop = true }
boba-adapters = { path = "src/adapters", develop = true }
boba-infra = { path = "src/infra", develop = true }
boba-api = { path = "src/api", develop = true }
boba-chainlit = { path = "src/chainlit", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
pyright = "*"
black = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src/domain/src",
    "src/app/src",
    "src/adapters/src",
    "src/infra/src",
    "src/api/src",
    "src/chainlit/src",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = [
    "src/domain/src",
    "src/app/src",
    "src/adapters/src",
    "src/infra/src",
    "src/api/src",
    "src/chainlit/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boba"
version = "0.1.0"
description = "Boba — RAG agent for Confluence knowledge base"
authors = ["Sergei Solomatov"]
packages = [{ include = "boba", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boba-domain = { path = "src/boba-domain", develop = true }
boba-app = { path = "src/boba-app", develop = true }
boba-adapters = { path = "src/boba-adapters", develop = true }
boba-infra = { path = "src/boba-infra", develop = true }
boba-api = { path = "src/boba-api", develop = true }
boba-chainlit = { path = "src/boba-chainlit", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
pyright = "*"
black = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src/boba-domain/src",
    "src/boba-app/src",
    "src/boba-adapters/src",
    "src/boba-infra/src",
    "src/boba-api/src",
    "src/boba-chainlit/src",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = [
    "src/boba-domain/src",
    "src/boba-app/src",
    "src/boba-adapters/src",
    "src/boba-infra/src",
    "src/boba-api/src",
    "src/boba-chainlit/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

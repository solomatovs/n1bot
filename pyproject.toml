[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boba"
version = "0.1.0"
description = "Boba — RAG agent for knowledge base"
requires-python = ">=3.11,<4"
# requirements.txt. Редактируется руками, никем не генерируется.
# setuptools читает его в момент сборки, чтобы `pip install .` (если понадобится)
# видел те же зависимости, что и Dockerfile (`-r requirements.txt`).
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

# boba — namespace-package (PEP 420) c четырьмя sub-пакетами в разных
# src-корнях. ``packages.find`` со списком ``where`` тут не работает
# (setuptools требует, чтобы каждый найденный пакет существовал во
# ВСЕХ ``where``), поэтому маппим корни sub-пакетов явно через
# ``package-dir`` и перечисляем все импортируемые пакеты в
# ``packages``.
#
# Если добавляется новый sub-package (например, ``boba.domain.kb``) —
# нужно дописать его в ``packages``. Можно регенерить из дерева:
#   find src -mindepth 4 -type d -path '*/src/boba*' \
#     -not -path '*__pycache__*' -not -name '*.egg-info'
[tool.setuptools.package-dir]
"boba.domain" = "src/domain/src/boba/domain"
"boba.adapters" = "src/adapters/src/boba/adapters"
"boba.infra" = "src/infra/src/boba/infra"
"boba.chainlit" = "src/chainlit/src/boba/chainlit"

[tool.setuptools]
packages = [
    "boba.adapters",
    "boba.adapters.llm",
    "boba.chainlit",
    "boba.domain",
    "boba.domain.agent",
    "boba.domain.agent.meat",
    "boba.domain.agent.turn",
    "boba.domain.core",
    "boba.domain.core.tools",
    "boba.domain.llm",
    "boba.domain.llm.meat",
    "boba.infra",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src/domain/src",
    "src/adapters/src",
    "src/infra/src",
    "src/chainlit/src",
]
addopts = ["--strict-markers"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
extraPaths = [
    "src/domain/src",
    "src/adapters/src",
    "src/infra/src",
    "src/chainlit/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F",      # pyflakes — неиспользуемые импорты, undefined names, redefined unused
    "E",      # pycodestyle errors — стилистические ошибки (пробелы, отступы)
    "W",      # pycodestyle warnings — стилистические предупреждения
    "I",      # isort — сортировка и группировка импортов
    "B",      # flake8-bugbear — частые баги и антипаттерны
    "UP",     # pyupgrade — модернизация синтаксиса до 3.11+
    "SIM",    # flake8-simplify — упрощение конструкций
    "C90",    # mccabe — сложность функций
    "N",      # pep8-naming — CamelCase/snake_case
    "S",      # flake8-bandit — безопасность
    "A",      # flake8-builtins — shadowing встроенных имён
    "C4",     # flake8-comprehensions — упрощение comprehensions
    "T20",    # flake8-print — забытые print()
    "PT",     # flake8-pytest-style — best practices для pytest
    "RET",    # flake8-return — упрощение return
    "PIE",    # flake8-pie — мелкие улучшения
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "RUF001",  # ambiguous unicode in string — ложные срабатывания на кириллице
    "RUF002",  # ambiguous unicode in docstring — same
    "RUF003",  # ambiguous unicode in comment — same
    "RET504",  # unnecessary assign before return — мешает при построении цепочек
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["boba", "boba"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert — ожидаемо в pytest
    "PLR2004", # magic values — допустимы в assert
    "SLF001",  # доступ к _private — допустим при тестировании внутренностей
    "S105",    # hardcoded password — false positive на поля вроде AnswerToken.token
    "S106",    # same reason
]
"cli/**" = [
    "T201",    # print — основной канал вывода CLI, не runtime-код
    "BLE001",  # broad except — CLI логирует и продолжает, не падает на одной коллекции
]

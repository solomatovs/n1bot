[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
pythonpath = [
    "packages/boba-patterns/src",
    "packages/boba-foundation/src",
    "packages/boba-config/src",
    "packages/boba-indexing/src",
    "packages/boba-llm/src",
    "packages/boba-tools/src",
    "packages/boba-agent/src",
    "packages/boba-config-source-cli/src",
    "packages/boba-config-source-env/src",
    "packages/boba-config-source-toml/src",
    "packages/boba-adapter-fs-workspace/src",
    "packages/boba-adapter-messages/src",
    "packages/boba-adapter-openai/src",
    "packages/boba-adapter-prompt-providers/src",
    "packages/boba-ext-files/src",
    "packages/boba-ext-chromadb-shared/src",
    "packages/boba-ext-chromadb-tools/src",
    "packages/boba-ext-chromadb-store/src",
    "packages/boba-ext-confluence/src",
    "packages/boba-ext-html/src",
    "packages/boba-ext-html-reader/src",
    "packages/boba-ext-text-reader/src",
    "packages/boba-ext-markdown-reader/src",
    "packages/boba-ext-fs-source/src",
    "packages/boba-ext-sliding-chunker/src",
    "packages/boba-cli-agent-run/src",
    "packages/boba-cli-vector-index/src",
    "packages/boba-web-chainlit/src",
]
addopts = ["--strict-markers"]

[tool.pyright]
include = ["packages"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
extraPaths = [
    "packages/boba-patterns/src",
    "packages/boba-foundation/src",
    "packages/boba-config/src",
    "packages/boba-indexing/src",
    "packages/boba-llm/src",
    "packages/boba-tools/src",
    "packages/boba-agent/src",
    "packages/boba-config-source-cli/src",
    "packages/boba-config-source-env/src",
    "packages/boba-config-source-toml/src",
    "packages/boba-adapter-fs-workspace/src",
    "packages/boba-adapter-messages/src",
    "packages/boba-adapter-openai/src",
    "packages/boba-adapter-prompt-providers/src",
    "packages/boba-ext-files/src",
    "packages/boba-ext-chromadb-shared/src",
    "packages/boba-ext-chromadb-tools/src",
    "packages/boba-ext-chromadb-store/src",
    "packages/boba-ext-confluence/src",
    "packages/boba-ext-html/src",
    "packages/boba-ext-html-reader/src",
    "packages/boba-ext-text-reader/src",
    "packages/boba-ext-markdown-reader/src",
    "packages/boba-ext-fs-source/src",
    "packages/boba-ext-sliding-chunker/src",
    "packages/boba-cli-agent-run/src",
    "packages/boba-cli-vector-index/src",
    "packages/boba-web-chainlit/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "B", "UP", "SIM", "C90", "N", "S",
    "A", "C4", "T20", "PT", "RET", "PIE", "PL", "RUF",
]
ignore = [
    # ambiguous unicode — ложные срабатывания на кириллице
    "RUF001", "RUF002", "RUF003",
    "RET504",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["boba"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "SLF001", "S105", "S106", "PLC0415"]
"packages/boba-cli-*/**" = ["T201", "BLE001"]

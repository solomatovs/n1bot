# Корневой pyproject.toml монорепо.
#
# Сам по себе НЕ устанавливаемый пакет — никакой ``[project]`` секции.
# Все pip-installable пакеты живут в ``packages/<name>/``, каждый со
# своим ``pyproject.toml``. Установить весь workspace одной командой:
#
#     pip install -r dev-install.txt
#
# Здесь — только конфиги общих dev-инструментов (ruff/pytest/pyright),
# которые применяются к коду из всех пакетов.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/boba/src/domain/src",
    "packages/boba/src/infra/src",
    "packages/boba-adapter-fs-workspace/src",
    "packages/boba-adapter-messages/src",
    "packages/boba-adapter-openai/src",
    "packages/boba-adapter-prompt-providers/src",
]
addopts = ["--strict-markers"]

[tool.pyright]
include = ["packages", "tests"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
extraPaths = [
    "packages/boba/src/domain/src",
    "packages/boba/src/infra/src",
    "packages/boba-adapter-fs-workspace/src",
    "packages/boba-adapter-messages/src",
    "packages/boba-adapter-openai/src",
    "packages/boba-adapter-prompt-providers/src",
    "packages/boba-config-env/src",
    "packages/boba-config-toml/src",
    "packages/boba-chainlit/src",
    "packages/boba-cli-agent-run/src",
    "packages/boba-cli-vector-index/src",
    "packages/boba-ext-files/src",
    "packages/boba-ext-chromadb/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F",      # pyflakes — неиспользуемые импорты, undefined names, redefined unused
    "E",      # pycodestyle errors — стилистические ошибки (пробелы, отступы)
    "W",      # pycodestyle warnings — стилистические предупреждения
    "I",      # isort — сортировка и группировка импортов
    "B",      # flake8-bugbear — частые баги и антипаттерны
    "UP",     # pyupgrade — модернизация синтаксиса до 3.11+
    "SIM",    # flake8-simplify — упрощение конструкций
    "C90",    # mccabe — сложность функций
    "N",      # pep8-naming — CamelCase/snake_case
    "S",      # flake8-bandit — безопасность
    "A",      # flake8-builtins — shadowing встроенных имён
    "C4",     # flake8-comprehensions — упрощение comprehensions
    "T20",    # flake8-print — забытые print()
    "PT",     # flake8-pytest-style — best practices для pytest
    "RET",    # flake8-return — упрощение return
    "PIE",    # flake8-pie — мелкие улучшения
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "RUF001",  # ambiguous unicode in string — ложные срабатывания на кириллице
    "RUF002",  # ambiguous unicode in docstring — same
    "RUF003",  # ambiguous unicode in comment — same
    "RET504",  # unnecessary assign before return — мешает при построении цепочек
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
# Все пакеты монорепо считаются first-party — иначе isort расталкивает
# `boba_config_*`/`boba_chainlit`/`boba_chromadb`/... как third-party
# и кладёт перед `boba.*`, что ломает группировку.
known-first-party = [
    "boba",
    "boba_adapter_fs_workspace",
    "boba_adapter_messages",
    "boba_adapter_openai",
    "boba_adapter_prompt_providers",
    "boba_chainlit",
    "boba_chromadb",
    "boba_cli_agent_run",
    "boba_cli_vector_index",
    "boba_config_env",
    "boba_config_toml",
    "boba_files",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert — ожидаемо в pytest
    "PLR2004", # magic values — допустимы в assert
    "SLF001",  # доступ к _private — допустим при тестировании внутренностей
    "S105",    # hardcoded password — false positive на поля вроде AnswerToken.token
    "S106",    # same reason
]
"packages/boba-cli-*/**" = [
    "T201",    # print — основной канал вывода CLI, не runtime-код
    "BLE001",  # broad except — CLI логирует и продолжает, не падает на одной коллекции
]

# ============================================================
# Boba — шаблон конфигурации
#
# Скопируйте в config.toml и заполните значения:
#   cp config.example.toml config.toml
#
# Секреты хранятся отдельно в ../secrets/:
#   echo "your-api-key" > ../secrets/litellm_api_key
#
# Приоритет разрешения: <KEY>_FILE → <KEY> env → TOML → default
# ============================================================

[app]
ssl_verify = false
log_level = "INFO"
# log_file = "/var/log/boba.log"

[app.llm]
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
# api_key подаётся через LITELLM_API_KEY_FILE (или LITELLM_API_KEY env)

# Дефолты sampling (применяются SamplingMiddleware):
# temperature = 0.7
# top_p = 1.0
# max_tokens = 4096
# seed = 42
# stop = ["</s>"]
# frequency_penalty = 0.0
# presence_penalty = 0.0
# parallel_tool_calls = true

[app.agent]
max_iterations = 20
max_consecutive_tool_calls = 3
max_consecutive_format_failures = 3

[app.workspaces]
base_dir = "./workspaces"
user = "user"
system = "system"
tmp = "tmp"

secrets:
  litellm_api_key:
    file: secrets/litellm_api_key
  confluence_token:
    file: secrets/confluence_token
  chainlit_auth_secret:
    file: secrets/chainlit_auth_secret

services:
  boba-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: boba-api
    command: ["python3", "-m", "boba_api"]
    volumes:
      - ./import:/app/import
      - ./config/config.toml:/app/config.toml:ro
    environment:
      BOBA_CONFIG: /app/config.toml
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      CONFLUENCE_TOKEN_FILE: /run/secrets/confluence_token
    secrets:
      - litellm_api_key
      - confluence_token
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/boba/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - default

  boba-chainlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: boba-chainlit
    command: ["python3", "-m", "boba_chainlit"]
    volumes:
      - ./import:/app/import
      - ./config/config.toml:/app/config.toml:ro
      - ./chainlit/.chainlit:/app/chainlit/.chainlit
    environment:
      BOBA_CONFIG: /app/config.toml
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      CONFLUENCE_TOKEN_FILE: /run/secrets/confluence_token
      CHAINLIT_APP_ROOT: /app/chainlit
      CHAINLIT_AUTH_SECRET_FILE: /run/secrets/chainlit_auth_secret
    secrets:
      - litellm_api_key
      - confluence_token
      - chainlit_auth_secret
    restart: always
    networks:
      - default

networks:
  default:
    name: docker
    external: true

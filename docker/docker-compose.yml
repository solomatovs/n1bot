secrets:
  litellm_api_key:
    file: secrets/litellm_api_key
  confluence_token:
    file: secrets/confluence_token
  chainlit_auth_secret:
    file: secrets/chainlit_auth_secret

services:
  chainlit:
    hostname: boba-chainlit
    image: boba-chainlit:latest
    build:
      # context — корень репо, чтобы COPY src/... из Dockerfile находил пути
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python3", "-m", "boba.chainlit"]
    working_dir: /app/chainlit
    environment:
      BOBA_CONFIG: /app/config/config.toml
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      WORKSPACE_BASE_DIR: /app/workspaces
      LOG_FILE: /app/logs/chainlit.log
    volumes:
      - ./config:/app/config:ro
      - ../src/chainlit/.chainlit/config.toml:/app/chainlit/.chainlit/config.toml:ro
      - ../src/chainlit/chainlit.md:/app/chainlit/chainlit.md:ro
      - chainlit-workspaces:/app/workspaces
      - chainlit-logs:/app/logs
    secrets:
      - litellm_api_key
      - chainlit_auth_secret
    expose:
      - "8080"
    # Перекрываем healthcheck из boba-base (унаследованный от streamlit,
    # стучится в :8501 — всегда падает). Chainlit отвечает на /boba/healthz.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/boba/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - boba-chainlit
    restart: unless-stopped

volumes:
  chainlit-workspaces:
  chainlit-logs:

networks:
  default:
    name: docker
    external: true

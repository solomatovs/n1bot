[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boba-api"
version = "0.1.0"
description = "Boba FastAPI server"
authors = ["Sergei Solomatov"]
packages = [{ include = "boba_api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boba-infra = { path = "../../src/boba-infra", develop = true }
fastapi = "*"
uvicorn = { version = "*", extras = ["standard"] }
